<!--
  FRUITS ISLAND — Chapter One ("The First Slice")
  Single directory, zero dependencies, fully offline: open this file in any
  modern desktop browser. All art is generated at runtime (pixel strings +

  Script order matters (top-level consts are shared between classic scripts):
  core -> audio -> sprites -> props -> items -> dialogue -> npcs -> world ->

<script>
/* ============================================================================
   FRUITS ISLAND — Chapter One ("The First Slice")
   js/core.js — constants, utils, RNG, pixel font, text rendering, panels

   Project layout (classic scripts, loaded in order by index.html):
     core.js     — this file: math, RNG, canvas helpers, font, text, panels
     audio.js    — WebAudio engine (all sound is procedural; no files needed)
     sprites.js  — palette, sheet factory, ALL character/portrait/icon art
     props.js    — procedural prop painters (trees, huts, shrine, wreck, ...)
     items.js    — item database + Inventory runtime
     dialogue.js — dialogue engine (nodes, typewriter, choices)
     npcs.js     — NPC definitions and dialogue scripts (story-flag aware)
     world.js    — areas (beach, jungle trail, village, tavern): terrain,
                  props, exits, encounter zones, interactables
     combat.js   — battle system: menu, timing attack, bullet-box dodging
     ui.js       — HUD, dialogue box, inventory screen, pause, title, intro
     game.js     — game state, player, camera, saves, transitions, main loop
   ========================================================================== */
'use strict';

/* ------------------------------------------------------------- 1. CONSTANTS */
const VW = 384, VH = 216, TILE = 16;

/* ---------------------------------------------------------------- 2. UTILS */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, s) => v < t ? Math.min(t, v + s) : Math.max(t, v - s);
const mdist = (x0, y0, x1, y1) => Math.hypot(x1 - x0, y1 - y0);
const ease = (t) => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);

// deterministic RNG: the island must look identical on every run
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// stable 2D hash for per-pixel terrain noise
function hash2(x, y) {
  // 32-bit integer mix (Math.imul keeps everything in the int32 domain —
  // plain multiplication silently loses the high bits and biases the result)
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function distToSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = clamp(t, 0, 1);
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.hypot(px - cx, py - cy);
}
function distToPath(px, py, pts) {
  let d = 1e9;
  for (let i = 0; i < pts.length - 1; i++) {
    d = Math.min(d, distToSeg(px, py, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]));
  }
  return d;
}
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return { c, x };
}

// tiny painting helpers shared by every procedural painter
function fillCircle(x, cx, cy, r, col) {
  if (r <= 0) return;
  x.fillStyle = col;
  for (let dy = -Math.round(r); dy <= Math.round(r); dy++) {
    const dx = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)));
    x.fillRect(Math.round(cx - dx), Math.round(cy + dy), dx * 2 + 1, 1);
  }
}
function px(x, x0, y0, col) {
  x.fillStyle = col;
  x.fillRect(Math.round(x0), Math.round(y0), 1, 1);
}
function ring(x, cx, cy, r, squash, col) {
  for (let a = 0; a < Math.PI * 2; a += 0.055) {
    px(x, cx + Math.cos(a) * r, cy + Math.sin(a) * r * (squash || 1), col);
  }
}

/* ------------------------------------------------------------ 3. PIXEL FONT */

  '2':'01110|10001|00001|00110|01000|10000|11111',

  'd':'00001|00001|01111|10001|10001|10001|01111',
  'e':'00000|00000|01110|10001|11111|10000|01110',

  'm':'00000|00000|11110|10101|10101|10101|10101',

  '"':'01010|01010|00000|00000|00000|00000|00000',
  '-':'00000|00000|00000|01110|00000|00000|00000',
  ':':'00000|00100|00000|00000|00100|00000|00000',
  ';':'00000|00100|00000|00000|00100|00100|01000',
  '(':'00010|00100|01000|01000|01000|00100|00010',
  ')':'01000|00100|00010|00010|00010|00100|01000',
  '/':'00001|00010|00010|00100|01000|01000|10000',
  '&':'01100|10010|10100|01000|10101|10010|01101',
  '>':'01000|00100|00010|00001|00010|00100|01000',
  '<':'00010|00100|01000|10000|01000|00100|00010',
  '[':'00110|00100|00100|00100|00100|00100|00110',
  ']':'01100|00100|00100|00100|00100|00100|01100',
  '%':'10001|00010|00100|00100|01000|10001|00000',
  '*':'00000|10101|01110|11111|01110|10101|00000',
  '+':'00000|00100|00100|11111|00100|00100|00000',
  '=':'00000|00000|11111|00000|11111|00000|00000',
  '#':'01010|01010|11111|01010|11111|01010|01010',
  '_':'00000|00000|00000|00000|00000|00000|11111',
  '·':'00000|00000|00000|01100|01100|00000|00000'

const FONT = {};
for (const ch in FONT_SRC) FONT[ch] = FONT_SRC[ch].split('|');
const FONT_FALLBACK = FONT['?'];

function drawText(ctx, str, x, y, color, scale, shadow) {
  scale = scale || 1;
  if (shadow) drawTextRaw(ctx, str, x + scale, y + scale, shadow, scale);
  drawTextRaw(ctx, str, x, y, color, scale);
}
function drawTextRaw(ctx, str, x, y, color, scale) {
  ctx.fillStyle = color;
  let cx = Math.round(x);
  const cy = Math.round(y);
  for (let i = 0; i < str.length; i++) {
    const g = FONT[str[i]] || (str[i] === ' ' ? FONT[' '] : FONT_FALLBACK);
    for (let r = 0; r < 7; r++) {
      const row = g[r];
      for (let c = 0; c < 5; c++) {
        if (row[c] === '1') ctx.fillRect(cx + c * scale, cy + r * scale, scale, scale);
      }
    }
    cx += 6 * scale;
  }
}
function textWidth(str, scale) {
  scale = scale || 1;
  return str.length === 0 ? 0 : str.length * 6 * scale - scale;
}

// word wrap with cache (used by dialogue + panels)
const WRAP_CACHE = {};
function wrapText(text, maxChars) {
  const key = maxChars + '|' + text;
  if (WRAP_CACHE[key]) return WRAP_CACHE[key];
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    if (cur === '') cur = w;
    else if ((cur + ' ' + w).length <= maxChars) cur += ' ' + w;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  WRAP_CACHE[key] = lines;
  return lines;
}

/* ---------------------------------------------------------------- 4. PANELS */
// The one and only panel style, used by every menu / box in the game.
// Dark slate with a soft bevel and gold corner ticks — pixel-consistent.
function drawPanel(ctx, x, y, w, h, alpha) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = '#0b141c'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#17252f'; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  ctx.fillStyle = '#243a48'; ctx.fillRect(x + 2, y + 2, w - 4, 1);
  ctx.fillStyle = '#0f1a22'; ctx.fillRect(x + 2, y + h - 3, w - 4, 1);
  ctx.fillStyle = '#e4c97c';
  ctx.fillRect(x + 1, y + 1, 2, 1); ctx.fillRect(x + 1, y + 1, 1, 2);
  ctx.fillRect(x + w - 3, y + 1, 2, 1); ctx.fillRect(x + w - 2, y + 1, 1, 2);
  ctx.fillRect(x + 1, y + h - 3, 1, 2); ctx.fillRect(x + 1, y + h - 2, 2, 1);
  ctx.fillRect(x + w - 2, y + h - 3, 1, 2); ctx.fillRect(x + w - 3, y + h - 2, 2, 1);
  ctx.globalAlpha = 1;
}

// subtle "key item gold" divider used in menus
function drawDivider(ctx, x, y, w) {
  ctx.fillStyle = '#e4c97c';
  ctx.fillRect(x, y, w, 1);
  ctx.fillStyle = '#6b5a2e';
  ctx.fillRect(x, y + 1, w, 1);

<script>
/* ============================================================================
   js/audio.js — procedural audio engine (WebAudio only, zero asset files)

   Design notes
   - Every sound in the game is synthesized: ambience layers (ocean, wind, rain,
     hearth murmur, island hum), a tiny lookahead music sequencer with three
     original loops (title / village / battle) and one-shot stings.
   - The old GameMaker .ogg/.mp3 exports in /sounds were evaluated but are NOT
     used: loading them from file:// is blocked by browser CORS and embedding
     6.6 MB of audio as base64 would bloat the single build. Documented in
     docs/TECH_NOTES.md §Audio with a swap-in guide.
   - Every public call is guarded: audio failure can never break the game.
   ========================================================================== */
'use strict';

const AudioSys = (() => {
  let ctx = null, master = null, musicBus = null, ambBus = null;
  let enabled = true, started = false, volume = 1;   // volume: 1, .5, 0 steps
  const MASTER = 0.8;        // was 0.55 — players reported the game as near-silent
  const AMB_BOOST = 2.2;     // area mixes are authored quiet; scale once, here
  const amb = {};           // ambience layer gains by name
  const noiseCache = {};

  function init() {
    if (ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = enabled ? MASTER * volume : 0;
      master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = 1; musicBus.connect(master);
      ambBus = ctx.createGain(); ambBus.gain.value = 1; ambBus.connect(master);
      return true;
    } catch (e) { ctx = null; return false; }
  }
  function resume() {
    if (!ctx && !init()) return;
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
  }
  // call on EVERY first user gesture (keydown, pointerdown, tab visible):
  // creates the context if needed, resumes it, makes sure the ambience
  // layers exist and the current song re-primes instead of bursting.
  function unlock() {
    if (!init()) return;
    let wasSuspended = false;
    try { wasSuspended = ctx.state === 'suspended'; } catch (e) {}
    resume();
    startAmbience();
    if (wasSuspended && seq.song) {
      // scheduling stalled while suspended: restart the song cleanly
      seq.step = 0;
      seq.nextT = ctx.currentTime + 0.12;
    }
  }
  function restartSong(name) {
    seq.song = name;
    seq.step = 0;
    if (ctx) seq.nextT = ctx.currentTime + 0.12;
  }
  function noiseBuffer(seconds, brown) {
    const key = (brown ? 'b' : 'w') + seconds;
    if (noiseCache[key]) return noiseCache[key];
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
      else d[i] = w * 0.6;
    }
    noiseCache[key] = buf;
    return buf;
  }

  /* -------------------------------------------------------- ambience layers */
  function layerNoise(name, opts) {
    // one looping filtered-noise voice on its own gain node
    try {
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer(opts.seconds || 3, !!opts.brown);
      src.loop = true;
      const f = ctx.createBiquadFilter();
      f.type = opts.type || 'lowpass';
      f.frequency.value = opts.freq || 500;
      f.Q.value = opts.q || 0.7;
      const g = ctx.createGain();
      g.gain.value = 0;
      if (opts.lfo) {
        const lfo = ctx.createOscillator(); lfo.frequency.value = opts.lfo;
        const lg = ctx.createGain(); lg.gain.value = opts.lfoAmt || 0.01;
        lfo.connect(lg); lg.connect(g.gain); lfo.start();
      }
      src.connect(f); f.connect(g); g.connect(ambBus);
      src.start();
      amb[name] = g;
    } catch (e) { /* a missing layer is fine */ }
  }
  function startAmbience() {
    if (!init() || started) return;
    started = true;
    try {
      layerNoise('ocean', { brown: true, seconds: 4, freq: 480, lfo: 0.11, lfoAmt: 0.14, base: 0.2 });
      layerNoise('wind', { brown: false, seconds: 3, type: 'bandpass', freq: 880, q: 0.6, lfo: 0.07, lfoAmt: 0.009, base: 0.012 });
      layerNoise('rain', { brown: false, seconds: 2.5, type: 'highpass', freq: 1700, q: 0.4, base: 0.05 });
      layerNoise('hum',  { brown: true, seconds: 5, freq: 140, lfo: 0.05, lfoAmt: 0.02, base: 0.035 });
      layerNoise('hearth', { brown: false, seconds: 2, type: 'bandpass', freq: 240, q: 0.5, lfo: 0.3, lfoAmt: 0.02, base: 0.03 });
    } catch (e) {}
  }
  // crossfade ambience mix per place: {ocean:0..1, wind:.., rain:.., hum:.., hearth:..}
  function setMix(mix, speed) {
    if (!ctx) return;
    speed = speed || 0.6;
    const t = ctx.currentTime;
    for (const k in amb) {
      const target = ((mix && mix[k]) || 0) * AMB_BOOST;
      try { amb[k].gain.cancelScheduledValues(t); amb[k].gain.setTargetAtTime(target, t, 1 / speed); } catch (e) {}
    }
  }

  /* ----------------------------------------------------------- one-shot sfx */
  function blip(freq, dur, type, vol, slideTo) {
    if (!ctx || !enabled || volume === 0) return;
    try {
      const t0 = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  function burst(dur, freq, q, vol, type) {
    if (!ctx || !enabled || volume === 0) return;
    try {
      const t0 = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer(0.4, false);
      const f = ctx.createBiquadFilter();
      f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain();
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  function tone(freq, dur, type, vol, when, bus) {
    // used by the sequencer: schedule at absolute time `when`
    const t0 = when;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    g.gain.setValueAtTime(vol, t0 + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(bus || musicBus);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  /* ------------------------------------------------------- music sequencer */
  // Original, tiny loops. Steps are 16ths at given BPM; note = step index.
  // freq helpers
  const N = {
    C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
    C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00,
    A2: 110, F2: 87.31, G2: 98, D2: 73.42, E2: 82.41, C2: 65.41, B2: 123.47
  };
  const SONGS = {
    title: {
      bpm: 72, bars: 4, stepsPerBar: 16,
      lead: [ // gentle melancholy loop (A minor)
        [0, N.A4, 1.8], [4, N.C5, 1.2], [6, N.B4, 0.9], [8, N.E4, 1.8],
        [16, N.G4, 1.4], [20, N.A4, 1.2], [22, N.G4, 0.8], [24, N.E4, 2.2],
        [32, N.F4, 1.6], [36, N.E4, 1.2], [38, N.D4, 0.9], [40, N.C4, 2.4],

      ],
      leadVol: 0.10, bassVol: 0.11, leadType: 'triangle', bassType: 'sine'
    },
    village: {
      bpm: 88, bars: 4, stepsPerBar: 16,
      lead: [ // warm little waltz-ish loop (C major, D minor turn)
        [0, N.E4, 1.2], [2, N.G4, 1.2], [4, N.C5, 2.0], [8, N.B4, 0.8], [10, N.G4, 1.6],
        [16, N.A4, 1.2], [18, N.F4, 1.2], [20, N.A4, 2.0], [24, N.G4, 1.6], [26, N.E4, 1.2],
        [32, N.F4, 1.0], [34, N.E4, 1.0], [36, N.D4, 1.6], [40, N.E4, 1.6], [42, N.F4, 1.2],
        [48, N.G4, 1.6], [52, N.E4, 1.2], [54, N.D4, 1.0], [56, N.C4, 2.4]
      ],
      bass: [
        [0, N.C3, 2.6], [4, N.G2, 2.6], [8, N.E2, 2.6], [12, N.G2, 2.6],
        [16, N.F2, 2.6], [20, N.C3, 2.6], [24, N.A2, 2.6], [28, N.F2, 2.6],
        [32, N.D3, 2.6], [36, N.A2, 2.6], [40, N.G2, 2.6], [44, N.B2, 2.6],
        [48, N.C3, 2.6], [52, N.G2, 2.6], [56, N.C3, 2.6]
      ],
      leadVol: 0.09, bassVol: 0.10, leadType: 'triangle', bassType: 'sine'
    },
    battle: {
      bpm: 132, bars: 2, stepsPerBar: 16,
      lead: [ // tense pulse (D minor)
        [0, N.D4, 0.7], [2, N.D4, 0.5], [4, N.F4, 0.7], [6, N.D4, 0.5],
        [8, N.A4, 0.7], [10, N.G4, 0.5], [12, N.F4, 0.7], [14, N.E4, 0.5],
        [16, N.D4, 0.7], [18, N.D4, 0.5], [20, N.F4, 0.7], [22, N.G4, 0.5],
        [24, N.A4, 0.9], [27, N.G4, 0.6], [29, N.F4, 0.6], [30, N.E4, 0.8]
      ],
      bass: [
        [0, N.D2, 0.9], [3, N.D2, 0.6], [6, N.D2, 0.6], [8, N.A2, 0.9], [11, N.A2, 0.6],
        [14, N.A2, 0.6], [16, N.D2, 0.9], [19, N.D2, 0.6], [22, N.C3, 0.7],
        [24, N.A2, 0.9], [27, N.E2, 0.6], [30, N.A2, 0.6]
      ],
      leadVol: 0.085, bassVol: 0.11, leadType: 'square', bassType: 'triangle'
    }
  };
  const seq = { song: null, step: 0, nextT: 0 };
  function playSong(name) {
    if (seq.song === name) return;
    seq.song = name;
    seq.step = 0;
    if (ctx) seq.nextT = ctx.currentTime + 0.08;
  }
  function stopSong() { seq.song = null; }
  function tickMusic() {
    if (!ctx || !enabled || volume === 0 || !seq.song) return;
    try {
      const s = SONGS[seq.song];
      if (!s) return;
      const stepDur = 60 / s.bpm / 4;
      // if the context was suspended the clock jumped: never chase the past
      if (seq.nextT < ctx.currentTime - 0.25) seq.nextT = ctx.currentTime + 0.05;
      while (seq.nextT < ctx.currentTime + 0.18) {
        const st = seq.step % (s.bars * s.stepsPerBar);
        for (const nt of s.lead) if (nt[0] === st) tone(nt[1], nt[2] * stepDur, s.leadType, s.leadVol, seq.nextT);
        for (const nt of s.bass) if (nt[0] === st) tone(nt[1], nt[2] * stepDur, s.bassType, s.bassVol, seq.nextT);
        seq.step++;
        seq.nextT += stepDur;
      }
    } catch (e) { seq.song = null; }
  }

  /* -------------------------------------------------------------- the API */
  let stepSide = 0;
  return {
    init, resume, unlock, startAmbience, setMix, playSong, restartSong, stopSong, tickMusic,
    get ctx() { return ctx; },
    get enabled() { return enabled; },
    get volume() { return volume; },
    setEnabled(on) {
      enabled = on;
      if (!on) { stopSong(); }
      if (master) master.gain.value = on ? MASTER * volume : 0;
      if (on) { resume(); startAmbience(); }
    },
    cycleVolume() {
      volume = volume === 1 ? 0.5 : volume === 0.5 ? 0 : 1;
      if (master) master.gain.value = enabled ? MASTER * volume : 0;
      return volume;
    },
    /* ------ sfx ------ */
    footstep(surface) {
      if (!enabled) return;
      stepSide = 1 - stepSide;
      if (surface === 'sand') burst(0.07, 620, 1.4, 0.032);
      else if (surface === 'wood') burst(0.06, 240, 2.2, 0.05);
      else burst(0.07, 330, 1.4, 0.024);
    },
    type() { blip(500 + Math.random() * 50, 0.024, 'square', 0.018); },
    advance() { blip(660, 0.05, 'triangle', 0.05, 880); },
    back() { blip(440, 0.06, 'triangle', 0.045, 300); },
    select() { blip(760, 0.07, 'triangle', 0.05, 980); },
    examine() { blip(440, 0.1, 'triangle', 0.05, 660); },
    talk() { blip(392, 0.09, 'square', 0.032, 523); },
    open() { blip(320, 0.12, 'triangle', 0.055, 520); },
    close() { blip(520, 0.1, 'triangle', 0.048, 320); },
    stepObj() { blip(523, 0.12, 'triangle', 0.058, 784); },
    itemGet() { blip(587, 0.09, 'square', 0.055); setTimeout(() => blip(784, 0.12, 'square', 0.055), 90); setTimeout(() => blip(1175, 0.18, 'triangle', 0.06), 190); },
    heal() { blip(523, 0.12, 'sine', 0.065, 784); setTimeout(() => blip(659, 0.16, 'sine', 0.06, 1046), 110); },
    save() { blip(660, 0.1, 'triangle', 0.06); setTimeout(() => blip(880, 0.16, 'triangle', 0.06), 100); setTimeout(() => blip(1320, 0.22, 'sine', 0.05), 210); },
    warn() {
      if (!ctx || !enabled) return;
      try {
        const freqs = [110, 130.81, 164.81, 220];
        const t0 = ctx.currentTime;
        freqs.forEach((f, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = i < 2 ? 'sine' : 'triangle';
          o.frequency.value = f;
          g.gain.setValueAtTime(0, t0);
          g.gain.linearRampToValueAtTime(0.05 - i * 0.008, t0 + 1.1);
          g.gain.linearRampToValueAtTime(0.0001, t0 + 6.5);
          const trem = ctx.createOscillator(); trem.frequency.value = 0.9 + i * 0.13;
          const tg = ctx.createGain(); tg.gain.value = 0.012;
          trem.connect(tg); tg.connect(g.gain); trem.start(t0); trem.stop(t0 + 6.6);
          o.connect(g); g.connect(master);
          o.start(t0); o.stop(t0 + 6.6);
        });
      } catch (e) {}
    },
    thunder() {
      if (!ctx || !enabled) return;
      try {
        const t0 = ctx.currentTime;
        // sub-bass drop + filtered rumble, falling like real thunder
        burst(1.6, 90, 0.5, 0.16, 'lowpass');
        setTimeout(() => burst(1.1, 220, 0.5, 0.09, 'lowpass'), 180);
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(70, t0);
        o.frequency.exponentialRampToValueAtTime(30, t0 + 1.4);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(0.14, t0 + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);
        o.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + 1.7);
      } catch (e) {}
    },
    moan() {
      if (!ctx || !enabled) return;
      blip(72, 2.6, 'sine', 0.05, 48);
      blip(108, 2.1, 'triangle', 0.016, 74);
      burst(2.0, 220, 0.9, 0.011, 'lowpass');
    },
    bird() {
      if (!ctx || !enabled) return;
      const base = 1400 + Math.random() * 900;
      blip(base, 0.06, 'sine', 0.016, base * 1.35);
      setTimeout(() => blip(base * 0.92, 0.05, 'sine', 0.012, base * 1.2), 95);
    },
    crash() { // ship destruction sting
      if (!ctx || !enabled) return;
      burst(1.6, 140, 0.5, 0.2, 'lowpass');
      blip(220, 0.5, 'sawtooth', 0.06, 60);
      setTimeout(() => burst(0.8, 700, 0.8, 0.07), 160);
    },
    /* ------ battle ------ */
    battleStart() {
      if (!ctx || !enabled) return;
      blip(196, 0.16, 'square', 0.05);
      setTimeout(() => blip(233, 0.16, 'square', 0.05), 130);
      setTimeout(() => blip(311, 0.3, 'square', 0.06, 220), 260);
    },
    swing() { burst(0.12, 900, 1.2, 0.06, 'bandpass'); },
    hit() {
      if (!ctx || !enabled) return;
      burst(0.16, 180, 1.0, 0.14, 'lowpass');
      blip(160, 0.14, 'square', 0.06, 80);
    },
    hurt() {
      if (!ctx || !enabled) return;
      blip(300, 0.2, 'sawtooth', 0.06, 90);
      burst(0.18, 400, 0.8, 0.05);
    },
    graze() { blip(1200, 0.03, 'sine', 0.02); },
    dodgeTick() { blip(900, 0.02, 'sine', 0.012); },
    spare() {
      if (!ctx || !enabled) return;
      blip(523, 0.12, 'triangle', 0.04);
      setTimeout(() => blip(659, 0.12, 'triangle', 0.04), 110);
      setTimeout(() => blip(784, 0.2, 'triangle', 0.045), 220);
    },
    victory() {
      if (!ctx || !enabled) return;
      [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip(f, 0.16, 'square', 0.035), i * 110));
    },
    defeat() {
      if (!ctx || !enabled) return;
      [330, 262, 196, 131].forEach((f, i) => setTimeout(() => blip(f, 0.3, 'triangle', 0.045), i * 220));
    },
    flee() { blip(880, 0.1, 'square', 0.03, 440); },
    encounterZap() {
      if (!ctx || !enabled) return;
      blip(160, 0.22, 'sawtooth', 0.05, 640);
      burst(0.22, 1200, 0.7, 0.04);
    }
  };
})();

<script>
/* ============================================================================
   js/sprites.js — palette, sheet factory and ALL character art

   Sprite canon (do not drift):
   - Every character uses a 1px dark outline (PAL.k) and top-left light.
   - SAILOR: 16x20. White sailor cap w/ blue band + gold emblem, dark brown
     hair, red neckerchief, blue peacoat w/ gold buttons, dark green trousers,
     brown boots. 4 directions x 4 walk frames (true stride/pass alternation:
     frames 0/2 are MIRRORED strides, 1/3 are pass poses drawn 1px higher at
     runtime), plus idle breath + blink + a "washed up" lying pose.
   - VAX (locked design): 16x22. Messy dark brown hair (spiky silhouette),
     pale complexion, GREY left eye + bright RED right eye (the red one never
     blinks), thick red scarf with one long end hanging over the chest, black
     long-sleeved jacket over a dark charcoal shirt, baggy light grey
     trousers, red-and-white sneakers (red dominant). Idle = slow weight shift
     + scarf sway + rare hair flick; talk frames bob with an open mouth.
   - Villagers: 16x18-ish, same outline/palette rules, 2-frame idle bob,
     talk variant via mouth pixel.
   ========================================================================== */
'use strict';

/* ------------------------------------------------------------------ PALETTE */
const PAL = {
  k: '#161a2b', // outline (every character, every prop)
  K: '#232a40', // soft outline / deep shade
  w: '#f4efe4', W: '#d9d2c6',           // off-whites
  s: '#f0c290', S: '#c9936a',           // sailor skin
  x: '#ead9c8', X: '#c9ad92',           // vax pale skin
  h: '#4a3226', H: '#33231b',           // dark brown hair (sailor)
  d: '#3a2a1e', D: '#26190f',           // dark brown hair (vax, deeper)
  b: '#2e6f9e', B: '#1f4f78',           // sailor jacket blues
  c: '#cf4b57', C: '#9c3543',           // scarf reds (shared)
  y: '#e8c45a', Y: '#b08f35',           // gold / buttons
  n: '#2f3b4f',                         // charcoal shirt / dark cloth
  g: '#3c5c46', G: '#2a4534',           // sailor trousers green
  j: '#1d2028', J: '#12141a',           // vax jacket black
  v: '#b6bac2', V: '#8b909a',           // vax baggy grey trousers
  R: '#e23a2e',                         // vax red eye / sneaker red
  Q: '#97a8b8',                         // vax grey eye
  z: '#d8362e', Z: '#9c2721',           // sneaker red / dark
  t: '#a8552e', T: '#7a3a20',           // timber browns
  l: '#4f9d5d', L: '#37774a', m: '#79c06e', // leaf greens
  e: '#e9a23b',                         // fruit orange
  r: '#c85a3c',                         // rust
  p: '#7d5ba6', P: '#533a75', q: '#a884c9', // plum (memory / shrine)
  i: '#2b4550', f: '#6fc3b8', u: '#8fd8c3',
  o: '#e08a4c',                         // orange
  A: '#d98f4e',                         // ali sama skin (warm tan)
  a: '#8a2f3d',                         // ali dress wine
  u2: '#3f8f6f'                         // (reserved)
};

/* --------------------------------------------------------- SHEET FACTORY */
// Turns char-row art into a canvas. Rows shorter than the first are padded,
// longer rows are clipped — art can never draw outside its own bounds.
function sheet(rows, pal) {
  pal = pal || PAL;
  const h = rows.length, w = rows[0].length;
  const mk = makeCanvas(w, h);
  mk.c.__rows = rows;   // kept for the dev-time art audit (tools/harness.mjs)
  mk.c.__pal = pal;      // (ditto)
  for (let r = 0; r < h; r++) {
    const row = rows[r];
    for (let q = 0; q < w && q < row.length; q++) {
      const ch = row[q];
      if (ch === '.' || ch === ' ') continue;
      const col = pal[ch];
      if (!col) continue;
      mk.x.fillStyle = col;
      mk.x.fillRect(q, r, 1, 1);
    }
  }
  return mk.c;
}
// replace whole rows of a base sheet (returns new row array)
function mutate(base, changes) {
  const rows = base.slice();
  for (const k in changes) rows[+k] = changes[+k];
  return rows;
}
// shift a horizontal band of rows by dx columns (used for weight-shift idles)
function shiftRows(rows, dx, from, to) {
  const out = rows.slice();
  for (let r = from; r <= to && r < rows.length; r++) {
    const line = rows[r];
    if (dx > 0) out[r] = '.'.repeat(dx) + line.slice(0, line.length - dx);
    else if (dx < 0) out[r] = line.slice(-dx) + '.'.repeat(-dx);
  }
  return out;
}

const SPR = {};

/* =========================================================== THE SAILOR === */
/* 16x20. Frames: 0 & 2 = opposed strides, 1 & 3 = pass pose (drawn 1px up). */
function buildSailorSprites() {
  // ---------------- shared bodies ----------------
  const BODY_DOWN = [
    '.....kkkkkk.....', //  0 cap top
    '....kwwwwwwk....', //  1
    '....kwwwwwwk....', //  2
    '....kbbbybbk....', //  3 cap band + emblem
    '...kkkkkkkkkk...', //  4 brim
    '...khsssssshk...', //  5 forehead (hair frames the face)
    '...khsksskshk...', //  6 eyes
    '...khsssssshk...', //  7
    '....kssssssk....', //  8 chin
    '....kcccccck....', //  9 neckerchief
    '....kcccccck....', // 10
    '..kbbbbbbbbbbk..', // 11 shoulders
    '..kbbbbyybbbbk..', // 12 chest + buttons
    '..ksbbbbbbbbsk..', // 13 hands at sides
    '..kkbbbbbbbbkk..', // 14 hem
  ];
  const LEGS_IDLE = [
    '...knnnyynnnk...', // 15 belt
    '...kGGGGGGGGk...', // 16
    '...kGGGkkGGGk...', // 17
    '....kGGkkGGk....', // 18
    '....kTTkkTTk....', // 19 boots
  ];
  // stride A: left leg planted, right foot lifted

    '....kGGkkGGk....',
    '....kTTkkTTk....',

  // arm swing: opposite arm forward (visible), other tucked

  const BODY_UP = [

    '....kwwwwwwk....',
    '....kwwwwwwk....',

    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '....khhhhhhk....',

    '..kbbbbbbbbbbk..',
    '..kbbbbbbbbbbk..',
    '..ksbbbbbbbbsk..',
    '..kkbbbbbbbbkk..',
  ];
  const BODY_SIDE = [ // facing right
    '.....kkkkkk.....',
    '....kwwwwwwk....',
    '....kwwwwwwk....',
    '....kbbbbbbk....',
    '...kkkkkkkkkk...',
    '...khhsssssk....', // hair at the back, face forward
    '...khhsssksk....', // one eye
    '...khhsssssk....',
    '....khssssk.....',
    '.....kcccck.....', // scarf band
    '.....kcccckc....', // scarf tail begins at the chest
    '....kbbbbbbk....',
    '....kbbbbbbk....',
    '....kbbbbssk....', // hand forward
    '....kkbbbbkk....',
  ];
  const SIDE_ARMS_A = mutate(BODY_SIDE, { 13: '....kbbbbssk....' }); // hand fwd
  const SIDE_ARMS_B = mutate(BODY_SIDE, { 13: '....ksbbbbbk....' }); // hand back
  const SLEGS_IDLE = [
    '.....knnnnk.....',
    '....kGGGGGk.....',
    '....kGGGGGk.....',
    '....kGGkGGk.....',
    '....kTTkTTk.....',
  ];
  // side stride A: forward (right) leg extended right, back leg trailing
  const SLEGS_A = [
    '.....knnnnk.....',
    '....kGGGGGk.....',
    '....kGGGkGGk....',
    '...kGGk...kGGk..',
    '...kTTk...kTTk..',
  ];
  // side stride B: opposite stride
  const SLEGS_B = [
    '.....knnnnk.....',
    '....kGGGGGk.....',
    '....kGGkGGGk....',
    '..kGGk...kGGk...',
    '..kTTk...kTTk...',
  ];
  const SLEGS_PASS = [
    '.....knnnnk.....',
    '....kGGGGGk.....',
    '....kGGGGk......',
    '....kGGkGGk.....',
    '....kTTkTTk.....',
  ];

  const join = (body, legs) => body.concat(legs);

  // DOWN: 0 strideA, 1 pass, 2 strideB, 3 pass
  SPR.p_down0 = sheet(join(ARMS_A, LEGS_A));
  SPR.p_down1 = sheet(join(BODY_DOWN, LEGS_PASS));
  SPR.p_down2 = sheet(join(ARMS_B, LEGS_B));
  SPR.p_down3 = sheet(join(BODY_DOWN, LEGS_PASS));
  // UP
  SPR.p_up0 = sheet(join(BODY_UP, LEGS_A));

  SPR.p_up2 = sheet(join(BODY_UP, LEGS_B));

  SPR.p_right0 = sheet(join(SIDE_ARMS_A, SLEGS_A));

  SPR.p_right2 = sheet(join(SIDE_ARMS_B, SLEGS_B));
  SPR.p_right3 = sheet(join(BODY_SIDE, SLEGS_PASS));
  // IDLE + BLINK (breath bob is a runtime 1px dip)
  SPR.p_down_idle = sheet(join(BODY_DOWN, LEGS_IDLE));
  SPR.p_down_blink = sheet(join(mutate(BODY_DOWN, { 6: '...khsSssSshk...' }), LEGS_IDLE));
  SPR.p_up_idle = sheet(join(BODY_UP, LEGS_IDLE));
  SPR.p_right_idle = sheet(join(BODY_SIDE, SLEGS_IDLE));
  SPR.p_right_blink = sheet(join(mutate(BODY_SIDE, { 6: '...khhsssSsk....' }), SLEGS_IDLE));

  // washed-up pose (intro): lying on his back in the sand, 22x9
  SPR.p_lying = sheet([
    '........................',
    '........................',
    '......kkkk..k...........',
    '...kkkwwwwkkck..........',
    '..khhbsssskcck..........',
    '..kbbbbssGGGGkk.........',
    '..kbbbbbbbbGGGkkk.......',
    '...kbbbbbkGGk..kTTk.....',
    '....kkkkk.kkk...kkk.....'
  ]);
}

/* ================================================================ VAX ===== */
/* 16x22 — LOCKED DESIGN. See file header. Red eye (right) never blinks.     */
function buildVaxSprites() {
  const DOWN0 = [
    '...k..kk..k.....', //  0 hair spike tips
    '...kdkddkkddk...', //  1 messy edge
    '..kddddddddddk..', //  2
    '..kddddddddddk..', //  3
    '..kdDdddddDddk..', //  4 strand shadows

/* ===================================================== ENEMY BATTLE ART === */
/* Painted (not char-mapped) so bosses stay organic. ~48px tall, centered.  */
function paintCrabApple() {
  // A crab wearing an apple as a shell. It is very proud of the apple.
  const { c, x } = makeCanvas(52, 44);
  const bx = 26, by = 24;
  // legs (angular, 3 per side)
  const leg = (sx, dir, lift) => {
    for (let i = 0; i < 7; i++) {
      px(x, sx + dir * i * 2.4, by + 9 - Math.sin(i / 6 * Math.PI) * (4 + lift), '#8f2b38');
      px(x, sx + dir * i * 2.4, by + 9 - Math.sin(i / 6 * Math.PI) * (4 + lift) + 1, '#5f1d26');
    }
  };
  leg(14, -1, 2); leg(10, -1, 5); leg(6, -1, 3);
  leg(38, 1, 2); leg(42, 1, 5); leg(46, 1, 3);
  // pincers
  const pincer = (px0, py0, dir) => {
    fillCircle(x, px0, py0, 4.4, '#7d1f2c');
    fillCircle(x, px0, py0, 3.4, '#a63340');
    fillCircle(x, px0 + dir, py0 - 1, 1.8, '#d15460');
    px(x, px0 + dir * 5, py0 - 2, '#7d1f2c'); px(x, px0 + dir * 5, py0 - 3, '#7d1f2c');
    px(x, px0 + dir * 5, py0 + 1, '#7d1f2c');
  };
  pincer(8, 16, -1); pincer(44, 16, 1);
  // apple shell
  fillCircle(x, bx, by, 11, '#6e1620');
  fillCircle(x, bx, by, 10, '#a81f2c');
  fillCircle(x, bx - 2, by - 2, 8, '#c93340');
  fillCircle(x, bx - 4, by - 4, 4.4, '#e05a63');
  px(x, bx - 5, by - 5, '#f7a6a6');
  // dimple + stem + leaf
  px(x, bx, by - 9, '#5f4a2a'); px(x, bx, by - 10, '#7a5f38');
  x.fillStyle = '#37774a'; x.fillRect(bx + 1, by - 12, 4, 2);
  px(x, bx + 4, by - 13, '#4f9d5d');
  // eyes under the shell rim
  x.fillStyle = '#f4efe4';
  x.fillRect(bx - 6, by + 5, 4, 4); x.fillRect(bx + 2, by + 5, 4, 4);
  x.fillStyle = '#161a2b';
  x.fillRect(bx - 5, by + 6, 2, 2); x.fillRect(bx + 3, by + 6, 2, 2);
  // little mouth
  x.fillStyle = '#4a0d14';
  x.fillRect(bx - 2, by + 9, 4, 1);
  return c;
}

function paintBramblett() {
  // A bramble bush that learned to walk. Nervous. Berry-cluster eyes.
  const { c, x } = makeCanvas(50, 46);
  const bx = 25, baseY = 45;
  // root-legs
  const root = (x0, lean) => {
    for (let i = 0; i < 9; i++) {
      px(x, x0 + lean * i * 0.8, baseY - i - Math.sin(i * 0.9) * 1.2, i < 4 ? '#26190f' : '#37774a');
      px(x, x0 + lean * i * 0.8 + 1, baseY - i - Math.sin(i * 0.9) * 1.2, '#1d3d2a');
    }
  };
  root(16, -0.7); root(24, 0.15); root(32, 0.8);
  // thorny body mass
  fillCircle(x, bx, baseY - 22, 12, '#1d3d2a');
  fillCircle(x, bx - 5, baseY - 26, 8, '#2a5a38');
  fillCircle(x, bx + 6, baseY - 25, 8.4, '#2a5a38');
  fillCircle(x, bx, baseY - 30, 8, '#37774a');
  fillCircle(x, bx - 3, baseY - 32, 5, '#4f9d5d');
  // bramble texture: thorns
  for (let i = 0; i < 26; i++) {
    const a = i * 2.39, r = 7 + (i % 4) * 2.4;
    px(x, bx + Math.cos(a) * r, baseY - 26 + Math.sin(a) * r * 0.8, i % 3 ? '#26190f' : '#5fae63');
    px(x, bx + Math.cos(a) * r, baseY - 25 + Math.sin(a) * r * 0.8, '#161a2b');
  }
  // berry clusters
  const berry = (bxx, byy) => {
    fillCircle(x, bxx, byy, 2.2, '#6e1620'); fillCircle(x, bxx, byy, 1.6, '#a81f2c'); px(x, bxx - 1, byy - 1, '#d15460');
  };
  berry(bx - 8, baseY - 30); berry(bx + 8, baseY - 27); berry(bx + 3, baseY - 34); berry(bx - 4, baseY - 22);
  // eyes: two pale berries with pupils
  fillCircle(x, bx - 5, baseY - 27, 3, '#f4efe4'); fillCircle(x, bx + 5, baseY - 27, 3, '#f4efe4');
  x.fillStyle = '#161a2b';
  x.fillRect(bx - 5, baseY - 27, 2, 2); x.fillRect(bx + 4, baseY - 27, 2, 2);
  return c;
}

function paintGullgazer() {
  // A seagull that has been staring at the island for too long.
  const { c, x } = makeCanvas(56, 44);
  const bx = 28, by = 20;
  // wings (spread, angular)
  const wing = (dir) => {
    for (let i = 0; i < 16; i++) {
      const wy = by + 2 - Math.sin(i / 15 * Math.PI) * 9;
      for (let w = 0; w < 3; w++) {
        px(x, bx + dir * (4 + i * 1.6), wy + w, w === 0 ? '#e8ecef' : w === 1 ? '#c3ccd2' : '#8d99a1');
      }
    }
  };
  wing(-1); wing(1);
  // body
  fillCircle(x, bx, by + 4, 8, '#c3ccd2');
  fillCircle(x, bx, by + 2, 7, '#e8ecef');
  fillCircle(x, bx - 1, by, 4.6, '#f6f8f9');
  // tail
  x.fillStyle = '#c3ccd2'; x.fillRect(bx - 3, by + 11, 6, 2);
  // head
  fillCircle(x, bx, by - 6, 5.4, '#e8ecef');
  fillCircle(x, bx - 1, by - 7, 3.4, '#f6f8f9');
  // the eye: far too large
  fillCircle(x, bx + 1, by - 6, 2.8, '#f4efe4');
  x.fillStyle = '#161a2b'; x.fillRect(bx, by - 7, 2, 2);
  px(x, bx, by - 7, '#5d6b78');
  // beak
  x.fillStyle = '#e8a23b'; x.fillRect(bx + 5, by - 5, 5, 2);
  px(x, bx + 9, by - 5, '#b07224'); px(x, bx + 9, by - 4, '#b07224');
  // legs
  x.fillStyle = '#e8a23b';
  x.fillRect(bx - 3, by + 11, 1, 4); x.fillRect(bx + 2, by + 11, 1, 4);
  x.fillRect(bx - 4, by + 15, 3, 1); x.fillRect(bx + 1, by + 15, 3, 1);
  return c;
}

<script>
/* ============================================================================
   js/props.js — every environment prop, painted procedurally at load time.
   Lighting canon: light from the TOP-LEFT (pale pixels up-left, shadow
   down-right), 1-2px dark outlines, greens slightly desaturated so the
   "tropical paradise" reads a touch dead under the sunshine.
   ========================================================================== */
'use strict';

/* ------------------------------------------------------------------ palms */
function paintPalm(seed, opt) {
  opt = Object.assign({ H: 56, W: 54, trunkH: 21, lean: 1, fronds: 9, coconuts: true }, opt);
  const rng = mulberry32(seed);
  const { c, x } = makeCanvas(opt.W, opt.H);
  const baseX = Math.round(opt.W / 2);
  const line = [];
  for (let i = 0; i <= opt.trunkH; i++) {
    const t = i / opt.trunkH;
    const cx = baseX + Math.round((Math.sin(t * 1.9) * 0.9 + t * 0.5) * opt.lean * 2.6);
    line.push([cx, opt.H - 1 - i]);
  }
  for (let i = 0; i < line.length; i++) {
    const [cx, cy] = line[i];
    const q = i / (line.length - 1);
    const half = q < 0.18 ? 2 : 1;
    x.fillStyle = '#5a2c19'; x.fillRect(cx - half - 1, cy, half * 2 + 3, 1);
    x.fillStyle = '#9c4b29'; x.fillRect(cx - half, cy, half * 2 + 1, 1);
    x.fillStyle = '#b5693c'; x.fillRect(cx - half, cy, half, 1);
    if (i % 3 === 1) { x.fillStyle = '#6b3520'; x.fillRect(cx - half, cy, half * 2 + 1, 1); }
  }
  const [rtx, rty] = line[0];
  x.fillStyle = '#5a2c19'; x.fillRect(rtx - 4, rty, 9, 1);
  x.fillStyle = '#9c4b29'; x.fillRect(rtx - 3, rty - 1, 2, 1); x.fillRect(rtx + 2, rty - 1, 2, 1);
  const [tx, ty] = line[line.length - 1];
  const blade = (ang, len, drop, colTop, colMid, colLow) => {
    for (let s2 = 0; s2 <= len; s2++) {
      const q = s2 / len;
      const fx = tx + Math.cos(ang) * s2 * 1.02;
      const fy = ty + Math.sin(ang) * s2 * 0.72 + q * q * drop;
      const wHalf = (2.6 - q * 2.1) * (1 - q * 0.15);
      const perp = ang + Math.PI / 2;
      const span = Math.max(0, Math.round(wHalf));
      for (let w = -span; w <= span; w++) {
        const col = w < 0 ? colTop : (w === 0 ? colMid : colLow);
        x.fillStyle = col;
        x.fillRect(Math.round(fx + Math.cos(perp) * w), Math.round(fy + Math.sin(perp) * w * 0.7), 1, 1);
      }
    }
  };
  const fronds = [];
  for (let f = 0; f < opt.fronds; f++) {
    const t = f / (opt.fronds - 1);
    const ang = -Math.PI + 0.16 + t * (Math.PI - 0.32) + (rng() - 0.5) * 0.14;
    const len = 14 + Math.sin(f * 1.9) * 3 + rng() * 3;
    fronds.push([ang, len, 10 + rng() * 4]);
  }
  fronds.forEach(([a, l, d]) => blade(a, l, d + 1, '#1c4229', '#274f33', '#224a2d'));
  fronds.forEach(([a, l, d]) => blade(a, l, d, '#57a15c', '#488f56', '#33704a'));
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + (i - 1) * 0.55;
    blade(a, 8 + i * 2, 4, '#71b46c', '#57a15c', '#488f56');
  }
  x.fillStyle = '#274f33'; x.fillRect(tx - 1, ty - 1, 3, 2);
  if (opt.coconuts) {
    x.fillStyle = '#42291a';
    x.fillRect(tx - 3, ty + 2, 2, 2); x.fillRect(tx + 2, ty + 3, 2, 2);
    x.fillStyle = '#5f3d26';
    x.fillRect(tx - 3, ty + 2, 1, 1); x.fillRect(tx + 2, ty + 3, 1, 1);
  }
  return c;
}

/* ----------------------------------------------------------- canopy trees */
function paintCanopyTree(seed, opt) {
  opt = Object.assign({ W: 52, H: 50, fruit: true, fruitColor: '#e9a23b', canopyY: 24 }, opt);
  const rng = mulberry32(seed);
  const { c, x } = makeCanvas(opt.W, opt.H);
  const cx = Math.round(opt.W / 2), baseY = opt.H - 1;
  for (let i = 0; i < 15; i++) {
    const y = baseY - i, off = Math.round(Math.sin(i * 0.22) * 1.2);
    x.fillStyle = i % 4 === 0 ? '#6b3520' : '#9c4b29';
    x.fillRect(cx - 1 + off, y, 3, 1);
    if (i < 8) px(x, cx - 2 + off, y, '#7d4224');
  }
  x.fillStyle = '#6b3520';
  x.fillRect(cx - 5, baseY - 1, 4, 1); x.fillRect(cx + 2, baseY - 1, 4, 1);
  x.fillStyle = '#6b3520';
  x.fillRect(cx - 4, baseY - 13, 4, 1); x.fillRect(cx + 2, baseY - 15, 4, 1);
  x.fillRect(cx - 7, baseY - 17, 4, 1); x.fillRect(cx + 4, baseY - 19, 4, 1);
  const blobs = [[cx, baseY - opt.canopyY, 10]];
  const n = 7;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + seed;
    blobs.push([
      cx + Math.cos(a) * 11 + (rng() - 0.5) * 3,
      baseY - opt.canopyY + Math.sin(a) * 6 + (rng() - 0.5) * 3,
      6 + rng() * 3.5
    ]);
  }
  blobs.forEach(b => fillCircle(x, b[0], b[1], b[2] + 1, '#274f33'));
  blobs.forEach(b => fillCircle(x, b[0], b[1], b[2], '#3c7549'));
  blobs.forEach(b => fillCircle(x, b[0] - 2, b[1] - 2, b[2] - 3.2, '#4b8f57'));
  blobs.forEach(b => fillCircle(x, b[0] - 2, b[1] - 3, b[2] - 5, '#5a9f60'));
  for (let i = 0; i < 40; i++) {
    const b = blobs[(rng() * blobs.length) | 0];
    x.fillStyle = rng() > 0.45 ? '#71b46c' : '#33684a';
    x.fillRect(Math.round(b[0] + (rng() - 0.5) * b[2] * 1.7), Math.round(b[1] + (rng() - 0.5) * b[2] * 1.5), 1, 1);
  }
  if (opt.fruit) {
    for (let i = 0; i < 8; i++) {
      const b = blobs[(rng() * blobs.length) | 0];
      const fx = Math.round(b[0] + (rng() - 0.5) * b[2] * 1.6);
      const fy = Math.round(b[1] + (rng() - 0.5) * b[2] * 1.3) + 2;
      x.fillStyle = '#8f4a28'; x.fillRect(fx, fy, 3, 3);
      x.fillStyle = opt.fruitColor; x.fillRect(fx, fy, 2, 2);
      px(x, fx, fy, '#ffe6a8');
    }
  }
  return c;
}

/* ------------------------------------------------------------------ bush */
function paintBush(seed, opt) {
  opt = Object.assign({ W: 30, H: 20, fruit: false, fruitColor: '#cf4b57' }, opt);
  const rng = mulberry32(seed);
  const { c, x } = makeCanvas(opt.W, opt.H);
  const cy = opt.H - 6, cx = Math.round(opt.W / 2);
  const blobs = [];
  for (let i = 0; i < 4; i++) blobs.push([cx + (i - 1.5) * 5 + (rng() - 0.5) * 2, cy + (rng() - 0.5) * 3, 5 + rng() * 3]);
  blobs.forEach(b => fillCircle(x, b[0], b[1], b[2] + 1, '#274f33'));
  blobs.forEach(b => fillCircle(x, b[0], b[1], b[2], '#3c7549'));
  blobs.forEach(b => fillCircle(x, b[0] - 1.5, b[1] - 2, b[2] - 2.2, '#4b8f57'));
  blobs.forEach(b => fillCircle(x, b[0] - 2.5, b[1] - 3, b[2] - 4, '#5a9f60'));
  for (let i = 0; i < 16; i++) {
    const b = blobs[(rng() * blobs.length) | 0];
    x.fillStyle = rng() > 0.5 ? '#71b46c' : '#33684a';
    x.fillRect(Math.round(b[0] + (rng() - 0.5) * b[2] * 1.6), Math.round(b[1] + (rng() - 0.5) * b[2] * 1.4), 1, 1);
  }
  if (opt.fruit) {
    for (let i = 0; i < 6; i++) {
      const b = blobs[(rng() * blobs.length) | 0];
      const fx = Math.round(b[0] + (rng() - 0.5) * b[2] * 1.5);
      const fy = Math.round(b[1] + (rng() - 0.5) * b[2] * 1.2) + 1;
      x.fillStyle = '#8f2b38'; x.fillRect(fx, fy, 2, 2);
      px(x, fx, fy, opt.fruitColor);
    }
  }
  x.fillStyle = 'rgba(20,40,30,0.20)';
  x.fillRect(cx - 9, opt.H - 2, 18, 1);
  return c;
}

/* ------------------------------------------------------------ small flora */
function paintGrass(seed) {
  const rng = mulberry32(seed);
  const W = 11, H = 9;
  const { c, x } = makeCanvas(W, H);
  for (let i = 0; i < 5; i++) {
    const bx = 2 + i * 2 + (rng() < 0.5 ? 0 : 1);
    const hgt = 3 + Math.floor(rng() * 4);
    const lean = (rng() - 0.5) * 2.4;
    for (let s = 0; s < hgt; s++) {
      const q = s / hgt;
      px(x, bx + lean * q * q * 2.2, H - 1 - s, s > hgt - 2 ? '#33684a' : '#488f56');
    }
  }
  return c;
}
function paintFlower(seed) {
  const cols = ['#e8c45a', '#e08a4c', '#c9a6e0', '#f4efe4'];
  const rng = mulberry32(seed);
  const W = 9, H = 10;
  const { c, x } = makeCanvas(W, H);
  const cx = 4, baseY = H - 1;
  for (let i = 0; i < 4; i++) px(x, cx + (i % 2 ? 1 : 0), baseY - i, '#33684a');
  const col = cols[(rng() * cols.length) | 0];
  fillCircle(x, cx, baseY - 6, 2.2, col);
  px(x, cx, baseY - 6, '#f7e2a0');
  return c;
}
function paintFern(seed) {
  const rng = mulberry32(seed);
  const W = 24, H = 18;
  const { c, x } = makeCanvas(W, H);
  const bx = W / 2, by = H - 1;
  for (let f = 0; f < 6; f++) {
    const ang = -Math.PI + 0.35 + (f / 5) * (Math.PI - 0.7);
    const len = 9 + rng() * 5;
    for (let s = 0; s < len; s++) {
      const q = s / len;
      const fx = bx + Math.cos(ang) * s * 0.9;
      const fy = by + Math.sin(ang) * s * 0.75 + q * q * 4;
      px(x, fx, fy, s % 2 ? '#33684a' : '#488f56');
      if (s > 1 && s % 2 === 0) px(x, fx + 1, fy + 1, '#274f33');
    }
  }
  return c;
}
function paintScrub(seed) {
  const rng = mulberry32(seed);
  const { c, x } = makeCanvas(13, 8);
  for (let i = 0; i < 7; i++) {
    const bx = 1 + Math.floor(rng() * 10), hgt = 2 + Math.floor(rng() * 4);
    for (let s = 0; s < hgt; s++) {
      x.fillStyle = s > hgt - 2 ? '#74905a' : '#8aa368';
      x.fillRect(bx + (s > 1 && rng() > 0.5 ? 1 : 0), 7 - s, 1, 1);
    }
  }
  return c;
}
function paintFallenFruit(seed) {
  const rng = mulberry32(seed);
  const { c, x } = makeCanvas(7, 5);
  const cols = ['#e9a23b', '#d9663f', '#c4543f'];
  for (let i = 0; i < 2 + Math.floor(rng() * 2); i++) {
    const fx = 1 + Math.floor(rng() * 4), fy = 1 + Math.floor(rng() * 2);
    x.fillStyle = '#8f4a28'; x.fillRect(fx, fy + 1, 3, 2);
    x.fillStyle = cols[(rng() * cols.length) | 0]; x.fillRect(fx, fy, 2, 2);
    x.fillStyle = '#a4552a'; x.fillRect(fx + 2, fy + 1, 1, 1);
  }
  return c;
}

/* ------------------------------------------------------------------ rocks */
function paintRock(seed, size) {
  const rng = mulberry32(seed);
  const W = size, H = Math.round(size * 0.72) + 2;
  const { c, x } = makeCanvas(W, H);
  const cx = W / 2, cy = H * 0.62;
  fillCircle(x, cx, cy, W * 0.5, '#20262e');
  fillCircle(x, cx, cy - 0.5, W * 0.46, '#4e5a64');
  fillCircle(x, cx - 1, cy - 2, W * 0.38, '#74808a');
  fillCircle(x, cx - 2, cy - 3.5, W * 0.24, '#8d99a3');
  for (let i = 0; i < 8; i++) {
    x.fillStyle = rng() > 0.5 ? '#838f98' : '#434e58';
    x.fillRect(Math.round(cx + (rng() - 0.45) * W * 0.7), Math.round(cy - 1 + (rng() - 0.5) * H * 0.6), 1, 1);
  }
  return c;
}

/* ------------------------------------------------------- shipwreck pieces */
function paintWreck() {
  const W = 64, H = 36;
  const { c, x } = makeCanvas(W, H);
  const baseY = H - 4;
  x.fillStyle = '#c6ad81';
  x.fillRect(9, baseY + 1, 40, 1);
  x.fillRect(14, baseY + 2, 26, 1);
  x.fillStyle = '#d4bd91';
  x.fillRect(12, baseY, 22, 1);
  const hull = new Path2D();
  hull.moveTo(4, 22);
  hull.quadraticCurveTo(6, 9, 20, 6);
  hull.quadraticCurveTo(36, 3, 50, 9);
  hull.quadraticCurveTo(61, 14, 60, 22);
  hull.quadraticCurveTo(58, 30, 44, 31);
  hull.quadraticCurveTo(24, 32, 10, 29);
  hull.closePath();
  try {
    x.save();
    x.clip(hull);
    x.fillStyle = '#7d4224'; x.fillRect(0, 0, W, H);

/* -------------------------------------------------------------- dead wood */
function paintDeadTree(seed) {
  const rng = mulberry32(seed);
  const W = 34, H = 40;
  const { c, x } = makeCanvas(W, H);
  const branch = (x0, y0, ang, len, wid, depth) => {
    for (let s = 0; s < len; s++) {
      const q = s / len;
      const bx = x0 + Math.cos(ang) * s;
      const by = y0 + Math.sin(ang) * s;
      const w = Math.max(1, Math.round(wid * (1 - q * 0.6)));
      x.fillStyle = depth > 1 ? '#171223' : '#221a30';
      x.fillRect(Math.round(bx), Math.round(by), w, 1);
    }
    if (depth > 0) {
      const ex = x0 + Math.cos(ang) * len, ey = y0 + Math.sin(ang) * len;
      branch(ex, ey, ang - 0.45 - rng() * 0.35, len * 0.68, Math.max(1, wid - 1), depth - 1);
      branch(ex, ey, ang + 0.4 + rng() * 0.35, len * 0.62, Math.max(1, wid - 1), depth - 1);
      if (depth === 2 && rng() > 0.5) branch(ex, ey, ang + 0.05, len * 0.5, 1, depth - 2);
    }
  };
  branch(W / 2, H - 1, -Math.PI / 2 + (rng() - 0.5) * 0.15, 15, 3, 3);
  x.fillStyle = '#221a30';
  x.fillRect(W / 2 - 5, H - 2, 4, 2); x.fillRect(W / 2 + 2, H - 2, 5, 2);
  return c;
}

/* ===================================================== VILLAGE PROPS ===== */
function paintHut(seed, opt) {
  // decaying village hut: sagging thatch, mossy planks, dark doorway
  opt = Object.assign({ W: 74, H: 62, lit: false }, opt || {});
  const rng = mulberry32(seed);
  const { c, x } = makeCanvas(opt.W, opt.H);
  const baseY = opt.H - 2;
  const wallTop = Math.round(opt.H * 0.44);
  const wl = 8, wr = opt.W - 8;
  // walls (weathered planks)
  for (let y = wallTop; y < baseY; y++) {
    for (let xx = wl; xx <= wr; xx++) {
      const shade = (xx - wl) / (wr - wl);
      let col = shade < 0.18 ? '#8a6a48' : shade > 0.86 ? '#5d452e' : '#75573b';
      if ((y + xx) % 13 === 0) col = '#66492f';
      if (y === wallTop) col = '#4d3722';
      x.fillStyle = col; x.fillRect(xx, y, 1, 1);
    }
  }
  // plank gaps
  for (let y = wallTop + 3; y < baseY; y += 5) {
    x.fillStyle = '#4d3722'; x.fillRect(wl, y, wr - wl + 1, 1);
  }
  // moss patches on the wall
  for (let i = 0; i < 14; i++) {
    const mx = wl + Math.floor(rng() * (wr - wl)), my = wallTop + 3 + Math.floor(rng() * (baseY - wallTop - 5));
    x.fillStyle = rng() > 0.5 ? '#3c5c46' : '#48683f';
    x.fillRect(mx, my, 1 + Math.floor(rng() * 2), 1);
  }
  // sagging thatch roof
  const roof = new Path2D();
  roof.moveTo(2, wallTop + 6);
  roof.quadraticCurveTo(opt.W * 0.2, 2, opt.W * 0.5, 5 + rng() * 3);
  roof.quadraticCurveTo(opt.W * 0.85, 2, opt.W - 2, wallTop + 8);
  roof.lineTo(opt.W - 7, wallTop + 10);
  roof.quadraticCurveTo(opt.W * 0.5, wallTop - 2, 7, wallTop + 8);
  roof.closePath();
  try {
    x.save(); x.clip(roof);
    for (let y = 0; y < wallTop + 12; y++) {
      for (let xx = 0; xx < opt.W; xx++) {
        const t = y / (wallTop + 12);
        const n = hash2(xx, y + seed);
        if (n > 0.12) {
          let col = t < 0.35 ? '#9c8a54' : t < 0.7 ? '#87743f' : '#6b5a30';
          if (n > 0.9) col = '#5d4d2a';
          if (n < 0.2) col = '#ab9a63';
          x.fillStyle = col; x.fillRect(xx, y, 1, 1);
        }
      }
    }
    x.restore();
    x.strokeStyle = '#3d3117'; x.lineWidth = 1; x.stroke(roof);
  } catch (e) {}
  // roof moss + a broken patch
  x.fillStyle = '#48683f';
  x.fillRect(opt.W * 0.2, 6, 6, 2); x.fillRect(opt.W * 0.68, 8, 5, 2);
  x.fillStyle = '#2f2412'; x.fillRect(opt.W * 0.42, 4, 5, 3);
  // door (dark) or window (lit)
  const dw = 12, dx = Math.round(opt.W / 2 - dw / 2);
  x.fillStyle = '#241a10'; x.fillRect(dx, baseY - 16, dw, 16);
  x.fillStyle = '#3d2d1c'; x.fillRect(dx, baseY - 16, dw, 1); x.fillRect(dx, baseY - 16, 1, 16); x.fillRect(dx + dw - 1, baseY - 16, 1, 16);
  if (opt.lit) {
    x.fillStyle = '#e8b45a'; x.fillRect(dx + 2, baseY - 14, dw - 4, 13);
    x.fillStyle = '#c28f3d'; x.fillRect(dx + 2, baseY - 14, dw - 4, 2);
    x.fillStyle = '#241a10'; x.fillRect(dx + Math.floor(dw / 2) - 1, baseY - 14, 2, 13);
  }
  // side window, shutter askew
  const wx = wl + 6;
  x.fillStyle = '#2c2013'; x.fillRect(wx, wallTop + 8, 10, 8);
  x.fillStyle = '#4d3722'; x.fillRect(wx - 1, wallTop + 7, 12, 1);
  x.fillStyle = '#5d452e'; x.fillRect(wx - 2, wallTop + 6, 4, 11); // tilted shutter
  // ground shadow
  x.fillStyle = 'rgba(20,26,34,0.25)';
  x.fillRect(wl - 2, baseY, wr - wl + 5, 2);
  return c;
}

        if (y === 0) col = '#616c76';
        if (y === bh - 1) col = '#333c44';
        x.fillStyle = col; x.fillRect(Math.round(xx), by - y, 1, 1);
      }
    }
  }
  // back slab
  const slabTop = baseY - 34;
  for (let y = 0; y < 20; y++) {
    for (let xx = cx - 20; xx < cx + 20; xx++) {
      const n = hash2(xx + 60, y);
      let col = n > 0.7 ? '#4a555f' : n > 0.35 ? '#434e58' : '#39434c';
      if (xx < cx - 17 || xx > cx + 17) col = '#333c44';
      x.fillStyle = col; x.fillRect(Math.round(xx), slabTop + y, 1, 1);
    }
  }
  // carved fruit motif on the slab (the old guild mark)
  fillCircle(x, cx, slabTop + 9, 6, '#2c353d');
  fillCircle(x, cx, slabTop + 9, 5, '#39434c');
  ring(x, cx, slabTop + 9, 5, 1, '#242b32');
  x.fillStyle = '#242b32';
  x.fillRect(cx - 3, slabTop + 8, 2, 1); x.fillRect(cx + 1, slabTop + 8, 2, 1); // two small carved eyes
  px(x, cx, slabTop + 3, '#2c353d'); px(x, cx, slabTop + 2, '#2c353d');
  // SEVEN niches along the top step — six empty, one occupied
  const nicheY = baseY - 16;
  for (let i = 0; i < 7; i++) {
    const nx = cx - 24 + i * 8;
    x.fillStyle = '#20262e'; x.fillRect(nx, nicheY, 5, 8);
    x.fillStyle = '#151a20'; x.fillRect(nx + 1, nicheY + 2, 3, 6);
    if (i === 3) { // the remaining token: a dull purple fruit-shape
      x.fillStyle = '#533a75'; x.fillRect(nx + 1, nicheY + 3, 3, 4);
      x.fillStyle = '#7d5ba6'; x.fillRect(nx + 1, nicheY + 3, 2, 2);
      px(x, nx + 1, nicheY + 3, '#a884c9');
    }
  }
  // moss over everything
  for (let i = 0; i < 30; i++) {
    const mx = cx - 38 + hash2(i, 1) * 76, my = slabTop + hash2(i, 2) * (baseY - slabTop);
    x.fillStyle = hash2(i, 3) > 0.5 ? '#3c5c46' : '#2f5038';
    x.fillRect(Math.round(mx), Math.round(my), 1 + Math.floor(hash2(i, 4) * 2), 1);
  }
  // offering: one small fruit somebody left
  x.fillStyle = '#a4552a'; x.fillRect(cx - 30, baseY - 3, 3, 2);
  x.fillStyle = '#d9663f'; x.fillRect(cx - 30, baseY - 3, 2, 1);
  return c;
}

function paintGate() {
  // The north gate to the volcano path. Closed. Not locked — "closed".
  const W = 96, H = 74;
  const { c, x } = makeCanvas(W, H);
  const baseY = H - 2;
  // posts
  const post = (pxx) => {
    x.fillStyle = '#33190d'; x.fillRect(pxx, baseY - 52, 12, 52);
    x.fillStyle = '#75573b'; x.fillRect(pxx + 2, baseY - 52, 8, 52);
    x.fillStyle = '#8a6a48'; x.fillRect(pxx + 2, baseY - 52, 3, 52);
    x.fillStyle = '#33190d'; x.fillRect(pxx + 1, baseY - 50, 10, 1); x.fillRect(pxx + 1, baseY - 20, 10, 1);
    // carved warning marks
    x.fillStyle = '#8f2b38';
    x.fillRect(pxx + 4, baseY - 44, 4, 1); x.fillRect(pxx + 5, baseY - 45, 2, 3);
    x.fillRect(pxx + 4, baseY - 12, 4, 1); x.fillRect(pxx + 5, baseY - 13, 2, 3);
  };
  post(4); post(W - 16);
  // lintel
  x.fillStyle = '#33190d'; x.fillRect(2, baseY - 58, W - 4, 8);
  x.fillStyle = '#5d452e'; x.fillRect(4, baseY - 56, W - 8, 4);
  // crossed planks blocking the way
  x.save();
  x.translate(0, 0);
  const plank = (x0, y0, w, h, col, colD) => {
    x.fillStyle = colD; x.fillRect(x0, y0, w, h);
    x.fillStyle = col; x.fillRect(x0 + 1, y0 + 1, w - 2, h - 2);
  };
  plank(18, baseY - 40, 60, 8, '#75573b', '#33190d');
  x.restore();
  // diagonal second plank
  for (let i = 0; i < 64; i++) {
    const yy = baseY - 34 + i * 0.42;
    x.fillStyle = '#33190d'; x.fillRect(16 + i, Math.round(yy), 8, 5);
    x.fillStyle = '#75573b'; x.fillRect(17 + i, Math.round(yy) + 1, 6, 3);
  }
  // warning sign nailed on
  x.fillStyle = '#33190d'; x.fillRect(W / 2 - 22, baseY - 44, 44, 14);
  x.fillStyle = '#9c8a54'; x.fillRect(W / 2 - 20, baseY - 42, 40, 10);
  x.fillStyle = '#3d3117';
  x.fillRect(W / 2 - 14, baseY - 39, 8, 1); x.fillRect(W / 2 - 11, baseY - 42, 1, 7);
  x.fillRect(W / 2 + 2, baseY - 39, 10, 1); x.fillRect(W / 2 + 6, baseY - 42, 1, 7);
  x.fillStyle = 'rgba(20,26,34,0.25)'; x.fillRect(2, baseY, W - 4, 2);
  return c;
}

function paintFence(seed) {
  const rng = mulberry32(seed);
  const W = 42, H = 22;
  const { c, x } = makeCanvas(W, H);
  const baseY = H - 1;
  for (let i = 0; i < 3; i++) {
    const fx = 4 + i * 16 + Math.floor(rng() * 2);
    x.fillStyle = '#33190d'; x.fillRect(fx, baseY - 16, 4, 16);
    x.fillStyle = '#75573b'; x.fillRect(fx + 1, baseY - 16, 2, 16);
    if (rng() > 0.5) { x.fillStyle = '#33190d'; x.fillRect(fx, baseY - 18, 2, 2); }
  }
  x.fillStyle = '#5d452e'; x.fillRect(0, baseY - 12, W, 2); x.fillRect(0, baseY - 6, W, 2);
  x.fillStyle = '#8a6a48'; x.fillRect(0, baseY - 12, W, 1); x.fillRect(0, baseY - 6, W, 1);
  return c;
}

    desc: 'A dull plum-colored token from the shrine\u2019s fourth niche. It is colder than the stone it sat in. Majhool said: "Take it to the mountain, when the mountain asks." The mountain has not asked yet.'
  },
  /* ------------------------------------------------------------ equipment */
  gloves: {
    id: 'gloves', name: 'Worn Gloves', cat: 'equip', icon: 'it_gloves', slot: 'weapon', atk: 1,
    desc: 'Sailor\u2019s gloves, patched at the palms by someone patient. They smell of tar and rope. Your grip feels older and steadier with them on. (ATK +1)'
  }
};

/* ------------------------------------------------------------- Inventory */
const Inventory = {
  slots: [],                 // [{id, n}] ordered
  equip: { weapon: null, charm: null },

  reset() {
    this.slots = [];
    this.equip = { weapon: null, charm: null };
  },
  def(id) { return ITEMS[id]; },
  count(id) {
    const s = this.slots.find(e => e.id === id);
    return s ? s.n : 0;
  },
  has(id) { return this.count(id) > 0; },
  add(id, n) {
    n = n || 1;
    const d = ITEMS[id];
    if (!d) return false;
    if (d.cat !== 'consumable') n = 1; // non-stackable
    const s = this.slots.find(e => e.id === id);
    if (s) s.n += n;
    else this.slots.push({ id, n });
    return true;
  },
  remove(id, n) {
    n = n === undefined ? 1 : n;
    const i = this.slots.findIndex(e => e.id === id);
    if (i < 0) return false;
    this.slots[i].n -= n;
    if (this.slots[i].n <= 0) this.slots.splice(i, 1);
    return true;
  },
  // use a consumable out of battle. `hp/maxhp` come from Player.
  use(id, hp, maxhp) {
    const d = ITEMS[id];
    if (!d || d.cat !== 'consumable') return null;
    let healed = 0;
    if (d.heal) healed = Math.min(d.heal, maxhp - hp);
    this.remove(id, 1);
    return { healed, hpAfter: hp + healed };
  },
  equipItem(id) {
    const d = ITEMS[id];
    if (!d || d.cat !== 'equip' || !d.slot) return false;
    // swap: currently equipped goes back to the bag (kept: 1 copy each)
    const prev = this.equip[d.slot];
    this.equip[d.slot] = id;
    if (prev && prev !== id) {
      if (!this.has(prev)) this.add(prev, 1);
    }
    return true;
  },
  unequip(slot) {
    const id = this.equip[slot];
    if (!id) return false;
    this.equip[slot] = null;
    if (!this.has(id)) this.add(id, 1);
    return true;
  },
  isEquipped(id) { return this.equip.weapon === id || this.equip.charm === id; },
  bonus(kind) {
    let v = 0;
    for (const slot of ['weapon', 'charm']) {
      const id = this.equip[slot];
      if (id && ITEMS[id] && ITEMS[id][kind]) v += ITEMS[id][kind];
    }
    return v;
  },
  atk() { return this.bonus('atk'); },
  def() { return this.bonus('def'); },
  // category-filtered views for the inventory UI
  byCat(cat) { return this.slots.filter(e => ITEMS[e.id] && ITEMS[e.id].cat === cat); },
  serialize() {
    return { slots: this.slots.map(e => ({ id: e.id, n: e.n })), equip: { weapon: this.equip.weapon, charm: this.equip.charm } };
  },
  deserialize(data) {
    this.reset();
    if (!data) return;
    if (data.slots) for (const e of data.slots) if (ITEMS[e.id]) this.add(e.id, e.n || 1);
    if (data.equip) {
      if (ITEMS[data.equip.weapon]) this.equip.weapon = data.equip.weapon;
      if (ITEMS[data.equip.charm]) this.equip.charm = data.equip.charm;
    }
  }
};

</script>
<script>
/* ============================================================================
   js/dialogue.js — dialogue engine
   Node types:
     { type:'line',  who, text, cue?, think? }   cue 'warn' plays the omen
     { type:'choice', options:[{ text, key?, ends?, nodes:[...] }] }
     { type:'func',  fn }                        run code, continue
     { type:'give',  id, silent? }               grant item (toast + jingle)
     { type:'flag',  key, value? }               set story flag
     { type:'obj',   id, text }                  set objective
   Lines wrap to the box width; typewriter at ~46 chars/sec; first press
   completes a line, second advances — a line can never be skipped past.
   ========================================================================== */
'use strict';

const SPEAKERS = {
  'Sailor':    { color: '#f0cf8a', portrait: 'por_sailor' },
  'Vax':       { color: '#e88a80', portrait: 'por_vax' },
  'Ali Sama':  { color: '#9fd8a8', portrait: 'por_ali' },
  'Majhool':   { color: '#b9a6e0', portrait: 'por_majhool' },
  'Levi':      { color: '#f2dd8a', portrait: 'por_levi' },
  'Ruta':      { color: '#a9bfc9' },
  'Nadia':     { color: '#d8b9c9' },
  '???':       { color: '#8f8f9f' },
  'Island':    { color: '#a884c9' }
};

const Dialogue = {
  active: false,
  queue: [],
  node: null,
  lines: [],
  chars: 0,
  total: 0,
  t: 0,
  typing: false,
  done: false,
  choiceOpen: false,
  choiceIndex: 0,
  choiceNode: null,
  onEnd: null,
  boxAlpha: 0,

  reset() {
    this.active = false; this.queue = []; this.node = null; this.lines = [];
    this.chars = 0; this.total = 0; this.t = 0; this.typing = false; this.done = false;
    this.choiceOpen = false; this.choiceIndex = 0; this.choiceNode = null;
    this.onEnd = null; this.boxAlpha = 0;
  },

  start(nodes, onEnd) {
    this.reset();
    this.active = true;
    this.queue = nodes.slice();
    this.onEnd = onEnd || null;
    this.next();
  },

  say(who, text, opts) {
    opts = opts || {};
    return { type: 'line', who, text, cue: opts.cue, think: opts.think };
  },

  next() {
    while (true) {
      if (this.queue.length === 0) { this.end(); return; }
      const node = this.queue.shift();
      if (node.type === 'line') {
        this.node = node;
        this.lines = wrapText(node.text, 44);
        this.total = this.lines.join('').length;
        this.chars = 0; this.t = 0;
        this.typing = true; this.done = false; this.choiceOpen = false;
        if (node.cue === 'warn') AudioSys.warn();
        else if (node.cue === 'moan') AudioSys.moan();
        else AudioSys.talk();
        return;
      } else if (node.type === 'choice') {
        const opts = node.options.filter(o => !o._taken && !(o.key && Game.asked[o.key]));
        if (opts.length === 0) continue;
        node.options = opts;
        this.choiceNode = node;
        this.choiceIndex = 0;
        this.choiceOpen = true;
        this.typing = false;
        AudioSys.select();
        return;
      } else if (node.type === 'func') {
        try { node.fn(); } catch (e) { /* scripts must never break the flow */ }
        continue;
      } else if (node.type === 'give') {
        const d = ITEMS[node.id];
        if (d) {
          Inventory.add(node.id, node.n || 1);
          if (!node.silent) {
            Game.showToast('Got ' + d.name + '!');
            AudioSys.itemGet();
          }
        }
        continue;
      } else if (node.type === 'flag') {
        Game.flags[node.key] = (node.value === undefined ? true : node.value);
        continue;
      } else if (node.type === 'obj') {
        Game.setObjective(node.id, node.text);
        continue;
      }
    }
  },

  advance() {
    if (!this.active) return;
    if (this.choiceOpen) { this.pick(); return; }
    if (this.typing) {
      this.chars = this.total;
      this.typing = false;
      this.done = true;
      AudioSys.advance();
      return;
    }
    AudioSys.advance();
    this.next();
  },

  moveChoice(delta) {
    if (!this.choiceOpen || !this.choiceNode) return;
    const n = this.choiceNode.options.length;
    this.choiceIndex = (this.choiceIndex + delta + n) % n;
    AudioSys.select();
  },

  pick() {
    const node = this.choiceNode;
    if (!node) return;
    const opt = node.options[this.choiceIndex];
    if (!opt) return;
    AudioSys.advance();
    this.choiceOpen = false;
    if (opt.key) Game.asked[opt.key] = true;
    if (opt.once) opt._taken = true;
    const rest = node.options.filter(o => !o._taken && !(o.key && Game.asked[o.key]));
    const follow = [];
    if (opt.nodes) follow.push(...opt.nodes);
    // keep offering remaining questions unless this option ends the talk
    if (node.repeat && !opt.ends && rest.length > 1) {
      follow.push({ type: 'choice', options: rest, repeat: true });
    } else if (node.repeat && !opt.ends && rest.length === 1 && rest[0].ends) {
      follow.push({ type: 'choice', options: rest, repeat: true });
    }
    this.queue = follow.concat(this.queue);
    this.next();
  },

  end() {
    this.active = false;
    this.node = null;
    this.choiceOpen = false;
    const cb = this.onEnd;
    this.onEnd = null;
    if (cb) cb();
  },

  update(dt) {
    if (!this.active) return;
    this.t += dt;
    this.boxAlpha = Math.min(1, this.boxAlpha + dt * 6);
    if (this.typing) {
      const cps = 46;
      const prev = Math.floor(this.chars);
      this.chars = Math.min(this.total, this.chars + cps * dt);
      if (Math.floor(this.chars) > prev && Math.floor(this.chars) % 2 === 0) AudioSys.type();
      if (this.chars >= this.total) { this.typing = false; this.done = true; }
    }
  },

  visibleLines() {
    const all = this.lines;
    let remaining = Math.floor(this.chars);
    const out = [];
    for (const ln of all) {
      if (remaining <= 0) break;
      out.push(ln.slice(0, remaining));
      remaining -= ln.length;
    }
    return out;
  }
};

/* helpers used by npc scripts */
function L(who, text, opts) { return Dialogue.say(who, text, opts); }
function FN(fn) { return { type: 'func', fn }; }
function GIVE(id, opts) { return Object.assign({ type: 'give', id }, opts || {}); }
function FLAG(key, value) { return { type: 'flag', key, value }; }
function OBJ(id, text) { return { type: 'obj', id, text }; }

</script>
<script>
/* ============================================================================
   js/npcs.js — NPC definitions + dialogue scripts (all story-flag aware).
   Every script re-derives from Game.flags so a restored save shows the same
   conversations. The Vax encounter is the spine of Chapter One.
   ========================================================================== */
'use strict';

/* --------------------------------------------------------------- helpers */
function mkNpc(o) {
  return Object.assign({
    id: 'npc', name: '???', spr: 'nad_down', x: 0, y: 0, dir: 'down',
    solid: true, idleT: Math.random() * 3, talking: false,
    face(tx, ty) {
      const dx = tx - this.x, dy = ty - this.y;
      if (Math.abs(dx) > Math.abs(dy)) this.dir = dx > 0 ? 'right' : 'left';
      else this.dir = dy > 0 ? 'down' : 'up';
    },
    update(dt) {
      this.idleT += dt;
      const d = mdist(Player.x, Player.y, this.x, this.y);
      if (!this.talking && d < 90 && d > 10) this.face(Player.x, Player.y);
    },
    spriteFrame(gt) {
      const base = this.spr;
      const facing = this.dir === 'left' ? 'right' : this.dir;
      let key = base + '_' + facing;
      if (this.talking && SPR[base + '_' + facing + '_talk']) key = base + '_' + facing + '_talk';
      if (!SPR[key]) key = base + '_down';
      if (!SPR[key]) key = base;
      return SPR[key];
    }
  }, o);
}

const NpcDefs = {
  /* ================================================================ VAX */
  vax() {
    return mkNpc({
      id: 'vax', name: 'Vax', spr: 'v', x: 272, y: 290, dir: 'down',
      vax: true, // uses the dedicated idle cycle
      update(dt) {
        this.idleT += dt;
        const d = mdist(Player.x, Player.y, this.x, this.y);
        if (!this.talking && d < 110 && d > 8) this.face(Player.x, Player.y);
        else if (!this.talking && this.idleT > 8) this.dir = 'down';
      },
      script() {
        if (!Game.flags.metVax) return vaxFirstTalk();
        return vaxAgainTalk();
      }
    });
  },

  /* ========================================================== ALI SAMA */
  ali() {
    return mkNpc({
      id: 'ali', name: 'Ali Sama', spr: 'ali', x: 108, y: 78, dir: 'down',
      script() {
        const f = Game.flags;
        if (!f.metAli) return aliFirstTalk();
        return aliAgainTalk();
      }
    });
  },

  /* =========================================================== MAJHOOL */
  majhool() {
    return mkNpc({
      id: 'majhool', name: 'Majhool', spr: 'maj', x: 586, y: 200, dir: 'down',
      script() {
        const f = Game.flags;
        if (!f.metMajhool) return majhoolFirstTalk();

  nadia() {
    return mkNpc({
      id: 'nadia', name: 'Nadia', spr: 'nad', x: 300, y: 404, dir: 'down',
      script() {
        const lines = [
          [L('Nadia', 'Lovely harvest this year. Same as last year. And the year before that. And before that.'),
           L('Nadia', 'The garden died in perfect rows, see. Very tidy. The tidy part is what matters.')],

/* ====================================================== VAX'S SCRIPTS === */

function vaxFirstTalk() {

    L('Vax', 'Fruits Island. I\u2019m Vax. I\u2019m the leader here.'),
    L('Sailor', 'You don\u2019t sound particularly proud of that.'),
    L('Vax', 'It\u2019s a title. The island doesn\u2019t always listen.'),
    L('Vax', 'You came in on the south beach. Your ship did a fair impression of a firework, by the look of it.'),
    L('Vax', 'And you were looking for The Forge, weren\u2019t you? Sailors with that particular face are always looking for The Forge.'),
    L('Sailor', 'How did you know that?'),
    L('Vax', 'Because nobody sails out this far for the fruit.'),
    L('Vax', 'The Forge is a long way from here. Whatever carried you off course carried you a very long way.'),
    L('Sailor', 'Carried me?'),
    L('Vax', 'Storms don\u2019t usually steer.', { cue: 'warn' }),
    L('Vax', '...Anyway. You should know something before you settle in.'),
    L('Vax', 'There\u2019s something on this island that we ought to be worrying about a lot more than shipwrecks.'),
    L('Sailor', 'What is it?'),
    L('Vax', 'That\u2019s the problem. I don\u2019t know enough to tell you.'),
    L('Vax', 'And the people who do know aren\u2019t talking. They smile at me, they pour me tea, and they change the subject.'),

function vaxAgainTalk() {

/* ==================================================== ALI SAMA'S SCRIPTS */
function aliOptions() {
  const all = [
    {
      key: 'song',

    L('Ali Sama', 'So. Ask your questions, sailor. I\u2019ll answer the easy ones beautifully.')
  ].concat(opts.length > 1 ? [{ type: 'choice', options: opts, repeat: true }] : []);
}

function aliAgainTalk() {

/* ================================================== MAJHOOL'S SCRIPTS === */
function majhoolFirstTalk() {
  return [
    FLAG('metMajhool'),
    L('Majhool', 'You step loudly for a man the island has not decided about.'),
    L('Sailor', 'Sorry?'),
    L('Majhool', 'No, no. Loud is good. Loud has edges. It is the quiet ones who fade.'),
    L('Majhool', 'This is the Old Fruit Shrine. Seven niches. Seven fruits. Seven keepers, once, when Fructasia had a name it answered to.'),
    L('Sailor', 'Fructasia?'),
    L('Majhool', 'The island\u2019s true name. It does not use it anymore. Names are for things that end, and the island has not ended. Yet.'),
    L('Sailor', 'What happened to the six?'),
    L('Majhool', 'The Great Deletion took them. That is not its name either \u2014 but a thing with no name is a thing you cannot point at, so we point at the hole.'),
    L('Majhool', 'Whole orchards, whole families, whole winters \u2014 removed. The island healed over the gap the way skin heals over a splinter.'),
    L('Majhool', 'And the splinter, sailor, is still in there.'),
    L('Sailor', 'How do you know all this?'),
    L('Majhool', 'I kept the accounts. Before the Deletion, I wrote everything down. After it, I wrote everything down again, in case it happened twice.'),
    L('Majhool', 'Go on. Meet the village. The well-child, the tea-woman. Let them see you. Then come back, and we will see what the shrine thinks of you.')
  ];
}

function majhoolGiveToken() {
  return [

function majhoolAgainTalk() {

/* ====================================================== LEVI'S SCRIPTS == */
function leviFirstTalk() {

    L('Levi', 'I\u2019m very patient. I\u2019m the most patient person in the whole village. Nobody remembers me being born, you know.'),
