/* ----------------------------------------------------------- title */
const STARS = (() => {
  const r = mulberry32(77), s = [];
  for (let i = 0; i < 70; i++) s.push({ x: Math.floor(r() * VW), y: Math.floor(r() * 105), p: r() * 6.28, b: 0.35 + r() * 0.65 });
  return s;
})();

function drawTitle(ctx, t) {
  const g = ctx.createLinearGradient(0, 0, 0, 145);
  g.addColorStop(0, '#0d1526');
  g.addColorStop(0.45, '#1d2a44');
  g.addColorStop(0.78, '#4a4258');
  g.addColorStop(1, '#a2685a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, 150);
  for (const s of STARS) {
    const tw = 0.55 + 0.45 * Math.sin(t * 1.4 + s.p);
    ctx.globalAlpha = clamp(s.b * tw, 0, 1);
    ctx.fillStyle = '#dfe8ff';
    ctx.fillRect(s.x, s.y, 1, 1);
    if (s.b > 0.85 && tw > 0.9) ctx.fillRect(s.x - 1, s.y, 3, 1);
  }
  ctx.globalAlpha = 1;
  // moon
  ctx.fillStyle = '#f3e6c4';
  ctx.beginPath(); ctx.arc(320, 42, 13, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#e2d3ae';
  ctx.beginPath(); ctx.arc(315, 38, 3, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(324, 47, 2, 0, 6.2832); ctx.fill();
  ctx.fillStyle = 'rgba(243,230,196,0.10)';
  ctx.beginPath(); ctx.arc(320, 42, 22, 0, 6.2832); ctx.fill();
  // sea
  const sea = ctx.createLinearGradient(0, 140, 0, VH);
  sea.addColorStop(0, '#20455f'); sea.addColorStop(1, '#0c1c2c');
  ctx.fillStyle = sea; ctx.fillRect(0, 140, VW, VH - 140);
  for (let i = 0; i < 26; i++) {
    const y = 146 + i * 2.6;
    const w = 18 + Math.sin(t * 1.2 + i * 0.7) * 7;
    const a = 0.22 * (1 - i / 30) * (0.6 + 0.4 * Math.sin(t * 2 + i));
    ctx.fillStyle = `rgba(243,230,196,${clamp(a, 0, 1).toFixed(3)})`;
    ctx.fillRect(Math.round(320 - w / 2 + Math.sin(t + i) * 2), Math.round(y), Math.round(w), 1);
  }
  for (let i = 0; i < 90; i++) {
    const h = hash2(i, 3);
    const y = 148 + Math.floor(h * 66);
    const drift = ((t * (6 + h * 10) + h * 400) % (VW + 40)) - 20;
    ctx.fillStyle = `rgba(150,205,215,${(0.10 + h * 0.14).toFixed(2)})`;
    ctx.fillRect(Math.round(drift), y, 3 + Math.floor(h * 6), 1);
  }
  // island silhouette
  const islandY = 154, cx = 182;
  for (let x = 0; x < VW; x++) {
    const d = Math.abs(x - cx);
    let hgt = 0;
    if (d < 172) hgt = Math.round(30 * Math.cos((d / 172) * 1.45) + Math.sin(x * 0.06) * 2.5);
    if (hgt <= 0) continue;
    ctx.fillStyle = '#101a24';
    ctx.fillRect(x, islandY - hgt, 1, hgt + 3);
    ctx.fillStyle = '#16242e';
    ctx.fillRect(x, islandY - hgt, 1, 2);
  }
  const palmAt = (px0, py0, s) => {
    const sway = Math.sin(t * 0.9 + px0) * 1.5;
    ctx.fillStyle = '#0c141c';
    for (let i = 0; i < 10 * s; i++) {
      const yy = Math.round(py0 - i);
      const xx = Math.round(px0 + Math.sin(i * 0.14) * 2.2 * s + sway * (i / (10 * s)));
      ctx.fillRect(xx, yy, 1 + (s > 1.2 ? 1 : 0), 1);
    }
    const topX = px0 + Math.sin(10 * s * 0.14) * 2.2 * s + sway;
    for (let a = 0; a < 7; a++) {
      const ang = -Math.PI * 0.9 + a * 0.32;
      for (let l = 1; l < 8 * s; l++) {
        const lx = Math.round(topX + Math.cos(ang) * l * 0.9);
        const ly = Math.round(py0 - 10 * s + Math.sin(ang) * l * 0.55 + l * l * 0.035);
        ctx.fillRect(lx, ly, 1, 1);
      }
    }
  };
  palmAt(140, 132, 1.35); palmAt(196, 136, 1.05); palmAt(104, 139, 0.9); palmAt(230, 140, 0.75);
  ctx.fillStyle = '#0c141c';
  ctx.fillRect(216, 151, 17, 2); ctx.fillRect(220, 148, 9, 3); ctx.fillRect(226, 144, 1, 4);

  // title text
  const title = 'FRUITS ISLAND';
  const ts = 4;
  const tw = textWidth(title, ts);
  const tx = Math.round((VW - tw) / 2), ty = 30;
  for (const o of [[-2, 0], [2, 0], [0, -2], [0, 2], [-2, -2], [2, 2], [2, -2], [-2, 2]]) {
    drawText(ctx, title, tx + o[0], ty + o[1], '#1a1208', ts);
  }
  drawText(ctx, title, tx, ty, '#f2cf7d', ts);
  drawText(ctx, title, tx, ty + 1, '#e0b25f', ts);
  const sub = 'Chapter One \u00b7 The First Slice';
  drawText(ctx, sub, Math.round((VW - textWidth(sub)) / 2), ty + 40, '#c9b7a4', 1, '#0b1218');
  ctx.fillStyle = '#e4c97c';
  ctx.fillRect(Math.round(VW / 2) - 26, ty + 54, 52, 1);
  ctx.fillRect(Math.round(VW / 2) - 2, ty + 53, 2, 3);

  if (Game.titleScreen === 'menu') {
    const hasSave = SaveSys.exists();
    const items = [
      { label: hasSave ? 'Continue' : 'New Game', act: hasSave ? 'continue' : 'new' },
      { label: hasSave ? 'New Game' : null, act: 'new' },
      { label: 'Controls', act: 'controls' },
      { label: 'Sound', act: 'sound' }
    ].filter(i => i.label);
    const bw = 132, bh = items.length * 15 + 12;
    const bx = Math.round((VW - bw) / 2), by = 150;
    drawPanel(ctx, bx, by, bw, bh);
    items.forEach((it, i) => {
      const sel = i === Game.menuIndex;
      const y = by + 8 + i * 15;
      let label = it.label;
      if (it.act === 'sound') label = 'Sound: ' + (AudioSys.enabled ? (AudioSys.volume === 1 ? 'On' : AudioSys.volume === 0.5 ? 'Half' : 'Muted') : 'Off');
      if (sel) {
        ctx.fillStyle = '#2a4152'; ctx.fillRect(bx + 3, y - 2, bw - 6, 12);
        ctx.drawImage(SPR[Math.floor(t * 8) % 2 === 0 ? 'soul0' : 'soul1'], bx + 6, y + 1);
      }
      drawText(ctx, label, bx + 17, y, sel ? '#fff6dc' : '#a9bcbb');
    });
  } else if (Game.titleScreen === 'controls') {
    const cw = Math.min(VW - 16, 300);
    const ch = 34 + CONTROLS_ROWS.length * 15;
    drawControls(ctx, Math.round((VW - cw) / 2), Math.round((VH - ch) / 2) + 6, cw);
  }
  if (Game.embedded) {
    const hint = 'Click the screen once, then use the keyboard';
    drawText(ctx, hint, Math.round((VW - textWidth(hint)) / 2), VH - 12, 'rgba(190,214,214,0.55)');
  }
  ctx.fillStyle = 'rgba(150,180,190,0.25)';
  ctx.fillRect(0, VH - 1, VW, 1);
}

/* ================================================ INTRO PANEL SEQUENCE */
/* Undertale-style: near-black, slow typewriter, one thought per panel.
   Advance with Z / Enter / E / Space / click. ESC skips the whole intro. */
/* ==========================================================================
   THE INTRO — "The Sailor and the Storm"
   Ten quiet panels + a title card. Every scene is painted with fillRect only
   (identical rendering in browser and in the test harness rasterizer):
   stars, moon, layered sea, a rocking ship silhouette, jagged lightning
   with glow, rain, drifting debris, a beach dawn, and a wrong little island.
   Panels advance on Z/E/Enter/Space/click, or on their own after `hold`
   seconds once the text finishes (the title card always waits for input).
   ========================================================================== */
const INTRO_PANELS = [
  { scene: 'calm',    lines: ['The Marigold had one job:', 'sail past the edge of the map.'], hold: 3.6 },
  { scene: 'compass', lines: ['Find The Forge, they said.', 'It would be easy, they said.'], hold: 3.4 },
  { scene: 'clouds',  lines: ['Around midnight,', 'the sky changed its mind.'], hold: 3.2 },
  { scene: 'storm',   lines: ['The storm did not arrive.', 'It was waiting.'], storm: true, hold: 3.6 },
  { scene: 'storm',   lines: ['The Marigold fought', 'until it couldn\u2019t.'], storm: true, broken: true, crash: true, hold: 4.0 },
  { scene: 'wrecksea', lines: ['By dawn, the sea had taken the ship,'], grey: true, hold: 3.4 },
  { scene: 'wrecksea', lines: ['and everything on it.', 'Everything but him.'], grey: true, darker: true, slow: true, hold: 4.2 },
  { scene: 'beach',   lines: ['He woke to sand, and gulls,', 'and a headache the size of the horizon.'], hold: 4.0 },
  { scene: 'island',  lines: ['An island not on any chart.', 'Fruit-heavy. Bright-eyed.'], hold: 3.6 },
  { scene: 'island',  lines: ['Wrong.'], darker: true, slow: true, hold: 2.4 },
  { scene: 'title',   lines: ['FRUITS ISLAND'], title: true }
];

/* ------------------------------------------------------ scene painters */
function introStars(ctx, t, dim) {
  for (let i = 0; i < 26; i++) {
    const sx = Math.floor(hash2(i, 11) * (VW - 8)) + 4;
    const sy = Math.floor(hash2(i, 23) * 120) + 4;
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * (0.4 + hash2(i, 5) * 0.8) + i));
    ctx.fillStyle = 'rgba(214,228,240,' + (tw * dim).toFixed(3) + ')';
    ctx.fillRect(sx, sy, 1, 1);
    if (hash2(i, 31) > 0.8 && tw > 0.8) { ctx.fillRect(sx - 1, sy, 1, 1); ctx.fillRect(sx + 1, sy, 1, 1); ctx.fillRect(sx, sy - 1, 1, 1); ctx.fillRect(sx, sy + 1, 1, 1); }
  }
}
function introMoon(ctx, mx, my, dim, cover) {
  // halo
  ctx.fillStyle = 'rgba(208,222,232,' + (0.05 * dim * (1 - cover)).toFixed(3) + ')';
  ctx.fillRect(mx - 9, my - 9, 20, 20);
  ctx.fillStyle = 'rgba(208,222,232,' + (0.09 * dim * (1 - cover)).toFixed(3) + ')';
  ctx.fillRect(mx - 6, my - 6, 14, 14);
  // pixel moon (a 7-row disc)
  const rows = [3, 5, 7, 7, 7, 5, 3];
  ctx.fillStyle = 'rgba(226,234,238,' + (dim * (1 - cover)).toFixed(3) + ')';
  for (let r = 0; r < rows.length; r++) ctx.fillRect(mx - Math.floor(rows[r] / 2), my - 3 + r, rows[r], 1);
  ctx.fillStyle = 'rgba(150,168,178,' + (0.5 * dim * (1 - cover)).toFixed(3) + ')';
  ctx.fillRect(mx, my - 1, 2, 1); ctx.fillRect(mx - 2, my + 1, 2, 1);   // craters
}
function introSea(ctx, t, rough, grey) {
  const H0 = 150;
  for (let y = H0; y < VH; y++) {
    const d = (y - H0) / (VH - H0);
    let r, g, b;
    if (grey) {
      r = 26 + d * 26; g = 34 + d * 30; b = 42 + d * 32;
    } else {
      r = 10 + d * 16; g = 22 + d * 30; b = 40 + d * 40;
    }
    const amp = rough ? 5 : 2;
    const off = Math.round(Math.sin(t * (rough ? 2.6 : 1.1) + y * 0.35) * amp * (0.4 + d));
    ctx.fillStyle = 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
    ctx.fillRect(-14 + off, y, VW + 28, 1);
    // moon glitter lane + foam crests
    if (y < H0 + 14 && hash2(y, Math.floor(t * 3)) > (rough ? 0.55 : 0.8)) {
      const fx = 150 + Math.round(Math.sin(t * 1.7 + y) * 30) + Math.floor(hash2(y, 7) * 60);
      ctx.fillStyle = rough ? 'rgba(196,212,224,0.35)' : 'rgba(168,196,214,0.28)';
      ctx.fillRect(fx, y, 2 + Math.floor(hash2(y, 9) * 3), 1);
    }
  }
  if (rough) {
    // whitecaps: broken dashes riding the swell
    for (let i = 0; i < 12; i++) {
      const wy = H0 + 6 + Math.floor(hash2(i, 41) * 54);
      const wx = Math.floor((hash2(i, 43) * VW + t * 26 * (0.5 + hash2(i, 45))) % (VW + 30)) - 15;
      ctx.fillStyle = 'rgba(210,224,232,' + (0.25 + hash2(i, 47) * 0.3).toFixed(2) + ')';
      ctx.fillRect(wx, wy, 3 + Math.floor(hash2(i, 49) * 4), 1);
    }
  }
}
function introShip(ctx, cx, cy, t, rough, broken) {
  // a small silhouetted brig, sheared row-by-row so it rolls with the swell
  const roll = Math.sin(t * (rough ? 2.2 : 0.9)) * (rough ? 4 : 1.6);
  const bob = Math.round(Math.sin(t * (rough ? 1.8 : 0.7)) * (rough ? 2 : 1));
  const y0 = cy + bob;
  const row = (ry, w, color) => {
    const shift = Math.round(roll * ((ry - 3) / 4));
    ctx.fillStyle = color;
    ctx.fillRect(cx - Math.floor(w / 2) + shift, y0 + ry, w, 1);
  };
  // hull
  const hull = '#0a0f16';
  row(0, 24, hull); row(1, 26, hull); row(2, 26, hull); row(3, 24, hull); row(4, 20, hull); row(5, 14, hull);
  // deck line
  ctx.fillStyle = '#1b2634';
  ctx.fillRect(cx - 11 + Math.round(roll * -0.75), y0 + 1, 22, 1);
  // mast (+ sail, or the stump of one)
  const mastH = broken ? 7 : 16;
  ctx.fillStyle = hull;
  ctx.fillRect(cx - 1 + Math.round(roll * -0.4), y0 - mastH, 2, mastH);
  if (!broken) {
    // sail: a pale triangle, bellying with the wind
    for (let r = 0; r < 9; r++) {
      const w = 2 + Math.round(r * 1.3);
      ctx.fillStyle = 'rgba(158,172,184,0.85)';
      ctx.fillRect(cx + 1 + Math.round(roll * (-0.4 + r * 0.06)), y0 - 15 + r, w, 1);
    }
    // tiny stern lantern
    ctx.fillStyle = 'rgba(232,196,106,0.9)';
    ctx.fillRect(cx + 12 + Math.round(roll * 1), y0 - 1, 1, 1);
  } else {
    // torn sail scrap flapping
    for (let r = 0; r < 4; r++) {
      ctx.fillStyle = 'rgba(120,132,142,0.7)';
      ctx.fillRect(cx + 1 + Math.round(Math.sin(t * 6 + r) * 2), y0 - 6 + r, 3 - (r > 1 ? 1 : 0), 1);
    }
    ctx.fillStyle = 'rgba(232,196,106,0.5)';
    ctx.fillRect(cx + 12 + Math.round(roll), y0 - 1, 1, 1);
  }
}
function introClouds(ctx, t, cover) {
  // long low banks sliding across; `cover` 0..1 hides the moon and stars
  const banks = [
    [0.1, 30, 90, 12, 0.55], [0.5, 52, 120, 14, 0.4], [0.8, 20, 80, 10, 0.5], [0.3, 70, 140, 16, 0.3]
  ];
  for (let i = 0; i < banks.length; i++) {
    const b = banks[i];
    const x = ((b[0] * (VW + 260) + t * (6 + i * 4)) % (VW + 260)) - 130;
    ctx.fillStyle = 'rgba(16,22,32,' + (b[4] * cover).toFixed(3) + ')';
    ctx.fillRect(Math.round(x), b[1], b[2], b[3]);
    ctx.fillStyle = 'rgba(24,32,44,' + (b[4] * cover * 0.8).toFixed(3) + ')';
    ctx.fillRect(Math.round(x + 14), b[1] - 5, b[2] - 30, 6);
    ctx.fillRect(Math.round(x + 30), b[1] + b[3], b[2] - 60, 4);
  }
}
function introRain(ctx, t, n) {
  ctx.fillStyle = 'rgba(150,178,196,0.30)';
  for (let i = 0; i < n; i++) {
    const h = hash2(i, 77);
    const spd = 200 + h * 160;
    const ry = ((t * spd + h * 500) % (VH + 40)) - 20;
    const rx = ((h * (VW + 120) + t * 46) % (VW + 120)) - 60;
    ctx.fillRect(Math.round(rx), Math.round(ry), 1, 4 + Math.floor(h * 4));
  }
}
function introLightning(ctx, I, t) {
  if (I.flashT <= 0) return;
  // sky flash (decays with flashT)
  const a = clamp(I.flashT * 0.55, 0, 0.7);
  ctx.fillStyle = 'rgba(205,222,238,' + a.toFixed(3) + ')';
  ctx.fillRect(0, 0, VW, 152);
  // the bolt itself is only visible in the first instant
  if (I.flashT < 0.30) return;
  const seed = I.boltSeed;
  let bx = 60 + Math.floor(hash2(seed, 1) * (VW - 120));
  let by = 0;
  const pts = [[bx, by]];
  for (let i = 0; i < 7; i++) {
    bx += Math.round((hash2(seed, i + 2) - 0.5) * 44);
    by += Math.round(18 + hash2(seed, i + 20) * 10);
    pts.push([bx, by]);
  }
  const draw = (w, color, alpha) => {
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
      const steps = Math.max(1, Math.abs(y1 - y0));
      for (let k = 0; k <= steps; k++) {
        const px = x0 + (x1 - x0) * k / steps;
        const py = y0 + (y1 - y0) * k / steps;
        ctx.fillRect(Math.round(px) - (w >> 1), Math.round(py), w, 1);
      }
    }
    ctx.globalAlpha = 1;
  };
  draw(3, '#7fa2c4', 0.4);       // glow
  draw(1, '#eef4fb', 0.95);      // core
  // a short fork
  ctx.fillStyle = '#dce8f4';
  const f = pts[3];
  ctx.fillRect(f[0], f[1], 1, 8); ctx.fillRect(f[0] + 1, f[1] + 8, 1, 5);
}
function introDebris(ctx, t) {
  for (let i = 0; i < 5; i++) {
    const hx = hash2(i, 61), hw = 8 + Math.floor(hash2(i, 63) * 14);
    const x = Math.floor(hx * (VW - 60)) + 20;
    const y = 158 + Math.floor(hash2(i, 65) * 40) + Math.round(Math.sin(t * 1.2 + i * 2) * 2);
    ctx.fillStyle = 'rgba(18,24,32,0.9)';
    ctx.fillRect(x, y, hw, 2);
    ctx.fillStyle = 'rgba(40,52,64,0.8)';
    ctx.fillRect(x + 2, y - 1, hw - 5, 1);
  }
}
function introBeachDawn(ctx, t) {
  // dawn sky bands
  for (let y = 0; y < 150; y++) {
    const d = y / 150;
    const r = 42 + d * 60, g = 38 + d * 34, b = 52 + d * 22;
    ctx.fillStyle = 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
    ctx.fillRect(0, y, VW, 1);
  }
  // sun haze on the horizon
  ctx.fillStyle = 'rgba(224,162,107,0.30)';
  ctx.fillRect(0, 138, VW, 12);
  ctx.fillStyle = 'rgba(236,182,124,0.5)';
  ctx.fillRect(VW / 2 - 30, 142, 60, 3);
  // sea
  for (let y = 150; y < 176; y++) {
    const d = (y - 150) / 26;
    ctx.fillStyle = 'rgb(' + ((30 + d * 24) | 0) + ',' + ((34 + d * 22) | 0) + ',' + ((48 + d * 26) | 0) + ')';
    ctx.fillRect(0, y, VW, 1);
  }
  // sand
  for (let y = 176; y < VH; y++) {
    const d = (y - 176) / (VH - 176);
    ctx.fillStyle = 'rgb(' + ((96 + d * 40) | 0) + ',' + ((80 + d * 32) | 0) + ',' + ((62 + d * 24) | 0) + ')';
    ctx.fillRect(0, y, VW, 1);
  }
  // wet shine + foam edge
  ctx.fillStyle = 'rgba(180,196,204,0.22)';
  for (let x = 0; x < VW; x += 3) ctx.fillRect(x + Math.round(Math.sin(t + x) * 2), 178, 2, 1);
  // palm silhouettes
  const palm = (px, py, s) => {
    ctx.fillStyle = '#100c12';
    ctx.fillRect(px, py - 26 * s, 2 * s, 26 * s);
    for (let f = 0; f < 5; f++) {
      const fa = -0.5 + f * 0.5;
      ctx.fillRect(px + (fa < 0 ? -1 : 1) * s, py - 28 * s + Math.round(f * 1.5), Math.round((6 + f * 2) * s) * (fa < 0 ? -1 : 1) + (fa < 0 ? 2 * s : 0), 2 * s);
    }
  };
  palm(36, 190, 1); palm(352, 186, 1.4); palm(316, 188, 0.8);
  // the sailor, face down where the tide left him
  ctx.fillStyle = '#141821';
  ctx.fillRect(196, 190, 14, 3);
  ctx.fillRect(192, 190, 5, 2);          // head
  ctx.fillRect(206, 189, 6, 1);          // an arm thrown out
  ctx.fillStyle = 'rgba(20,24,33,0.5)';
  ctx.fillRect(194, 193, 16, 2);
  // gulls
  for (let i = 0; i < 3; i++) {
    const gx = ((t * (14 + i * 5) + i * 120) % (VW + 40)) - 20;
    const gy = 58 + i * 14 + Math.round(Math.sin(t * 2 + i * 2) * 4);
    const flap = Math.sin(t * 6 + i * 1.7) > 0 ? 1 : 2;
    ctx.fillStyle = 'rgba(226,232,236,0.75)';
    ctx.fillRect(gx, gy, 2, 1);
    ctx.fillRect(gx - 2, gy - flap, 2, 1);
    ctx.fillRect(gx + 2, gy - flap, 2, 1);
  }
}
function introIsland(ctx, t, lightsOn) {
  // sea + sky, then the island: a low dark mass with palms and tiny lights
  introSea(ctx, t * 0.5, false, false);
  const base = 150;
  ctx.fillStyle = '#0a0e14';
  for (let x = 0; x < VW; x++) {
    const h = Math.round(14 * Math.sin(x * 0.02 + 1.2) + 8 * Math.sin(x * 0.05 + 0.4) + 12);
    ctx.fillRect(x, base - h, 1, h + 2);
  }
  // palm bumps along the ridge
  for (let i = 0; i < 9; i++) {
    const px = 24 + i * 40 + Math.floor(hash2(i, 71) * 14);
    const py = base - Math.round(14 * Math.sin(px * 0.02 + 1.2) + 8 * Math.sin(px * 0.05 + 0.4) + 12);
    ctx.fillStyle = '#0a0e14';
    ctx.fillRect(px, py - 6, 1, 6);
    ctx.fillRect(px - 2, py - 7, 2, 1); ctx.fillRect(px + 1, py - 7, 2, 1);
  }
  // village lights: warm dots that breathe... in unison (that's the wrong part)
  if (lightsOn) {
    for (let i = 0; i < 6; i++) {
      const lx = 60 + i * 52 + Math.floor(hash2(i, 81) * 16);
      const ly = base - 4 - Math.floor(hash2(i, 83) * 5);
      const breath = 0.55 + 0.45 * Math.sin(t * 0.8 + i * 0.13);
      const sync = Math.sin(t * 0.8) > -0.2 ? breath : 0.12;  // they all dim together
      ctx.fillStyle = 'rgba(236,196,120,' + sync.toFixed(2) + ')';
      ctx.fillRect(lx, ly, 1, 1);
      ctx.fillStyle = 'rgba(236,196,120,' + (sync * 0.25).toFixed(2) + ')';
      ctx.fillRect(lx - 1, ly - 1, 3, 3);
    }
  }
}
function introCompass(ctx, t) {
  // a big brass compass rose; the needle refuses to settle
  const cx = VW / 2, cy = 86;
  ctx.fillStyle = '#0d1119';
  for (let r = 0; r < 30; r++) {
    const w = Math.round(2 * Math.sqrt(30 * 30 - r * r));
    ctx.fillRect(cx - w, cy - 30 + r, w * 2, 1);
    ctx.fillRect(cx - w, cy + 30 - r, w * 2, 1);
  }
  ctx.fillStyle = '#232c3a';
  for (let r = 4; r < 27; r += 3) {
    const w = Math.round(2 * Math.sqrt(30 * 30 - r * r));
    ctx.fillRect(cx - w, cy - 30 + r, w * 2, 1);
    ctx.fillRect(cx - w, cy + 30 - r, w * 2, 1);
  }
  // rose points
  ctx.fillStyle = '#3c4a5c';
  for (let i = 0; i < 4; i++) {
    const dx = i === 0 ? 1 : i === 2 ? -1 : 0, dy = i === 1 ? 1 : i === 3 ? -1 : 0;
    for (let k = 4; k < 22; k++) {
      const w = Math.max(1, Math.round((22 - k) * 0.5));
      ctx.fillRect(cx + dx * k - (dy ? w / 2 : 0), cy + dy * k - (dx ? w / 2 : 0), dy ? w : 1, dx ? w : 1);
    }
  }
  // the needle: swings, never commits (it should point north; it points at him)
  const ang = -0.9 + Math.sin(t * 0.7) * 0.8 + Math.sin(t * 1.9) * 0.12;
  const nx = Math.cos(ang), ny = Math.sin(ang);
  for (let k = 0; k < 18; k++) {
    ctx.fillStyle = k < 9 ? '#c85a50' : '#93a3b3';
    ctx.fillRect(Math.round(cx + nx * (k - 9)) - 1, Math.round(cy + ny * (k - 9)) - 1, 2, 2);
  }
  ctx.fillStyle = '#e8cf6a';
  ctx.fillRect(cx - 1, cy - 1, 3, 3);
  // glass glint
  ctx.fillStyle = 'rgba(210,228,238,0.10)';
  ctx.fillRect(cx - 18, cy - 24, 10, 26);
}

const Intro = {
  idx: 0,
  chars: 0,
  t: 0,
  holdT: 0,
  doneHold: false,
  flashT: 0,
  boltSeed: 1,
  nextStrike: 0,
  finished: false,

  begin() {
    this.idx = 0; this.chars = 0; this.t = 0; this.holdT = 0;
    this.doneHold = false; this.finished = false;
    this.flashT = 0; this.boltSeed = 1; this.nextStrike = 2.2;
    AudioSys.restartSong('title');
    AudioSys.setMix({ ocean: 0.045, wind: 0.014, rain: 0, hum: 0.03 }, 0.4);
  },
  panel() { return INTRO_PANELS[this.idx]; },
  fullText() { return this.panel().lines.join('\n'); },
  totalChars() { return this.panel().lines.join('').length; },

  advance() {
    if (this.finished) return;
    if (this.chars < this.totalChars()) {
      this.chars = this.totalChars();
      return;
    }
    AudioSys.advance();
    this.idx++;
    this.chars = 0;
    this.t = 0;
    this.holdT = 0;
    this.doneHold = false;
    if (this.idx >= INTRO_PANELS.length) {
      this.finished = true;
      Game.introDone();
      return;
    }
    this.enterPanel(this.panel());
  },
  enterPanel(p) {
    if (p.crash) { AudioSys.crash(); this.flashT = 0.6; this.boltSeed = (Math.random() * 999) | 0; }
    else if (p.storm) { this.strike(); }
    if (p.scene === 'clouds') AudioSys.setMix({ ocean: 0.05, wind: 0.024, rain: 0.012, hum: 0.02 }, 0.8);
    if (p.scene === 'storm') AudioSys.setMix({ ocean: 0.06, wind: 0.03, rain: 0.05, hum: 0.012 }, 0.8);
    if (p.grey) { AudioSys.stopSong(); AudioSys.setMix({ ocean: 0.035, wind: 0.012, rain: 0.014, hum: 0.016 }, 1.2); }
    if (p.scene === 'beach') { AudioSys.setMix({ ocean: 0.055, wind: 0.01, rain: 0, hum: 0.014 }, 1.0); AudioSys.bird(); }
    if (p.scene === 'island' && !p.darker) AudioSys.setMix({ ocean: 0.02, wind: 0.006, rain: 0, hum: 0.05 }, 1.0);
    if (p.scene === 'island' && p.darker) { AudioSys.moan(); AudioSys.setMix({ hum: 0.065 }, 1.4); }
    if (p.title) { AudioSys.stopSong(); AudioSys.setMix({ hum: 0.08 }, 0.3); }
  },
  strike() {
    this.flashT = 0.5;
    this.boltSeed = (Math.random() * 999) | 0;
    AudioSys.thunder();
  },
  skip() {
    this.idx = INTRO_PANELS.length;
    this.finished = true;
    Game.introDone();
  },

  update(dt) {
    this.t += dt;
    if (this.flashT > 0) this.flashT -= dt;
    const p = this.panel();
    if (!p) return;
    // rolling lightning inside storm panels
    if (p.storm) {
      this.nextStrike -= dt;
      if (this.nextStrike <= 0) {
        this.strike();
        this.nextStrike = 1.6 + Math.random() * 1.9;
      }
    }
    // a gull cries now and then on the beach panel
    if (p.scene === 'beach' && Math.random() < dt * 0.25) AudioSys.bird();
    const total = this.totalChars();
    if (this.chars < total) {
      const cps = p.slow ? 14 : p.title ? 10 : 30;
      const prev = Math.floor(this.chars);
      this.chars = Math.min(total, this.chars + cps * dt);
      if (Math.floor(this.chars) > prev && Math.floor(this.chars) % 3 === 0) AudioSys.type();
      if (this.chars >= total) this.doneHold = true;
    } else {
      this.holdT += dt;
      // panels breathe forward on their own (the title card waits for you)
      if (!p.title && this.holdT > (p.hold || 3.4)) this.advance();
    }
  },

  draw(ctx, t) {
    const p = this.panel();
    // near-black with a breath of deep blue
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    if (p && p.darker) { g.addColorStop(0, '#04050a'); g.addColorStop(1, '#020307'); }
    else { g.addColorStop(0, '#070a12'); g.addColorStop(1, '#04060c'); }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);

    if (!p) return;
    const scene = p.scene || 'calm';

    if (scene === 'calm' || scene === 'clouds' || scene === 'storm') {
      const cover = scene === 'calm' ? 0 : scene === 'clouds' ? 0.55 : 1;
      introStars(ctx, t, scene === 'storm' ? 0.25 : 1 - cover * 0.6);
      introMoon(ctx, 300, 34, scene === 'storm' ? 0.4 : 1, cover);
      introClouds(ctx, t, scene === 'clouds' ? 0.8 : scene === 'storm' ? 1.35 : 0.25);
      introSea(ctx, t, scene === 'storm', p.grey || false);
      const shipX = scene === 'storm' ? 150 : 210;
      const shipY = scene === 'storm' ? 148 : 146;
      introShip(ctx, shipX, shipY, t, scene === 'storm', !!p.broken);
      if (scene === 'storm') {
        introRain(ctx, t, 90);
        introLightning(ctx, this, t);
      }
      if (this.flashT > 0 && scene !== 'storm') {
        ctx.fillStyle = 'rgba(205,222,238,' + (clamp(this.flashT * 0.5, 0, 0.6)).toFixed(3) + ')';
        ctx.fillRect(0, 0, VW, VH);
      }
    } else if (scene === 'wrecksea') {
      introStars(ctx, t, 0.5);
      introSea(ctx, t, false, true);
      introDebris(ctx, t);
    } else if (scene === 'beach') {
      introBeachDawn(ctx, t);
    } else if (scene === 'island') {
      introIsland(ctx, t, !p.darker);
    } else if (scene === 'compass') {
      introStars(ctx, t, 0.7);
      introCompass(ctx, t);
    } else if (scene === 'title') {
      // the island gone black; just the name
      introSea(ctx, t * 0.4, false, true);
    }

    // text
    const total = this.totalChars();
    let shown = Math.floor(this.chars);
    if (p.title) {
      // title card: single big line, gold, centered
      const full = p.lines[0];
      const shownTxt = full.slice(0, shown);
      const s = 3;
      const w = textWidth(full, s);
      const x = Math.round((VW - w) / 2), y = 92;
      for (const o of [[-2, 0], [2, 0], [0, -2], [0, 2]]) drawText(ctx, shownTxt, x + o[0], y + o[1], '#120c04', s);
      drawText(ctx, shownTxt, x, y, '#e8cf92', s);
      if (shown >= full.length) {
        const sub = 'Chapter One \u2014 The First Slice';
        drawText(ctx, sub, Math.round((VW - textWidth(sub)) / 2), y + 34, '#6f7d86');
      }
    } else {
      let y = p.lines.length === 1 ? 96 : 78;
      for (const line of p.lines) {
        if (shown <= 0) break;
        const part = line.slice(0, shown);
        shown -= line.length;
        const lw = textWidth(line);
        drawText(ctx, part, Math.round((VW - lw) / 2), y, '#dfe6df', 1, '#04060c');
        y += 14;
      }
    }

    // advance hint (after the line finishes)
    if (this.chars >= total && Math.floor(t * 1.8) % 2 === 0 && !p.title) {
      const hint = '\u00b7 press Z or E \u00b7';
      drawText(ctx, hint, Math.round((VW - textWidth(hint)) / 2), VH - 22, 'rgba(160,178,178,0.6)');
    }
    if (p.title && this.chars >= total && Math.floor(t * 1.8) % 2 === 0) {
      const hint = '\u00b7 press Z or E to go ashore \u00b7';
      drawText(ctx, hint, Math.round((VW - textWidth(hint)) / 2), VH - 22, 'rgba(190,178,140,0.75)');
    }
    if (this.idx > 0 || this.chars > 0) {
      // a tiny progress marker of dots
      for (let i = 0; i < INTRO_PANELS.length; i++) {
        ctx.fillStyle = i <= this.idx ? 'rgba(228,201,124,0.55)' : 'rgba(228,201,124,0.16)';
        ctx.fillRect(8 + i * 5, VH - 10, 3, 3);
      }
    }
  }
};

/* -------------------------------------------------------- chapter card */
function drawChapterCard(ctx, t) {
  const a = clamp(Game.epiT * 1.2, 0, 0.88);
  ctx.fillStyle = `rgba(6,10,16,${a.toFixed(3)})`;
  ctx.fillRect(0, 0, VW, VH);
  const fade = clamp((Game.epiT - 0.3) * 1.1, 0, 1);
  ctx.globalAlpha = fade;
  const g = ctx.createLinearGradient(0, 40, 0, 190);
  g.addColorStop(0, 'rgba(8,14,20,0)');
  g.addColorStop(0.25, 'rgba(8,14,20,0.82)');
  g.addColorStop(0.75, 'rgba(8,14,20,0.82)');
  g.addColorStop(1, 'rgba(8,14,20,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 40, VW, 150);

  const title = 'END OF CHAPTER ONE';
  drawText(ctx, title, Math.round((VW - textWidth(title, 2)) / 2), 66, '#e8cf92', 2, '#140f08');
  const sub = 'THE FIRST SLICE';
  drawText(ctx, sub, Math.round((VW - textWidth(sub)) / 2), 88, '#8fa3a0');
  ctx.fillStyle = '#e4c97c';
  ctx.fillRect(Math.round(VW / 2) - 20, 100, 40, 1);
  const lines = [
    'The mountain is indisposed.',
    'It will not stay that way.'
  ];
  lines.forEach((l, i) => drawText(ctx, l, Math.round((VW - textWidth(l)) / 2), 114 + i * 12, '#cfdcd6'));
  if (fade > 0.9 && Math.floor(t * 1.6) % 2 === 0) {
    const p = 'Press E to keep exploring';
    drawText(ctx, p, Math.round((VW - textWidth(p)) / 2), 160, '#e4c97c', 1, '#140f08');
  }
  ctx.globalAlpha = 1;
}

/* ------------------------------------------------- save indicator */
function drawSaveFlash(ctx) {
  if (!Game.saveFlashT || Game.saveFlashT <= 0) return;
  const a = clamp(Math.min(Game.saveFlashT, 1.6 - Game.saveFlashT) * 2, 0, 1);
  ctx.globalAlpha = a;
  const txt = 'The lantern remembers you.';
  const w = textWidth(txt) + 20;
  drawPanel(ctx, Math.round((VW - w) / 2), 70, w, 17);
  drawText(ctx, txt, Math.round((VW - w) / 2) + 10, 76, '#ffe9a8');
  ctx.globalAlpha = 1;
}

<script>
/* ============================================================================
   js/game.js — game state, player, camera, encounters, saves, transitions,
   input dispatch, main loop and boot.

   Modes: title | intro | play | dialogue | inventory | pause | battle |
          epilogue (chapter card)
   Story flags live in Game.flags (persisted); per-conversation choices in
   Game.asked (persisted too, so reloaded saves don't re-offer questions).
   ========================================================================== */
'use strict';

/* ------------------------------------------------------------------ input */
const Input = {
  keys: { up: false, down: false, left: false, right: false },
  lastAxis: 'x',
  map: {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right'
  }
};

function actionFromKey(e) {
  if (e.code === 'KeyE' || e.code === 'KeyZ' || e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space') return 'confirm';
  if (e.code === 'Escape') return 'pause';
  if (e.code === 'KeyI') return 'inv';
  if (e.code === 'Tab') return 'inv';
  if (e.code === 'KeyM') return 'mute';
  return null;
}

/* ------------------------------------------------------------------ save */
const SaveSys = {
  KEY: 'fructasia_ch1_save_v1',
  _ok: null,
  available() {
    if (this._ok !== null) return this._ok;
    try {
      localStorage.setItem('__fr_test', '1');
      localStorage.removeItem('__fr_test');
      this._ok = true;
    } catch (e) { this._ok = false; }
    return this._ok;
  },
  exists() { return this.available() && !!localStorage.getItem(this.KEY); },
  save() {
    if (!this.available()) return false;
    try {
      const data = {
        v: 1,
        area: World.areaId,
        x: Math.round(Player.x), y: Math.round(Player.y), dir: Player.dir,
        hp: Game.hp, maxhp: Game.maxhp,
        flags: Game.flags, asked: Game.asked,
        objective: { id: Game.objective.id, text: Game.objective.text },
        inv: Inventory.serialize(),
        playTime: Math.round(Game.playTime)
      };
      localStorage.setItem(this.KEY, JSON.stringify(data));
      return true;
    } catch (e) { return false; }
  },
  load() {
    if (!this.exists()) return null;
    try { return JSON.parse(localStorage.getItem(this.KEY)); } catch (e) { return null; }
  },
  clear() { if (this.available()) { try { localStorage.removeItem(this.KEY); } catch (e) {} } }
};

/* ------------------------------------------------------------------ player */
const Player = {
  x: 240, y: 396, dir: 'down', speed: 70,
  animT: 0, idleT: 0, moveT: 0, stepT: 0, moving: false,

  reset() {
    this.x = 240; this.y = 396; this.dir = 'down';
    this.animT = 0; this.idleT = 0; this.moving = false; this.stepT = 0;
  },
  box() { return { x: this.x - 5, y: this.y - 6, w: 10, h: 6 }; },
  surface() {
    const area = World.area;
    if (!area) return 'grass';
    if (area.chars) {
      const row = area.chars[clamp(Math.floor(this.y / TILE), 0, area.chars.length - 1)];
      const ch = row ? row[clamp(Math.floor(this.x / TILE), 0, row.length - 1)] : '.';
      if (ch === 'F') return 'wood';
      if (ch === 'W') return 'sand';
      return 'grass';
    }
    const id = bTerrainId(this.x, this.y + 2);
    return (id === 3 || id === 2) ? 'sand' : 'grass';
  },
  update(dt, blocked) {
    let dx = 0, dy = 0;
    const k = Input.keys;
    if (k.left) dx -= 1;
    if (k.right) dx += 1;
    if (k.up) dy -= 1;
    if (k.down) dy += 1;
    const moving = (dx !== 0 || dy !== 0) && !Game.waking;
    this.moving = moving;
    if (moving) {
      if (Math.abs(dy) > 0 && Math.abs(dx) > 0) {
        this.dir = Input.lastAxis === 'y' ? (dy > 0 ? 'down' : 'up') : (dx > 0 ? 'right' : 'left');
      } else if (dy !== 0) this.dir = dy > 0 ? 'down' : 'up';
      else this.dir = dx > 0 ? 'right' : 'left';

      const len = Math.hypot(dx, dy) || 1;
      const vx = dx / len * this.speed * dt;
      const vy = dy / len * this.speed * dt;
      // if we somehow stand inside a solid (bad spawn, old save), let the
      // player walk OUT instead of moonwalking in place forever
      const stuck = blocked(this.x, this.y);
      if (vx !== 0 && (stuck || !blocked(this.x + vx, this.y))) this.x += vx;
      if (vy !== 0 && (stuck || !blocked(this.x, this.y + vy))) this.y += vy;
      this.animT += dt;
      this.idleT = 0;
      this.stepT += dt;
      if (this.stepT > 0.28) {
        this.stepT = 0;
        AudioSys.footstep(this.surface());
      }
    } else {
      this.animT = 0;
      this.idleT += dt;
    }
    const area = World.area;
    if (area) {
      this.x = clamp(this.x, 12, area.w - 12);
      this.y = clamp(this.y, 12, area.h - 12);
    }
  },
  frame() {
    return this.moving ? Math.floor(this.animT * 7) % 4 : -1;
  },
  sprite(t) {
    const facing = this.dir === 'left' ? 'right' : this.dir;
    if (this.moving) {
      return SPR['p_' + facing + Math.floor(this.animT * 7) % 4];
    }
    // idle: slow breath dip + rare blink
    const blink = (this.idleT % 5.2) > 4.95;
    if (facing === 'down') return blink ? SPR.p_down_blink : SPR.p_down_idle;
    if (facing === 'right') return blink ? SPR.p_right_blink : SPR.p_right_idle;
    return SPR.p_up_idle;
  },
  draw(ctx, camX, camY, t) {
    if (Game.waking) {
      // lying in the sand until he wakes
      const spr = SPR.p_lying;
      const dx = Math.round(this.x - spr.width / 2 - camX);
      const dy = Math.round(this.y - spr.height + 3 - camY);
      drawShadow(ctx, this.x - camX, this.y - camY - 1, 18);
      ctx.drawImage(spr, dx, dy);
      return;
    }
    const spr = this.sprite(t);
    const passBob = this.moving && (Math.floor(this.animT * 7) % 4) % 2 === 1 ? -1 : 0;
    const breathe = !this.moving && (this.idleT % 2.6) > 2.1 ? 1 : 0;
    const w = spr.width, h = spr.height;
    const dx = Math.round(this.x - w / 2 - camX);
    const dy = Math.round(this.y - h - camY + passBob + breathe);
    drawShadow(ctx, this.x - camX, this.y - camY - 1, 11);
    if (this.dir === 'left') {
      ctx.save();
      ctx.translate(dx + w, dy);
      ctx.scale(-1, 1);
      ctx.drawImage(spr, 0, 0);
      ctx.restore();
    } else {
      ctx.drawImage(spr, dx, dy);
    }
  }
};

/* ------------------------------------------------------------------ weather */
const Weather = {
  rain: [], intensity: 1,
  init() {
    this.rain = [];
    for (let i = 0; i < 90; i++) {
      this.rain.push({
        x: Math.random() * (VW + 60) - 30, y: Math.random() * VH,
        len: 2 + Math.floor(Math.random() * 3),
        spd: 150 + Math.random() * 90, drift: 26 + Math.random() * 18
      });
    }
  },
  setIntensity(v) { this.intensity = v; },
  update(dt) {
    if (this.intensity <= 0) return;
    for (const d of this.rain) {
      d.y += d.spd * dt;
      d.x += d.drift * dt;
      if (d.y > VH + 6) { d.y = -8; d.x = Math.random() * (VW + 60) - 30; }
      if (d.x > VW + 30) d.x -= VW + 60;
    }
  },
  draw(ctx) {
    if (this.intensity <= 0) return;
    ctx.fillStyle = `rgba(198,226,235,${(0.2 * this.intensity).toFixed(2)})`;
    const n = Math.floor(this.rain.length * this.intensity);
    for (let i = 0; i < n; i++) {
      const d = this.rain[i];
      for (let s = 0; s < d.len; s++) ctx.fillRect(Math.round(d.x) - (s > 1 ? 1 : 0), Math.round(d.y) - s * 2, 1, 2);
    }
  }
};

/* ------------------------------------------------------------------ camera */
const Camera = {
  x: 0, y: 0,
  snap() {
    const area = World.area;
    if (!area) return;
    this.x = this.tx();
    this.y = this.ty();
  },
  tx() {
    const area = World.area;
    return area.w <= VW ? (area.w - VW) / 2 : clamp(Player.x - VW / 2, 0, area.w - VW);
  },
  ty() {
    const area = World.area;
    return area.h <= VH ? (area.h - VH) / 2 : clamp(Player.y - 16 - VH / 2, 0, area.h - VH);
  },
  update(dt) {
    const k = 1 - Math.pow(0.0008, dt);
    this.x = lerp(this.x, this.tx(), k);
    this.y = lerp(this.y, this.ty(), k);
    const area = World.area;
    if (area) {
      if (area.w > VW) this.x = clamp(this.x, 0, area.w - VW); else this.x = (area.w - VW) / 2;
      if (area.h > VH) this.y = clamp(this.y, 0, area.h - VH); else this.y = (area.h - VH) / 2;
    }
  }
};

/* ------------------------------------------------------------------ game */
const Game = {
  mode: 'title',
  titleScreen: 'menu',
  time: 0, playTime: 0,
  camera: Camera,
  objective: { id: 'explore', text: 'Explore the shore' },
  toast: null, toastT: 0,
  flags: {}, asked: {},
  hp: 20, maxhp: 20,
  examCount: 0,
  fade: { a: 0, dir: 0, cb: null },
  cooldown: 0,
  menuIndex: 0, pauseIndex: 0,
  pauseScreen: 'menu',
  invTab: 'all', invIndex: 0, invScroll: 0,
  areaNameT: 0,
  saveFlashT: 0,
  omen: { next: 26, active: 0, x: 0, y: 0 },
  weather: { birdT: 4 },
  nearest: null,
  waking: 0,
  wakingTalk: false,
  encounterT: 0,
  battleImmune: 0,
  epilogueDone: false,
  embedded: false,

  atk() { return 4 + Inventory.atk(); },
  def() { return 1 + Inventory.def(); },

  reset(full) {
    Player.reset();
    this.playTime = 0;
    this.objective = { id: 'explore', text: 'Explore the shore' };
    this.toast = null; this.toastT = 0;
    this.flags = {}; this.asked = {};
    this.examCount = 0;
    this.hp = 20; this.maxhp = 20;
    Inventory.reset();
    Inventory.add('jerky', 2);
    Inventory.add('compass');
    this.cooldown = 0;
    this.nearest = null;
    this.waking = 0;
    this.wakingTalk = false;
    this.encounterT = 0;
    this.battleImmune = 0;
    this.epilogueDone = false;
    this.omen = { next: 26, active: 0, x: 0, y: 0 };
    this.objFlash = 0;
    this.saveFlashT = 0;
    this.areaNameT = 0;
    this.pauseIndex = 0;
    this.pauseScreen = 'menu';
    this.titleScreen = 'menu';
    this.menuIndex = 0;
    this.fade = { a: 0, dir: 0, cb: null };
    this.epiT = 0;
    Input.keys.up = Input.keys.down = Input.keys.left = Input.keys.right = false;
    Battle.active = false;
    Battle.enemy = null;
    Battle.projectiles = [];
    Battle.state = 'intro';
    Dialogue.reset();
    World.visited = {};
  },

  setObjective(id, text) {
    if (this.objective.id === id) return;
    this.objective = { id, text };
    this.objFlash = 2.8;
    AudioSys.stepObj();
  },
  showToast(text) { this.toast = text; this.toastT = 3.4; },

  /* ------------------------------------------------ lifecycle */
  newGame() {
    this.reset(true);
    this.mode = 'intro';
    Intro.begin();
  },
  introDone() {
    // fade from the intro into the beach; the sailor wakes among the wreck
    this.transition(() => {
      World.load('beach', BEACH_SPAWN.x, BEACH_SPAWN.y, BEACH_SPAWN.dir);
      Camera.snap();
      this.mode = 'play';
      this.waking = 2.6;            // seconds lying in the sand
      this.fade = { a: 1, dir: -1, cb: null };
    });
  },
  continueGame() {
    const data = SaveSys.load();
    if (!data) { this.newGame(); return; }
    this.reset(true);
    this.flags = data.flags || {};
    this.asked = data.asked || {};
    this.hp = data.hp || 20;
    this.maxhp = data.maxhp || 20;
    if (data.objective) this.objective = data.objective;
    Inventory.deserialize(data.inv);
    this.playTime = data.playTime || 0;
    World.visited = {};   // re-show area names, but not first-visit hooks
    World.visited[data.area] = true;
    this.transition(() => {
      World.load(data.area || 'beach', data.x, data.y, data.dir || 'down');
      Camera.snap();
      this.mode = 'play';
      this.fade = { a: 1, dir: -1, cb: null };
    });
  },
  restart() {
    this.reset(true);
    this.transition(() => {
      World.load('beach', BEACH_SPAWN.x, BEACH_SPAWN.y, BEACH_SPAWN.dir);
      Camera.snap();
      this.mode = 'play';
      this.waking = 1.2;
      this.fade = { a: 1, dir: -1, cb: null };
    });
  },
  toTitle() {
    this.reset(true);
    this.mode = 'title';
    this.titleScreen = 'menu';
    this.menuIndex = 0;
    AudioSys.restartSong('title');
    AudioSys.setMix({ ocean: 0.09, wind: 0.012, rain: 0, hum: 0.016 }, 0.5);
  },
  transition(cb) {
    if (this.fade.dir !== 0) { if (cb) cb(); return; }
    this.fade = { a: 0, dir: 1, cb };
  },

  /* ------------------------------------------------ area transitions */
  checkExits() {
    for (const ex of World.exits) {
      if (Player.x > ex.x && Player.x < ex.x + ex.w && Player.y > ex.y && Player.y < ex.y + ex.h) {
        this.transition(() => {
          World.load(ex.to, ex.tx, ex.ty, ex.dir || 'down');
          Camera.snap();
          this.areaNameT = 3.2;
          this.mode = 'play';
          this.battleImmune = 1.2;
          // objective progression on arriving in the village
          if (ex.to === 'village' && this.objective.id === 'village') {
            this.setObjective('findali', 'Find Ali Sama at the tavern');
          }
          this.fade = { a: 1, dir: -1, cb: null };
        });
        return;
      }
    }
  },

  /* ------------------------------------------------ encounters */
  updateEncounters(dt) {
    if (this.battleImmune > 0) { this.battleImmune -= dt; return; }
    if (!Player.moving) return;
    const enc = World.encounterAt(Player.x, Player.y);
    if (!enc) return;
    this.encounterT += dt;
    // scripted first encounter on the trail
    if (World.areaId === 'trail' && !this.flags.trailFirstEncounter && this.encounterT > 3.2) {
      this.flags.trailFirstEncounter = true;
      this.startBattle('crabApple', true);
      return;
    }
    if (this.encounterT > enc.rate) {
      this.encounterT = 0;
      if (Math.random() < enc.chance) {
        const pool = enc.pool || ['crabApple'];
        this.startBattle(pool[Math.floor(Math.random() * pool.length)], false);
      }
    }
  },
  startBattle(enemyId, scripted) {
    this.showToast(scripted ? 'The bushes rustle with intent...' : 'Something rustles!');
    AudioSys.encounterZap();
    this.transition(() => {
      if (!Battle.start(enemyId)) {
        this.mode = 'play';
        return;
      }
      this.mode = 'battle';
      this.fade = { a: 1, dir: -1, cb: null };
    });
  },
  exitBattle(result, drop) {
    Battle.active = false;
    this.mode = 'play';
    this.battleImmune = 7;
    this.encounterT = 0;
    const music = Areas[World.areaId] && Areas[World.areaId].music;
    if (music) AudioSys.playSong(music); else AudioSys.stopSong();
    AudioSys.setMix((Areas[World.areaId] && Areas[World.areaId].ambience) || {}, 0.5);
    if (result === 'lose') {
      this.defeat();
      return;
    }
    if (drop && ITEMS[drop]) {
      Inventory.add(drop, 1);
      this.showToast('Found: ' + ITEMS[drop].name);
      AudioSys.itemGet();
    } else if (result === 'win') {
      this.showToast('You feel steadier. The island feels you.');
    } else if (result === 'spared') {
      this.showToast('It settles back into the island. Peace, of a kind.');
    }
  },
  defeat() {
    // Defeat = the nearest Memory Lantern re-kindles you (storyline §4)
    this.transition(() => {
      const data = SaveSys.load();
      if (data) {
        this.hp = this.maxhp;
        World.load(data.area, data.x, data.y, data.dir || 'down');
      } else {
        this.hp = this.maxhp;
        World.load('beach', BEACH_SPAWN.x, BEACH_SPAWN.y, BEACH_SPAWN.dir);
      }
      Camera.snap();
      this.mode = 'play';
      this.battleImmune = 3;
      this.showToast('The lantern re-kindles you at the last moment you were entirely yourself.');
      this.fade = { a: 1, dir: -1, cb: null };
    });
  },

  /* ------------------------------------------------ objective/flow helpers */
  updateFlow() {
    // wake-up micro-scene
    if (this.waking > 0) {
      this.waking = Math.max(0, this.waking - dtGlobal);
      if (this.waking <= 0 && !this.wakingTalk) {
        this.wakingTalk = true;
        this.mode = 'dialogue';
        Dialogue.start([
          L('Sailor', 'Sand. Gulls. A headache the size of the horizon.'),
          L('Sailor', 'The Marigold is gone. The compass says north-west. The compass can wait.'),
          OBJ('explore', 'Explore the shore')
        ], () => {
          this.mode = 'play';
          this.cooldown = 0.3;
        });
      }
      return;
    }
    // Vax discovery: after a little wandering, point the player at him
    if (this.objective.id === 'explore' && this.playTime > 6) {
      const vax = World.npcs.find(n => n.id === 'vax');
      if (vax && mdist(Player.x, Player.y, vax.x, vax.y) < 260) {
        this.setObjective('talk', 'Speak with the stranger by the lantern');
        AudioSys.bird();
      } else if (this.examCount >= 3 || this.playTime > 45) {
        this.setObjective('talk', 'Someone keeps a lantern lit inland. Find them.');
      }
    }
    // village objective chain
    if (this.objective.id === 'findali' && this.flags.metAli) {
      this.setObjective('villagefolk', 'Meet Majhool at the shrine and Levi by the well');
    }
    if (this.objective.id === 'villagefolk' && this.flags.metMajhool && this.flags.metLevi) {
      this.setObjective('token', 'Return to Majhool at the shrine');
    }
    // chapter one end card
    if (this.flags.chapterOneEnd && !this.flags.chapterCardShown && this.mode === 'play') {
      this.flags.chapterCardShown = true;
      this.mode = 'epilogue';
      this.epiT = 0;
      AudioSys.stopSong();
    }
  }
};

/* ------------------------------------------------------------- draw helpers */
function drawShadow(ctx, cx, cy, w) {
  const x = Math.round(cx - w / 2), y = Math.round(cy);
  ctx.fillStyle = 'rgba(24,30,42,0.22)';
  ctx.fillRect(x + 1, y, w - 2, 1);
  ctx.fillRect(x + 2, y + 1, w - 4, 1);
  ctx.fillStyle = 'rgba(24,30,42,0.13)';
  ctx.fillRect(x, y, w, 1);
}

function drawProp(ctx, p, camX, camY, t) {
  const spr = SPR[p.spr];
  if (!spr) return;
  const w = spr.width, h = spr.height;
  let ox = 0;
  if (p.sway !== undefined && !p.dead) ox = Math.round(Math.sin(t * 1.1 + p.sway * 1.3) * 0.6 + Math.sin(t * 2.3 + p.sway) * 0.25);
  const dx = Math.round(p.x - w / 2 - camX + ox);
  const dy = Math.round(p.y - h - camY);
  if (!p.flat && !p.noShadow) drawShadow(ctx, p.x - camX, p.y - camY - 1, Math.max(6, Math.round(w * 0.55)));
  if (p.flip) {
    ctx.save();
    ctx.translate(dx + w, dy);
    ctx.scale(-1, 1);
    ctx.drawImage(spr, 0, 0);
    ctx.restore();
  } else {
    ctx.drawImage(spr, dx, dy);
  }
  // lantern glow
  if (p.lantern === 'beach' || p.lantern === 'village') {
    const a = 0.16 + Math.sin(t * 2.2 + p.x) * 0.03;
    const gr = ctx.createRadialGradient(p.x - camX, p.y - 34 - camY, 2, p.x - camX, p.y - 34 - camY, 26);
    gr.addColorStop(0, `rgba(255,208,120,${(a * 1.6).toFixed(2)})`);
    gr.addColorStop(1, 'rgba(255,208,120,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(p.x - camX - 26, p.y - 34 - camY - 26, 52, 52);
  }
  if (p.hearth) {
    const a = 0.2 + Math.sin(t * 6) * 0.05 + Math.sin(t * 11) * 0.03;
    const gr = ctx.createRadialGradient(p.x - camX, p.y - 22 - camY, 2, p.x - camX, p.y - 22 - camY, 30);
    gr.addColorStop(0, `rgba(255,160,80,${a.toFixed(2)})`);
    gr.addColorStop(1, 'rgba(255,160,80,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(p.x - camX - 30, p.y - 22 - camY - 30, 60, 60);
  }
}

function drawNpc(ctx, n, camX, camY, t) {
  let spr, dy2 = 0;
  if (n.vax) {
    const facing = n.dir === 'left' ? 'right' : n.dir;
    let key;
    if (n.talking) {
      key = 'v_' + facing + '_talk';
      dy2 = Math.floor(n.idleT * 5) % 2; // talk bob
    } else {
      const ph = Math.floor(n.idleT / 1.8) % 4;
      if (ph === 1) key = 'v_' + facing + '1';
      else if (ph === 3 && Math.floor(n.idleT / 14) % 2 === 1) key = 'v_' + facing + '2';
      else key = 'v_' + facing + '0';
    }
    if (!SPR[key]) key = 'v_' + facing + '0';
    spr = SPR[key];
  } else {
    spr = n.spriteFrame(t);
    dy2 = Math.floor(n.idleT / 1.6) % 2; // idle weight-shift bob
  }
  if (!spr) return;
  const w = spr.width, h = spr.height;
  const dx = Math.round(n.x - w / 2 - camX);
  const dy = Math.round(n.y - h - camY + (dy2 ? 1 : 0));
  drawShadow(ctx, n.x - camX, n.y - camY - 1, Math.max(8, Math.round(w * 0.5)));
  if (n.dir === 'left') {
    ctx.save();
    ctx.translate(dx + w, dy);
    ctx.scale(-1, 1);
    ctx.drawImage(spr, 0, 0);
    ctx.restore();
  } else {
    ctx.drawImage(spr, dx, dy);
  }
}

/* --------------------------------------------------------- water (beach) */
const WaterGrid = { cell: 8, w: 0, h: 0, ids: null };
function buildWaterGrid() {
  const area = World.area;
  if (!area || World.areaId !== 'beach') return;
  WaterGrid.w = Math.ceil(area.w / WaterGrid.cell);
  WaterGrid.h = Math.ceil(area.h / WaterGrid.cell);
  if (!WaterGrid.ids || WaterGrid.ids.length !== WaterGrid.w * WaterGrid.h) {
    WaterGrid.ids = new Uint8Array(WaterGrid.w * WaterGrid.h);
  }
  for (let cy = 0; cy < WaterGrid.h; cy++) {
    for (let cx = 0; cx < WaterGrid.w; cx++) {
      WaterGrid.ids[cy * WaterGrid.w + cx] = bTerrainId(cx * WaterGrid.cell + 4, cy * WaterGrid.cell + 4);
    }
  }
}
function drawWater(ctx, camX, camY, t) {
  if (!WaterGrid.ids) buildWaterGrid();
  const cell = WaterGrid.cell;
  const c0 = Math.floor(camX / cell), c1 = Math.ceil((camX + VW) / cell);
  const r0 = Math.floor(camY / cell), r1 = Math.ceil((camY + VH) / cell);
  for (let cy = r0; cy <= r1; cy++) {
    if (cy < 0 || cy >= WaterGrid.h) continue;
    for (let cx = c0; cx <= c1; cx++) {
      if (cx < 0 || cx >= WaterGrid.w) continue;
      const id = WaterGrid.ids[cy * WaterGrid.w + cx];
      if (id !== 0 && id !== 1) continue;
      const wx = cx * cell, wy = cy * cell;
      const sx = wx - camX, sy = wy - camY;
      const h = hash2(cx, cy);
      const phase = (t * (id === 1 ? 1.4 : 0.85) + h * 6.28);
      const dx = Math.round(Math.sin(phase) * 3);
      const dy = Math.round(Math.sin(phase * 0.7 + 1) * 1);
      if (h > 0.45) {
        ctx.fillStyle = id === 1 ? 'rgba(126,206,204,0.30)' : 'rgba(78,158,178,0.22)';
        ctx.fillRect(sx + 3 + dx, sy + 5 + dy, 4, 1);
      }
      if (h > 0.86) {
        ctx.fillStyle = id === 1 ? 'rgba(190,240,232,0.34)' : 'rgba(120,190,200,0.20)';
        ctx.fillRect(sx + 9 - dx, sy + 10 + dy, 3, 1);
      }
    }
  }
  const x0 = Math.max(0, Math.floor(camX) - 2);
  const x1 = Math.min(World.area.w, Math.ceil(camX + VW) + 2);
  for (let x = x0; x < x1; x += 2) {
    const sh = bShoreY(x);
    const wave = Math.sin(x * 0.06 + t * 1.7) * 2.2 + Math.sin(x * 0.17 - t * 2.3) * 0.9;
    const yy = Math.round(sh - 1 + wave);
    const sy = yy - camY;
    if (sy < -2 || sy > VH + 2) continue;
    const a = 0.35 + 0.25 * Math.sin(x * 0.1 + t * 2.2);
    ctx.fillStyle = `rgba(226,246,242,${a.toFixed(2)})`;
    ctx.fillRect(x - camX, sy, 2, 1);
    if ((x + Math.floor(t * 12)) % 16 < 3) {
      ctx.fillStyle = 'rgba(240,255,250,0.55)';
      ctx.fillRect(x - camX, sy + 1, 1, 1);
    }
  }
}

function drawCloudShadows(ctx, t) {
  ctx.save();
  ctx.globalAlpha = 0.075;
  ctx.fillStyle = '#0c1a22';
  const spots = [[0.12, 0.22, 220, 96], [0.55, 0.62, 260, 110], [0.86, 0.3, 180, 80]];
  for (let i = 0; i < spots.length; i++) {
    const s = spots[i];
    const x = ((s[0] * (VW + 500) + t * (7 + i * 3)) % (VW + 500)) - 250;
    const y = s[1] * VH + Math.sin(t * 0.18 + i) * 12;
    ctx.beginPath();
    ctx.ellipse(x, y, s[2] / 2, s[3] / 2, 0, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

const Vignette = { canvas: null };
function buildVignette() {
  const mk = makeCanvas(VW, VH);
  const g = mk.x.createRadialGradient(VW / 2, VH / 2, VH * 0.30, VW / 2, VH / 2, VH * 0.95);
  g.addColorStop(0, 'rgba(8,12,20,0)');
  g.addColorStop(0.65, 'rgba(8,12,20,0.10)');
  g.addColorStop(1, 'rgba(8,12,20,0.42)');
  mk.x.fillStyle = g;
  mk.x.fillRect(0, 0, VW, VH);
  Vignette.canvas = mk.c;
}

/* ------------------------------------------------------- interactions */
function updateNearest() {
  const px0 = Player.x, py0 = Player.y - 4;
  let best = null, bestD = 26;
  for (const it of World.interactables) {
    const dx = Math.max(0, Math.abs(px0 - it.x) - it.hw);
    const dy = Math.max(0, Math.abs(py0 - it.y) - it.hh);
    const d = Math.hypot(dx, dy);
    if (d < bestD) { bestD = d; best = it; }
  }
  if (best) {
    best.sx = best.x - Math.round(Camera.x);
    best.sy = (best.top !== undefined ? best.top : best.y - 12) - Math.round(Camera.y);
  }
  Game.nearest = best;
}

function tryInteract() {
  if (Game.cooldown > 0) return;
  const it = Game.nearest;
  if (!it) return;

  if (it.kind === 'npc') {
    const n = it.ref;
    AudioSys.examine();
    n.talking = true;
    n.face(Player.x, Player.y);
    Game.mode = 'dialogue';
    const nodes = n.script();
    Dialogue.start(nodes, () => {
      n.talking = false;
      Game.mode = 'play';
      Game.cooldown = 0.35;
      if (n.id === 'vax' && !Game.flags.vaxStage) Game.flags.vaxStage = 1;
    });
    return;
  }

  if (it.kind === 'lantern') {
    AudioSys.examine();
    const p = it.ref;
    const lines = p.lantern === 'beach' ? [
      'The lantern remembers: a ship with white sails that stayed one night, and left at dawn, and never arrived anywhere.'
    ] : [
      'The lantern remembers: a festival with no name that everyone attended, and no one can describe.'
    ];
    Game.mode = 'dialogue';
    Dialogue.start([
      L('Sailor', 'A Guild lantern, older than the village. The flame leans toward me as I stop, like a dog that knows its name.'),
      L('Sailor', lines[0]),
      FN(() => {
        Game.hp = Game.maxhp;
        const ok = SaveSys.save();
        Game.saveFlashT = 1.6;
        AudioSys.save();
        Game.showToast(ok ? 'Rested. The lantern remembers you. (Saved)' : 'Rested. (Saving unavailable here)');
      })
    ], () => {
      Game.mode = 'play';
      Game.cooldown = 0.4;
    });
    return;
  }

  const p = it.ref;
  if (!p.interact) return;
  AudioSys.examine();
  Game.mode = 'dialogue';
  Game.examCount++;
  const taken = p.interact.once && Game.flags[p.interact.once];
  let nodes;
  if (taken) {
    nodes = [L('Sailor', p.interact.after || 'Nothing else here worth taking.')];
  } else {
    nodes = p.interact.lines.map(l => Dialogue.say(l.who, l.text, l));
  }
  Dialogue.start(nodes, () => {
    Game.mode = 'play';
    Game.cooldown = 0.3;
    if (p.interact.once && !Game.flags[p.interact.once] && p.interact.item) {
      Game.flags[p.interact.once] = true;
      const d = ITEMS[p.interact.item];
      if (d) {
        Inventory.add(p.interact.item, 1);
        Game.showToast('Got ' + d.name + '!');
        AudioSys.itemGet();
      }
    }
    if (Game.objective.id === 'explore' && Game.examCount >= 2) {
      Game.setObjective('talk', 'Someone keeps a lantern lit inland. Find them.');
    }
  });
}

/* ------------------------------------------------------- title helpers */
function titleItems() {
  const hasSave = SaveSys.exists();
  const items = [];
  if (hasSave) items.push({ act: 'continue' });
  items.push({ act: 'new' });
  items.push({ act: 'controls' });
  items.push({ act: 'sound' });
  return items;
}

/* ------------------------------------------------------- input dispatch */
function handleAction(action) {
  if (action === 'mute') {
    if (AudioSys.enabled && AudioSys.volume > 0) {
      const v = AudioSys.cycleVolume();
      Game.showToast('Sound: ' + (v === 1 ? 'On' : v === 0.5 ? 'Half' : 'Muted'));
    } else {
      AudioSys.setEnabled(true);
      Game.showToast('Sound: On');
    }
    return;
  }
  const m = Game.mode;

  if (m === 'title') {
    const items = titleItems();
    if (Game.titleScreen === 'controls') {
      if (action === 'confirm' || action === 'pause') { Game.titleScreen = 'menu'; AudioSys.back(); }
      return;
    }
    if (action === 'up') { Game.menuIndex = (Game.menuIndex + items.length - 1) % items.length; AudioSys.select(); }
    else if (action === 'down') { Game.menuIndex = (Game.menuIndex + 1) % items.length; AudioSys.select(); }
    else if (action === 'confirm') {
      const it = items[Game.menuIndex];
      AudioSys.select();
      if (it.act === 'continue') Game.continueGame();
      else if (it.act === 'new') Game.newGame();
      else if (it.act === 'controls') Game.titleScreen = 'controls';
      else if (it.act === 'sound') {
        if (AudioSys.enabled && AudioSys.volume > 0) AudioSys.cycleVolume();
        else AudioSys.setEnabled(true);
      }
    }
    return;
  }

  if (m === 'intro') {
    if (action === 'pause') Intro.skip();
    else if (action === 'confirm') Intro.advance();
    return;
  }

  if (m === 'play') {
    if (action === 'confirm') tryInteract();
    else if (action === 'pause') { Game.mode = 'pause'; Game.pauseIndex = 0; Game.pauseScreen = 'menu'; AudioSys.select(); }
    else if (action === 'inv') { Game.mode = 'inventory'; Game.invTab = 'all'; Game.invIndex = 0; Game.invScroll = 0; AudioSys.open(); }
    return;
  }

  if (m === 'dialogue') {
    if (action === 'confirm') {
      if (Dialogue.choiceOpen) Dialogue.pick();
      else Dialogue.advance();
    } else if (action === 'up') { if (Dialogue.choiceOpen) Dialogue.moveChoice(-1); }
    else if (action === 'down') { if (Dialogue.choiceOpen) Dialogue.moveChoice(1); }
    return;
  }

  if (m === 'inventory') {
    const list = Game.invTab === 'all' ? Inventory.slots : Inventory.byCat(Game.invTab);
    if (action === 'up') { Game.invIndex = Math.max(0, Game.invIndex - 1); AudioSys.select(); }
    else if (action === 'down') { Game.invIndex = Math.min(list.length - 1, Game.invIndex + 1); AudioSys.select(); }
    else if (action === 'pause') { Game.mode = 'play'; AudioSys.close(); }
    else if (action === 'inv') {
      let i = INV_TABS.findIndex(t => t.id === Game.invTab);
      i = (i + 1) % INV_TABS.length;
      Game.invTab = INV_TABS[i].id;
      Game.invIndex = 0; Game.invScroll = 0;
      AudioSys.select();
    }
    else if (action === 'confirm') {
      const sel = list[Game.invIndex];
      if (!sel) return;
      const d = ITEMS[sel.id];
      if (d.cat === 'consumable') {
        const res = Inventory.use(sel.id, Game.hp, Game.maxhp);
        if (res) {
          Game.hp = res.hpAfter;
          AudioSys.heal();
          Game.showToast(res.healed > 0 ? 'Restored ' + res.healed + ' HP.' : 'You are already whole.');
        }
        if (Game.invIndex >= list.length) Game.invIndex = list.length - 1;
      } else if (d.cat === 'equip') {
        if (Inventory.isEquipped(sel.id)) { Inventory.unequip(d.slot); AudioSys.back(); Game.showToast('Unequipped ' + d.name + '.'); }
        else { Inventory.equipItem(sel.id); AudioSys.select(); Game.showToast('Equipped ' + d.name + '.'); }
      } else {
        AudioSys.talk();
      }
    } else if (action === 'left' || action === 'right') {
      // cycle tabs
      let i = INV_TABS.findIndex(t => t.id === Game.invTab);
      i = (i + (action === 'right' ? 1 : INV_TABS.length - 1)) % INV_TABS.length;
      Game.invTab = INV_TABS[i].id;
      Game.invIndex = 0; Game.invScroll = 0;
      AudioSys.select();
    }
    return;
  }

  if (m === 'pause') {
    if (Game.pauseScreen === 'controls') {
      if (action === 'confirm' || action === 'pause') { Game.pauseScreen = 'menu'; AudioSys.back(); }
      return;
    }
    if (action === 'pause') { Game.mode = 'play'; AudioSys.back(); }
    else if (action === 'up') { Game.pauseIndex = (Game.pauseIndex + PAUSE_ITEMS.length - 1) % PAUSE_ITEMS.length; AudioSys.select(); }
    else if (action === 'down') { Game.pauseIndex = (Game.pauseIndex + 1) % PAUSE_ITEMS.length; AudioSys.select(); }
    else if (action === 'confirm') {
      AudioSys.select();
      const it = PAUSE_ITEMS[Game.pauseIndex];
      if (it === 'Resume') Game.mode = 'play';
      else if (it === 'Inventory') { Game.mode = 'inventory'; Game.invTab = 'all'; Game.invIndex = 0; AudioSys.open(); }
      else if (it === 'Controls') Game.pauseScreen = 'controls';
      else if (it === 'Save Game') {
        const ok = SaveSys.save();
        Game.saveFlashT = 1.6;
        Game.showToast(ok ? 'Saved.' : 'Saving unavailable in this browser.');
        if (ok) AudioSys.save();
      }
      else if (it === 'Restart') Game.restart();
      else if (it === 'Sound') {
        if (AudioSys.enabled && AudioSys.volume > 0) AudioSys.cycleVolume();
        else AudioSys.setEnabled(true);
      }
      else if (it === 'Title Screen') Game.toTitle();
    }
    return;
  }

  if (m === 'battle') {
    Battle.onAction(action);
    return;
  }

  if (m === 'epilogue') {
    if (action === 'confirm' && Game.epiT > 1.0) {
      Game.mode = 'play';
      Game.cooldown = 0.3;
      Game.showToast('Objective: ' + Game.objective.text);
      AudioSys.advance();
    }
    return;
  }
}

/* ------------------------------------------------------------- events */
function installInputListeners() {
  window.addEventListener('keydown', (e) => {
    AudioSys.unlock();   // browsers keep AudioContext suspended until a gesture
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const dir = Input.map[e.code];
    if (dir) {
      Input.keys[dir] = true;
      if (dir === 'up' || dir === 'down') Input.lastAxis = 'y';
      else Input.lastAxis = 'x';
      if (e.repeat) return;
      handleAction(dir);
      return;
    }
    if (e.repeat) return;
    const act = actionFromKey(e);
    if (act) handleAction(act);
  });
  window.addEventListener('keyup', (e) => {
    const dir = Input.map[e.code];
    if (dir) Input.keys[dir] = false;
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) AudioSys.unlock();
  });
  window.addEventListener('blur', () => {
    Input.keys.up = Input.keys.down = Input.keys.left = Input.keys.right = false;
    if (Game.mode === 'play') { Game.mode = 'pause'; Game.pauseIndex = 0; Game.pauseScreen = 'menu'; }
  });
  window.addEventListener('pointerdown', () => {
    AudioSys.unlock();
    if (Game.mode === 'intro') Intro.advance();
    else if (Game.mode === 'dialogue') handleAction('confirm');
  });
}

/* ------------------------------------------------------------- update */
let dtGlobal = 0.016;
function update(dt) {
  dtGlobal = dt;
  Game.time += dt;
  Weather.update(dt);
  if (Game.toastT > 0) Game.toastT -= dt;
  if (Game.objFlash > 0) Game.objFlash -= dt;
  if (Game.cooldown > 0) Game.cooldown -= dt;
  if (Game.saveFlashT > 0) Game.saveFlashT -= dt;
  if (Game.areaNameT > 0) Game.areaNameT -= dt;
  AudioSys.tickMusic();

  if (Game.fade.dir !== 0) {
    Game.fade.a = clamp(Game.fade.a + Game.fade.dir * dt * 2.2, 0, 1);
    if (Game.fade.a >= 1 && Game.fade.dir > 0) {
      Game.fade.dir = 0;
      const cb = Game.fade.cb;
      Game.fade.cb = null;
      if (cb) cb();
    }
    if (Game.fade.a <= 0 && Game.fade.dir < 0) Game.fade.dir = 0;
  }

  const m = Game.mode;
  if (m === 'title') {
    return;
  }
  if (m === 'intro') {
    Intro.update(dt);
    return;
  }
  if (m === 'play') {
    Game.playTime += dt;
    Player.update(dt, blockedAt);
    for (const n of World.npcs) n.update(dt);
    updateNearest();
    Camera.update(dt);
    Game.checkExits();
    Game.updateEncounters(dt);
    Game.updateFlow();
    // ambience: birds + the omen in the treeline (beach only)
    if (World.areaId === 'beach' || World.areaId === 'village') {
      Game.weather.birdT -= dt;
      if (Game.weather.birdT <= 0) { AudioSys.bird(); Game.weather.birdT = 8 + Math.random() * 10; }
    }
    if (World.areaId === 'beach') {
      if (Game.omen.active > 0) Game.omen.active -= dt;
      else {
        Game.omen.next -= dt;
        if (Game.omen.next <= 0) {
          Game.omen.next = 30 + Math.random() * 25;
          Game.omen.active = 2.6;
          Game.omen.x = 180 + Math.random() * 420;
          Game.omen.y = 138 + Math.random() * 8;
          AudioSys.moan();
        }
      }
    }
    return;
  }
  if (m === 'dialogue') {
    Dialogue.update(dt);
    for (const n of World.npcs) n.update(dt);
    return;
  }
  if (m === 'inventory') {
    return;
  }
  if (m === 'pause') {
    return;
  }
  if (m === 'battle') {
    Battle.update(dt, Input.keys);
    return;
  }
  if (m === 'epilogue') {
    Game.epiT += dt;
    return;
  }
}

/* ------------------------------------------------------------- render */
function drawWorld(ctx, t) {
  const camX = Math.round(Camera.x), camY = Math.round(Camera.y);
  const area = World.area;
  // letterbox for small indoor areas
  ctx.fillStyle = '#05070c';
  ctx.fillRect(0, 0, VW, VH);
  if (area.w <= VW || area.h <= VH) {
    // small indoor areas: centered, no scroll
    ctx.drawImage(area.terrainCanvas, Math.round((VW - area.w) / 2), Math.round((VH - area.h) / 2));
  } else {
    ctx.drawImage(area.terrainCanvas, camX, camY, VW, VH, 0, 0, VW, VH);
  }
  if (World.areaId === 'beach') drawWater(ctx, camX, camY, t);
  if (!Areas[World.areaId] || !Areas[World.areaId].indoor) drawCloudShadows(ctx, t);

  // omen: pale eyes in the treeline, gone before you're sure
  if (World.areaId === 'beach') {
    const om = Game.omen;
    if (om.active > 0) {
      const a = Math.min(1, Math.min(om.active, 2.6 - om.active + 0.2) * 1.4);
      const ex = Math.round(om.x - camX), ey = Math.round(om.y - camY);
      ctx.globalAlpha = clamp(a, 0, 1) * 0.85;
      ctx.fillStyle = '#e8e0b8';
      ctx.fillRect(ex, ey, 2, 1);
      ctx.fillRect(ex + 4, ey, 2, 1);
      ctx.globalAlpha = 1;
    }
  }

  // y-sorted draw list
  const items = [];
  for (const p of World.props) {
    if (p.flat) items.push({ y: -999, p });
    else items.push({ y: p.y, p });
  }
  for (const n of World.npcs) items.push({ y: n.y, n });
  items.push({ y: Player.y, player: true });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) {
    if (it.player) Player.draw(ctx, camX, camY, t);
    else if (it.n) drawNpc(ctx, it.n, camX, camY, t);
    else drawProp(ctx, it.p, camX, camY, t);
  }

  // gold diamond over the nearest examinable
  const near = Game.nearest;
  if (near && Game.mode === 'play' && near.kind === 'obj') {
    const bob = Math.round(Math.sin(t * 3) * 1.5);
    const mx = Math.round(near.sx), my = Math.round(near.sy - 6 + bob);
    ctx.fillStyle = 'rgba(228,201,124,0.9)';
    ctx.fillRect(mx - 1, my, 3, 1);
    ctx.fillRect(mx, my - 1, 1, 3);
  }
  // talk bubble over Vax while he's the objective
  if (Game.objective.id === 'talk' && Game.mode === 'play') {
    const vax = World.npcs.find(n => n.id === 'vax');
    if (vax) {
      const bob = Math.round(Math.sin(t * 2.4) * 1.5);
      const mx = Math.round(vax.x - camX), my = Math.round(vax.y - 44 - camY + bob);
      ctx.drawImage(SPR.bubble, mx - 5, my - 10);
      drawText(ctx, '!', mx - 1, my - 7, '#2a2438');
    }
  }
  // cold shadow pooling at the beach treeline
  if (World.areaId === 'beach') {
    const fy = bForestY(Player.x) - camY;
    if (fy < VH + 40) {
      const g = ctx.createLinearGradient(0, fy - 60, 0, fy + 24);
      g.addColorStop(0, 'rgba(10,12,22,0.55)');
      g.addColorStop(0.55, 'rgba(10,12,22,0.25)');
      g.addColorStop(1, 'rgba(10,12,22,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, Math.max(0, fy - 60), VW, Math.min(VH, fy + 24) - Math.max(0, fy - 60));
    }
  }
  ctx.drawImage(Vignette.canvas, 0, 0);
  Weather.draw(ctx);
}

let ctx = null, canvas = null;

function render(t) {
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, VW, VH);
  const m = Game.mode;
  if (m === 'title') {
    drawTitle(ctx, t);
  } else if (m === 'intro') {
    Intro.draw(ctx, t);
  } else if (m === 'battle') {
    Battle.draw(ctx, t);
  } else {
    if (World.area) drawWorld(ctx, t);
    const hud = m === 'play';
    if (hud || m === 'dialogue') drawHUD(ctx, t);
    if (m === 'dialogue') drawDialogueBox(ctx, t);
    if (m === 'inventory') drawInventory(ctx, t);
    if (m === 'pause') {
      drawWorld(ctx, t);
      drawPause(ctx, t);
      if (Game.pauseScreen === 'controls') {
        const cw = Math.min(VW - 16, 300);
        const chH = 34 + CONTROLS_ROWS.length * 15;
        drawControls(ctx, Math.round((VW - cw) / 2), Math.round((VH - chH) / 2), cw);
      }
    }
    if (m === 'epilogue') drawChapterCard(ctx, t);
    drawSaveFlash(ctx);
  }
  if (Game.fade.a > 0) {
    ctx.fillStyle = `rgba(4,7,12,${Game.fade.a.toFixed(3)})`;
    ctx.fillRect(0, 0, VW, VH);
  }
}

/* ------------------------------------------------------------- boot */
function resize() {
  const wrap = document.getElementById('wrap');
  const availW = wrap.clientWidth || window.innerWidth;
  const availH = wrap.clientHeight || window.innerHeight;
  let scale = Math.min(availW / VW, availH / VH);
  if (scale > 2) scale = Math.floor(scale);
  scale = Math.max(0.4, scale);
  canvas.style.width = Math.round(VW * scale) + 'px';
  canvas.style.height = Math.round(VH * scale) + 'px';
}

let lastT = 0;
function loop(now) {
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  try {
    update(dt);
    render(Game.time);
  } catch (err) {
    window.__errors.push(String(err && err.stack || err));
    console.error(err);
  }
  requestAnimationFrame(loop);
}

function boot() {
  window.__errors = window.__errors || [];
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  buildAllSprites();
  buildPropSprites();
  buildVignette();
  Weather.init();

  try { Game.embedded = window.top !== window.self; } catch (e) { Game.embedded = true; }
  Game.reset(true);
  Game.mode = 'title';
  Game.titleScreen = 'menu';
  AudioSys.startAmbience();          // layers exist from frame one (suspended until gesture)
  AudioSys.playSong('title');
  AudioSys.setMix({ ocean: 0.09, wind: 0.012, rain: 0, hum: 0.016 }, 1);

  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 60));
  installInputListeners();

  // ---- test hooks (used by tools/harness.mjs; harmless in a browser)
  window.__game = {
    Game, Player, Camera, Dialogue, Inventory, Battle, World, Areas, Input, AudioSys, SPR, ITEMS,
    Intro, SaveSys, blockedAt, tryInteract, updateNearest, handleAction, update, render,
    bTerrainId, PAL, buildWaterGrid, drawWorld, Weather, Camera, hpBarLayout, textWidth,
    teleport(x, y) {
      Player.x = x; Player.y = y;
      Camera.snap();
    },
    step(dt, n) { for (let i = 0; i < (n || 1); i++) { update(dt); } render(Game.time); },
    act(a) { handleAction(a); },
    key(code, down) {
      const dir = Input.map[code];
      if (dir) Input.keys[dir] = down;
      if (down) {
        const a = actionFromKey({ code });
        if (a) handleAction(a);
        else if (dir) handleAction(dir);
      }
    },
    loadArea(id, x, y, dir) { World.load(id, x, y, dir); Camera.snap(); buildWaterGrid(); Game.mode = 'play'; },
    errors: window.__errors
  };

  requestAnimationFrame(loop);
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}
