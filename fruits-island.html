<script>
/* ============================================================================
   js/world.js — areas, terrain, props, exits, encounter zones
   Two area types:
     'proc'  — pixel-procedural terrain (the Beach: shorelines via curves)
     'grid'  — tile-grid terrain (Trail / Village / Tavern: char maps +
               programmatic carving)
   Every area provides: terrainCanvas, collision grid (8px cells), props,
   npcs, exits, interactables, encounter config, ambience mix.
   Areas are built lazily once and cached; world state that can change
   (taken items, flags) lives in Game.flags, never in the area build.
   ========================================================================== */
'use strict';

/* --------------------------------------------------------- tile painting */
const SOLID_TILES = { P: 1, T: 1, W: 1, x: 1, X: 1 };

function paintTile(x, ch, tx, ty) {
  const X = tx * TILE, Y = ty * TILE;
  const n = (a) => hash2(tx * 31 + a, ty * 57 + a * 7);
  switch (ch) {
    case 'P': { // jungle wall — dense dark canopy
      const base = n(1) > 0.5 ? '#1c3a29' : '#193425';
      x.fillStyle = base; x.fillRect(X, Y, TILE, TILE);
      for (let i = 0; i < 7; i++) {
        const lx = X + Math.floor(n(i + 2) * 15), ly = Y + Math.floor(n(i + 9) * 15);
        x.fillStyle = n(i + 20) > 0.5 ? '#255033' : '#142b1e';
        x.fillRect(lx, ly, 2 + Math.floor(n(i + 30) * 2), 1);
      }
      if (n(40) > 0.82) { x.fillStyle = '#0e2016'; x.fillRect(X + 4, Y + 6, 3, 9); x.fillStyle = '#173321'; x.fillRect(X + 5, Y + 6, 1, 9); }
      if (n(50) > 0.9) { x.fillStyle = '#488f56'; x.fillRect(X + Math.floor(n(60) * 13), Y + Math.floor(n(61) * 13), 1, 1); }
      break;
    }
    case 'T': { // big tree wall
      x.fillStyle = '#173321'; x.fillRect(X, Y, TILE, TILE);
      fillCircle(x, X + 8, Y + 6, 7.4, '#1e402c');
      fillCircle(x, X + 6, Y + 4, 5, '#27503a');
      fillCircle(x, X + 5, Y + 3, 2.6, '#33684a');
      x.fillStyle = '#0e2016'; x.fillRect(X + 7, Y + 12, 2, 4);
      break;
    }
    case 'W': { // water
      const b = n(1) > 0.5;
      x.fillStyle = b ? '#1e4a5e' : '#1c4458'; x.fillRect(X, Y, TILE, TILE);
      if (n(2) > 0.6) { x.fillStyle = 'rgba(126,206,204,0.25)'; x.fillRect(X + Math.floor(n(3) * 10), Y + Math.floor(n(4) * 12), 4, 1); }
      if (n(5) > 0.85) { x.fillStyle = 'rgba(190,240,232,0.2)'; x.fillRect(X + Math.floor(n(6) * 12), Y + Math.floor(n(7) * 12), 2, 1); }
      break;
    }
    case 'x': case 'X': { // generic wall (tavern)
      x.fillStyle = '#2c2013'; x.fillRect(X, Y, TILE, TILE);
      x.fillStyle = '#4d3722'; x.fillRect(X + 1, Y + 1, TILE - 2, TILE - 2);
      x.fillStyle = '#3d2d1c';
      x.fillRect(X + 1, Y + 7, TILE - 2, 1); x.fillRect(X + 7, Y + 1, 1, 6); x.fillRect(X + 3, Y + 9, 1, 6);
      if (n(8) > 0.75) { x.fillStyle = '#5d452e'; x.fillRect(X + 2, Y + 2, 3, 1); }
      break;
    }
    case 'F': { // plank floor
      x.fillStyle = n(1) > 0.5 ? '#6b4f34' : '#75573b'; x.fillRect(X, Y, TILE, TILE);
      x.fillStyle = '#54371f';
      x.fillRect(X, Y + 7, TILE, 1);
      if ((tx + ty * 3) % 4 === 0) x.fillRect(X + 11, Y, 1, 7);
      if (n(2) > 0.75) { x.fillStyle = '#8a6a48'; x.fillRect(X + Math.floor(n(3) * 12), Y + Math.floor(n(4) * 6), 2, 1); }
      if (n(5) > 0.92) { x.fillStyle = '#4a3320'; x.fillRect(X + Math.floor(n(6) * 12), Y + 8 + Math.floor(n(7) * 6), 2, 1); }
      break;
    }
    case 'p': { // dirt path
      x.fillStyle = n(1) > 0.5 ? '#a08256' : '#987a4f'; x.fillRect(X, Y, TILE, TILE);
      if (n(2) > 0.72) { x.fillStyle = '#8a6f47'; x.fillRect(X + Math.floor(n(3) * 12), Y + Math.floor(n(4) * 12), 2, 1); }
      if (n(5) > 0.9) { x.fillStyle = '#b39468'; x.fillRect(X + Math.floor(n(6) * 13), Y + Math.floor(n(7) * 13), 1, 1); }
      if (n(8) > 0.94) { x.fillStyle = '#7d9a52'; x.fillRect(X + Math.floor(n(9) * 13), Y + Math.floor(n(10) * 13), 1, 2); }
      break;
    }
    case 'S': { // shrine stone
      x.fillStyle = n(1) > 0.5 ? '#4e5a64' : '#4a555f'; x.fillRect(X, Y, TILE, TILE);
      x.fillStyle = '#57626c';
      x.fillRect(X, Y, TILE, 1); x.fillRect(X, Y, 1, TILE);
      x.fillStyle = '#3f4a54';
      x.fillRect(X, Y + TILE - 1, TILE, 1); x.fillRect(X + TILE - 1, Y, 1, TILE);
      if (n(2) > 0.7) { x.fillStyle = '#3c5c46'; x.fillRect(X + Math.floor(n(3) * 12), Y + Math.floor(n(4) * 12), 2, 1); }
      break;
    }
    case ',': { // jungle floor (dark grass)
      x.fillStyle = n(1) > 0.5 ? '#2f5a3d' : '#2b543a'; x.fillRect(X, Y, TILE, TILE);
      if (n(2) > 0.62) { x.fillStyle = '#35654a'; x.fillRect(X + Math.floor(n(3) * 14), Y + Math.floor(n(4) * 14), 1, 2); }
      if (n(5) > 0.86) { x.fillStyle = '#25503a'; x.fillRect(X + Math.floor(n(6) * 13), Y + Math.floor(n(7) * 13), 2, 1); }
      break;
    }
    default: { // '.' village grass
      x.fillStyle = n(1) > 0.5 ? '#4a7a4e' : '#457349'; x.fillRect(X, Y, TILE, TILE);
      if (n(2) > 0.6) { x.fillStyle = '#54875a'; x.fillRect(X + Math.floor(n(3) * 14), Y + Math.floor(n(4) * 14), 1, 2); }
      if (n(5) > 0.85) { x.fillStyle = '#3c6843'; x.fillRect(X + Math.floor(n(6) * 13), Y + Math.floor(n(7) * 13), 2, 1); }
      if (n(8) > 0.965) { x.fillStyle = '#e8c45a'; x.fillRect(X + Math.floor(n(9) * 14), Y + Math.floor(n(10) * 14), 1, 1); }
      break;
    }
  }
}

function buildGridArea(area, grid) {
  const tw = grid[0].length, th = grid.length;
  area.w = tw * TILE; area.h = th * TILE;
  const mk = makeCanvas(area.w, area.h);
  for (let ty = 0; ty < th; ty++) {
    for (let tx = 0; tx < tw; tx++) {
      paintTile(mk.x, grid[ty][tx], tx, ty);
    }
  }
  area.chars = grid;   // kept for surface lookups (footsteps etc.)
  area.terrainCanvas = mk.c;
  // collision grid at 8px
  const cell = 8;
  const gw = Math.ceil(area.w / cell), gh = Math.ceil(area.h / cell);
  const data = new Uint8Array(gw * gh);
  for (let cy = 0; cy < gh; cy++) {
    for (let cx = 0; cx < gw; cx++) {
      const px0 = cx * cell + 4, py0 = cy * cell + 4;
      const ch = grid[Math.floor(py0 / TILE)] && grid[Math.floor(py0 / TILE)][Math.floor(px0 / TILE)];
      data[cy * gw + cx] = SOLID_TILES[ch] ? 1 : 0;
    }
  }
  area.grid = { cell, w: gw, h: gh, data };
}

/* ============================================================ THE BEACH === */
const BEACH = { w: 704, h: 544 };
// canonical beach spawn: on dry sand ABOVE the waterline (bShoreY(240) ~ 384)
const BEACH_SPAWN = { x: 240, y: 356, dir: 'down' };
function bShoreY(x) { return 392 + 18 * Math.sin(x * 0.013) + 8 * Math.sin(x * 0.037 + 2.0); }
function bGrassY(x) { return bShoreY(x) - 70 + 14 * Math.sin(x * 0.021 + 1.1) + 7 * Math.sin(x * 0.063); }
function bForestY(x) { return 150 + 10 * Math.sin(x * 0.021) + 5 * Math.sin(x * 0.07 + 1.0); }

const B_PATH_MAIN = [[238, 420], [252, 396], [268, 366], [290, 340], [316, 322], [352, 312], [392, 306], [430, 306], [470, 306], [510, 312], [552, 318], [600, 322], [650, 326], [700, 330]];
const B_PATH_VAX = [[352, 312], [330, 306], [304, 298], [280, 294]];
const B_PATHS = [B_PATH_MAIN, B_PATH_VAX];

function bTerrainId(x, y) {
  const sh = bShoreY(x);
  if (y > sh + 26) return 0;
  if (y > sh) return 1;
  if (y > sh - 6) return 2;
  if (y > bGrassY(x)) {
    for (const p of B_PATHS) if (distToPath(x, y, p) < 11) return 5;
    return 3;
  }
  if (y > bForestY(x)) {
    for (const p of B_PATHS) if (distToPath(x, y, p) < 10) return 5;
    return 4;
  }
  return 6;
}
const B_SOLID = { 0: 1, 1: 1, 6: 1 };
const B_COLORS = {
  0: [24, 56, 84], 1: [40, 98, 122], 2: [208, 188, 148],
  3: [224, 202, 158], 4: [80, 126, 86], 5: [188, 164, 124], 6: [36, 40, 48]
};

function buildBeachTerrain(area) {
  const mk = makeCanvas(area.w, area.h);
  const img = mk.x.createImageData(area.w, area.h);
  const d = img.data;
  for (let y = 0; y < area.h; y++) {
    for (let xx = 0; xx < area.w; xx++) {
      const id = bTerrainId(xx, y);
      let col = B_COLORS[id];
      const n = hash2(xx, y), n2 = hash2(xx >> 2, y >> 2);
      const amp = (id === 0 || id === 1) ? 10 : 14;
      let r = col[0] + (n - 0.5) * amp + (n2 - 0.5) * 10;
      let g = col[1] + (n - 0.5) * amp + (n2 - 0.5) * 10;
      let b = col[2] + (n - 0.5) * amp + (n2 - 0.5) * 10;
      if (id === 4 || id === 6) { g += 6; b -= 4; }
      if (id === 2) { r += 6; g += 2; }
      const i = (y * area.w + xx) * 4;
      d[i] = clamp(r, 0, 255); d[i + 1] = clamp(g, 0, 255); d[i + 2] = clamp(b, 0, 255); d[i + 3] = 255;
    }
  }
  mk.x.putImageData(img, 0, 0);
  // texture details
  for (let y = 0; y < area.h; y++) {
    for (let xx = 0; xx < area.w; xx++) {
      const id = bTerrainId(xx, y);
      const h = hash2(xx * 7 + 3, y * 13 + 5);
      if (id === 3 || id === 2) {
        if (h > 0.965) { mk.x.fillStyle = h > 0.99 ? '#c2ab80' : '#efdab4'; mk.x.fillRect(xx, y, 1, 1); }
      } else if (id === 4) {
        if (h > 0.95) { mk.x.fillStyle = h > 0.985 ? '#49855a' : '#93b478'; mk.x.fillRect(xx, y, 1, 2); }
      } else if (id === 5) {
        if (h > 0.955) { mk.x.fillStyle = '#a89066'; mk.x.fillRect(xx, y, 1, 1); }
      } else if (id === 1) {
        if (h > 0.985) { mk.x.fillStyle = '#7fd0c4'; mk.x.fillRect(xx, y, 2, 1); }
      } else if (id === 6) {
        if (h > 0.955) { mk.x.fillStyle = '#303742'; mk.x.fillRect(xx, y, 2, 1); }
      }
    }
  }
  // shoreline foam
  for (let xx = 0; xx < area.w; xx++) {
    const sh = Math.round(bShoreY(xx));
    const wob = Math.sin(xx * 0.09) * 1.5;
    for (let k = 0; k < 4; k++) {
      const yy = Math.round(sh - 2 + wob + k);
      mk.x.fillStyle = `rgba(233,249,240,${(0.3 * (1 - k * 0.22)).toFixed(2)})`;
      mk.x.fillRect(xx, yy, 1, 1);
    }
  }
  area.terrainCanvas = mk.c;
  // collision grid
  const cell = 8;
  const gw = Math.ceil(area.w / cell), gh = Math.ceil(area.h / cell);
  const data = new Uint8Array(gw * gh);
  for (let cy = 0; cy < gh; cy++) {
    for (let cx = 0; cx < gw; cx++) {
      let solid = 0;
      for (let sy = 0; sy < 2 && !solid; sy++) {
        for (let sx = 0; sx < 2 && !solid; sx++) {
          const px0 = cx * cell + sx * 4 + 2, py0 = cy * cell + sy * 4 + 2;
          if (px0 < 10 || px0 > area.w - 10) { solid = 1; break; }
          if (B_SOLID[bTerrainId(px0, py0)]) solid = 1;
        }
      }
      data[cy * gw + cx] = solid;
    }
  }
  area.grid = { cell, w: gw, h: gh, data };
}

function beachPropsDewater(props) {
  for (const p of props) {
    if (p.flat && !p.interact) continue;        // decoration may sit anywhere
    let guard = 0;
    while (guard++ < 90) {
      const id = bTerrainId(p.x, p.y + 3);
      if (id !== 0 && id !== 1) break;          // 0 deep water / 1 shallow
      p.y -= 2;
    }
  }
}

/* ====================================================== THE JUNGLE TRAIL == */
function buildTrailGrid() {
  // 30 x 34 tiles. A winding safe-ish corridor south -> north.
  const tw = 30, th = 34;
  const g = [];
  for (let y = 0; y < th; y++) g.push(new Array(tw).fill('P'));
  // corridor centerline (in tiles)
  const line = [[15, 33], [14, 30], [12, 27], [12, 24], [14, 21], [16, 18], [16, 15], [14, 12], [12, 9], [13, 6], [15, 3], [15, 0]];
  const carve = (cx, cy, r) => {
    for (let y = cy - r; y <= cy + r; y++) {
      for (let x = cx - r - 1; x <= cx + r + 1; x++) {
        if (y < 0 || y >= th || x < 1 || x >= tw - 1) continue;
        const d = Math.hypot((x - cx) * 1.15, y - cy);
        if (d <= r + 0.9) g[y][x] = ',';
      }
    }
  };
  for (let i = 0; i < line.length - 1; i++) {
    const [x0, y0] = line[i], [x1, y1] = line[i + 1];
    const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2;
    for (let s = 0; s <= steps; s++) {
      const cx = Math.round(lerp(x0, x1, s / steps));
      const cy = Math.round(lerp(y0, y1, s / steps));
      carve(cx, cy, 2);
    }
  }
  // dirt path along the centerline
  for (let i = 0; i < line.length - 1; i++) {
    const [x0, y0] = line[i], [x1, y1] = line[i + 1];
    const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 3;
    for (let s = 0; s <= steps; s++) {
      const cx = Math.round(lerp(x0, x1, s / steps));
      const cy = Math.round(lerp(y0, y1, s / steps));
      if (g[cy] && g[cy][cx] === ',') {
        g[cy][cx] = 'p';
        if (g[cy][cx + 1] === ',') g[cy][cx + 1] = 'p';
      }
    }
  }
  // a small clearing mid-trail (the scripted first encounter spot)
  carve(16, 17, 3);
  return g.map(r => r.join(''));
}

/* ======================================================= BOUGA BOUGA ===== */
function buildVillageGrid() {
  const tw = 44, th = 34;
  const g = [];
  for (let y = 0; y < th; y++) { g.push(new Array(tw).fill('.')); }
  // jungle ring (3 tiles), openings at south + north gates (center x=22)
  for (let y = 0; y < th; y++) {
    for (let x = 0; x < tw; x++) {
      const edge = Math.min(x, y, tw - 1 - x, th - 1 - y);
      if (edge < 3) g[y][x] = (edge < 2 || hash2(x, y) > 0.35) ? 'P' : ',';
    }
  }
  // gate corridors
  for (let y = th - 4; y < th; y++) { g[y][21] = 'p'; g[y][22] = 'p'; }
  for (let y = 0; y < 5; y++) { g[y][21] = 'p'; g[y][22] = 'p'; }
  // paths: south gate -> plaza -> north gate; plaza -> tavern; plaza -> shrine
  const vline = (x0, y0, x1, y1, w) => {
    const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2;
    for (let s = 0; s <= steps; s++) {
      const cx = Math.round(lerp(x0, x1, s / steps));
      const cy = Math.round(lerp(y0, y1, s / steps));
      for (let dy = -w; dy <= w; dy++) {
        for (let dx = -w; dx <= w + 1; dx++) {
          const xx = cx + dx, yy = cy + dy;
          if (xx > 2 && xx < tw - 3 && yy > 2 && yy < th - 3 && g[yy][xx] !== 'P') g[yy][xx] = 'p';
        }
      }
    }
  };
  vline(22, 30, 22, 21, 1);          // south to plaza
  vline(22, 14, 22, 4, 1);           // plaza to north gate
  vline(20, 21, 8, 21, 1);           // plaza to tavern door
  vline(24, 21, 32, 21, 1);          // plaza toward shrine
  vline(32, 20, 34, 14, 1);          // up to the shrine
  vline(22, 24, 30, 29, 1);          // toward the pond jetty
  // plaza: packed dirt circle at tile (22,21)
  for (let y = 17; y <= 25; y++) {
    for (let x = 17; x <= 27; x++) {
      if (Math.hypot((x - 22) * 1.0, (y - 21) * 1.25) < 5.2 && g[y][x] !== 'P') g[y][x] = 'p';
    }
  }
  // pond (SE)
  for (let y = 24; y < 32; y++) {
    for (let x = 28; x < 40; x++) {
      const d = Math.hypot((x - 34) * 0.85, (y - 28) * 1.35);
      if (d < 4.6) g[y][x] = 'W';
      else if (d < 5.4 && g[y][x] !== 'W') g[y][x] = ',';
    }
  }
  // shrine stone platform (NE)
  for (let y = 7; y <= 13; y++) {
    for (let x = 30; x <= 39; x++) g[y][x] = 'S';
  }
  // walkable dock under the jetty planks
  g[28][29] = 'p'; g[28][30] = 'p'; g[28][31] = 'p'; g[29][30] = 'p';
  return g.map(r => r.join(''));
}

    build(area) { buildBeachTerrain(area); area.props = []; const add = (p) => { area.props.push(p); return p; }; beachProps(add); beachPropsDewater(area.props); area.npcs = [NpcDefs.vax()]; },
    exits: [
      { x: 686, y: 300, w: 18, h: 76, to: 'trail', tx: 244, ty: 520, dir: 'up' }
    ],
    onEnterFirst() { Game.showToast('The gulls have gone quiet.'); }
  },
  trail: {
    id: 'trail', type: 'grid', grid: TRAIL_GRID,
    name: 'The Jungle Trail',
    music: null,
    ambience: { ocean: 0.06, wind: 0.02, rain: 0.05, hum: 0.05, hearth: 0 },
    encounters: { rects: null, rate: 6.5, chance: 0.1, pool: ['crabApple', 'bramblett', 'crabApple', 'gullgazer'] },
    rain: true,
    build(area) { buildGridArea(area, TRAIL_GRID); area.props = []; const add = (p) => { area.props.push(p); return p; }; trailProps(add); area.npcs = []; },
    exits: [
      { x: 216, y: 524, w: 48, h: 20, to: 'beach', tx: 672, ty: 332, dir: 'left' },
      { x: 216, y: 0, w: 48, h: 14, to: 'village', tx: 352, ty: 508, dir: 'up' }
    ],
    onEnterFirst() { Game.showToast('The birds stop singing here.'); AudioSys.moan(); }
  },
  village: {
    id: 'village', type: 'grid', grid: VILLAGE_GRID,
    name: 'Bouga Bouga Village',
    music: 'village',
    ambience: { ocean: 0.03, wind: 0.008, rain: 0, hum: 0.025, hearth: 0 },
    encounters: null,
    build(area) { buildGridArea(area, VILLAGE_GRID); area.props = []; const add = (p) => { area.props.push(p); return p; }; villageProps(add); area.npcs = [NpcDefs.majhool(), NpcDefs.levi(), NpcDefs.nadia()]; },
    exits: [
      { x: 328, y: 530, w: 48, h: 14, to: 'trail', tx: 240, ty: 20, dir: 'down' },
      { x: 132, y: 341, w: 36, h: 12, to: 'tavern', tx: 192, ty: 200, dir: 'up' }
    ],
    onEnterFirst() { Game.showToast('Bouga Bouga Village. It smells of bread and rain.'); }
  },
  tavern: {
    id: 'tavern', type: 'grid', grid: TAVERN_GRID,

    ambience: { ocean: 0, wind: 0, rain: 0, hum: 0.012, hearth: 0.05 },
    encounters: null,
    indoor: true,
    build(area) { buildGridArea(area, TAVERN_GRID); area.props = []; const add = (p) => { area.props.push(p); return p; }; tavernProps(add); area.npcs = [NpcDefs.ali(), NpcDefs.ruta()]; },
    exits: [
      { x: 168, y: 210, w: 48, h: 12, to: 'village', tx: 150, ty: 357, dir: 'down' }
    ]
  }
};

/* ------------------------------------------------------------- the World */
const World = {
  areaId: null,
  area: null,
  props: [],
  npcs: [],
  exits: [],
  solidRects: [],
  terrainCanvas: null,
  grid: null,
  built: {},
  visited: {},

  load(id, px, py, dir) {
    const def = Areas[id];
    if (!def) return false;
    if (!this.built[id]) {
      const area = { id, type: def.type, w: def.w, h: def.h };
      def.build(area);
      this.built[id] = area;
    }
    const area = this.built[id];
    this.areaId = id;
    this.area = area;
    this.terrainCanvas = area.terrainCanvas;
    this.grid = area.grid;
    this.props = area.props;
    this.npcs = area.npcs.map(n => n); // npc objects are shared per build
    this.interactables = collectInteractables();
    this.exits = def.exits;
    this.rebuildCollision();
    Player.x = px; Player.y = py; Player.dir = dir || 'down';
    Player.moving = false;
    // never let a load leave the player inside a solid (bad spawn, old save,
    // future area bug): walk them up/out until they stand on clear ground
    for (let i = 0; i < 90 && blockedAt(Player.x, Player.y); i++) {
      Player.y -= 2;
      if (i % 6 === 5) Player.x += (Math.floor(i / 6) % 2 === 0) ? 3 : -3;
    }
    // ambience + music + first-visit hooks
    AudioSys.setMix(def.ambience, 0.5);
    if (def.music) AudioSys.playSong(def.music); else AudioSys.stopSong();
    if (!this.visited[id]) {
      this.visited[id] = true;
      if (def.onEnterFirst) def.onEnterFirst();
    }
    if (def.rain) Weather.setIntensity(0.5); else Weather.setIntensity(1);
    return true;
  },

  rebuildCollision() {
    const rects = [];
    for (const p of this.props) {
      if (p.col) rects.push({ x: p.x + p.col.dx, y: p.y + p.col.dy, w: p.col.w, h: p.col.h });
    }
    for (const n of this.npcs) {
      if (n.solid) rects.push({ x: n.x - 6, y: n.y - 5, w: 12, h: 5 });
    }
    this.solidRects = rects;
  },

  tileSolidAt(px, py) {
    const g = this.grid;
    if (!g) return true;
    if (px < 0 || py < 0 || px >= this.area.w || py >= this.area.h) return true;
    const cx = Math.floor(px / g.cell), cy = Math.floor(py / g.cell);
    if (cx < 0 || cy < 0 || cx >= g.w || cy >= g.h) return true;
    return g.data[cy * g.w + cx] === 1;
  },

  encounterAt(px, py) {
    const def = Areas[this.areaId];
    if (!def || !def.encounters) return null;
    const enc = def.encounters;
    if (enc.rects) {
      let inside = false;
      for (const r of enc.rects) {
        if (px > r.x && px < r.x + r.w && py > r.y && py < r.y + r.h) { inside = true; break; }
      }
      if (!inside) return null;
    }
    return enc;
  }
};

// collision check used by the player: terrain grid + prop rects
function blockedAt(px, py) {
  const b = { x: px - 5, y: py - 6, w: 10, h: 6 };
  const pts = [
    [b.x, py], [b.x + b.w - 1, py], [b.x + b.w / 2, py],
    [b.x, b.y], [b.x + b.w - 1, b.y], [px, py - 3]
  ];
  for (const pt of pts) if (World.tileSolidAt(pt[0], pt[1])) return true;
  for (const r of World.solidRects) {
    if (rectsOverlap(b, r)) return true;
  }
  return false;
}

/* ----------------------------------------------- interaction collection */
function collectInteractables() {
  const list = [];
  for (const p of World.props) {
    const isMemLantern = p.lantern === 'beach' || p.lantern === 'village';
    if (!p.interact && !isMemLantern) continue;
    const spr = SPR[p.spr];
    const hw = p.col ? p.col.w / 2 + 3 : 7;
    list.push({
      kind: isMemLantern ? 'lantern' : 'obj',
      ref: p,
      x: p.x + (p.col ? p.col.dx + p.col.w / 2 : 0), y: p.y - 2, hw, hh: 6,
      top: p.y - (spr ? spr.height : 8)
    });
  }
  for (const n of World.npcs) {
    list.push({ kind: 'npc', ref: n, x: n.x, y: n.y - 3, hw: 10, hh: 8, top: n.y - 26 });
  }
  return list;
}

</script>
<script>
/* ============================================================================
   js/combat.js — battle system (original, Undertale-inspired in structure)
   Flow:  intro -> menu -> [fight timing | act list | item list | mercy]
          -> resolve -> enemy flavor+intent -> DODGE (bullet box) -> menu ...
   End states: win (hp<=0), spared, flee, lose. All exits call Battle.finish
   exactly once; Game.exitBattle() restores the overworld (inventory state is
   shared by reference so items used in battle persist after).
   ========================================================================== */
'use strict';

const ENEMY_DEFS = {
  crabApple: {
    id: 'crabApple', name: 'Crab Apple', spr: 'crabApple',
    hp: 20, atk: 3, def: 1,
    flavor: [
      'The Crab Apple skitters sideways, shell glinting.',
      'It polishes its shell with one pincer. Vain.',
      'Sand falls out of its joints. It pretends not to notice.',
      'The Crab Apple clicks a rhythm. It is not a friendly rhythm.'
    ],
    intents: {
      sweep: 'The Crab Apple winds up for a sideways rush.',
      pinch: 'Both pincers open wide. That is a lot of pincer.'
    },
    check: 'CRAB APPLE \u2014 ATK 3 DEF 1. Proud of its shell. Mortified about the sea lice.',
    acts: [
      { id: 'compliment', text: 'Compliment', apply(e) { e.spareable = true; return 'You compliment the shell. The Crab Apple freezes mid-skitter, then pirouettes to show its other side. It is too flustered to fight well.'; } },
      { id: 'boil', text: 'Boiling Joke', apply(e) { e.atk = Math.max(2, e.atk - 1); return 'You mention how good steamed shellfish smells. The Crab Apple clicks its pincers furiously. It is laughing. Probably.'; } }
    ],
    patterns: ['sweep', 'pinch'],
    drops: [['fruit', 0.4], ['bandage', 0.2]]
  },
  bramblett: {
    id: 'bramblett', name: 'Bramblett', spr: 'bramblett',
    hp: 26, atk: 4, def: 0,
    flavor: [
      'Bramblett rustles nervously. Its berries glow like little lanterns.',
      'Bramblett checks the ground for rakes.',
      'A single berry drops off, rolls, and hides behind a root.',
      'Bramblett braces itself. It has been braced its whole life.'
    ],
    intents: {
      thorns: 'Thorns shake loose above the box.',
      berries: 'Berries aim your way, quietly apologizing.'
    },
    check: 'BRAMBLETT \u2014 ATK 4 DEF 0. A bramble that learned to walk. Terrified of being pruned.',
    acts: [
      { id: 'untangle', text: 'Untangle', apply(e) { e.spareable = true; return 'You gently untangle a snagged vine. Bramblett stops shaking from root to crown.'; } },
      { id: 'whistle', text: 'Whistle', apply(e) { e.slow = true; return 'You whistle an old sea tune. The berries sway along in time.'; } }
    ],
    patterns: ['thorns', 'berries'],
    drops: [['fruit', 0.5], ['jerky', 0.25]]
  },
  gullgazer: {
    id: 'gullgazer', name: 'Gullgazer', spr: 'gullgazer',
    hp: 14, atk: 5, def: 0,
    flavor: [
      'The Gullgazer stares. It has been staring for some time.',
      'It tilts its head 90 degrees. So do you, involuntarily.',
      'Somewhere behind its eye, a memory of being fed plays on loop.',
      'The Gullgazer does not blink. The eye is patient.'
    ],
    intents: {
      darts: 'Wings tuck. A dive is coming.',
      feathers: 'It prepares to shed feathers \u2014 sharp ones.'
    },
    check: 'GULLGAZER \u2014 ATK 5 DEF 0. It remembers being fed. It does not remember by whom.',
    acts: [
      { id: 'stare', text: 'Stare Back', apply(e) { e.spareable = true; return 'You stare back, flat and unblinking. The Gullgazer blinks first. It looks deeply unsettled by losing.'; } },
      { id: 'avert', text: 'Avert Eyes', apply(e) { e.atk = Math.max(3, e.atk - 1); return 'You avert your eyes politely. The Gullgazer relaxes. So, unexpectedly, do you.'; } }
    ],
    patterns: ['darts', 'feathers'],
    drops: [['bandage', 0.4]]
  }
};

/* ------------------------------------------------------------- the battle */
const BOX = { x: 92, y: 104, w: 200, h: 64 };
const MENU_BTN = [
  { id: 'fight', label: 'FIGHT' },
  { id: 'act',   label: 'ACT' },
  { id: 'item',  label: 'ITEM' },
  { id: 'mercy', label: 'MERCY' }
];

const Battle = {
  active: false,
  state: 'intro',        // intro|menu|target|act|item|mercy|resolve|enemyline|dodge|win|spared|flee|lose
  enemy: null,
  t: 0,
  menuIndex: 0,
  subIndex: 0,
  boxMsg: '',
  flavorIdx: 0,
  // fight timing bar
  cursorX: 0, cursorDir: 1, hitAccuracy: 0,
  // dodge phase
  pattern: null, patT: 0, patDur: 3.4, spawnT: 0,
  soul: { x: 0, y: 0 },
  invuln: 0,
  projectiles: [],
  dmgPops: [],           // floating damage numbers {x,y,txt,t,col}
  shake: 0,
  flash: 0,
  finished: false,
  result: null,
  dropItem: null,
  playerHurtFlash: 0,

  start(enemyId, opts) {
    opts = opts || {};
    const def = ENEMY_DEFS[enemyId];
    if (!def) return false;
    this.active = true;
    this.finished = false;
    this.result = null;
    this.dropItem = null;
    this.enemy = {
      def, id: def.id, name: def.name, spr: def.spr,
      hp: def.hp, maxhp: def.hp, atk: def.atk, defv: def.def,
      spareable: false, slow: false, patternIdx: opts.firstPattern || 0,
      hurtT: 0, swayT: Math.random() * 6
    };
    this.t = 0;
    this.state = 'intro';
    this.menuIndex = 0;
    this.subIndex = 0;
    this.flavorIdx = 0;
    this.boxMsg = def.flavor[0];
    this.projectiles = [];
    this.dmgPops = [];
    this.invuln = 0;
    this.shake = 0;
    this.flash = 0;
    this.soul.x = BOX.x + BOX.w / 2;
    this.soul.y = BOX.y + BOX.h / 2;
    AudioSys.playSong('battle');
    AudioSys.battleStart();
    return true;
  },

  finish(result) {
    if (this.finished) return;
    this.finished = true;
    this.result = result;
    this.state = result;
    this.t = 0;
    if (result === 'win') { AudioSys.victory(); Game.flags.hurt = (Game.flags.hurt || 0) + 1; }
    else if (result === 'spared') { AudioSys.spare(); Game.flags.spared = (Game.flags.spared || 0) + 1; }
    else if (result === 'flee') AudioSys.flee();
    else if (result === 'lose') AudioSys.defeat();
    // roll a drop for wins/spares
    if (result === 'win' || result === 'spared') {
      for (const [id, chance] of this.enemy.def.drops) {
        if (Math.random() < chance) { this.dropItem = id; break; }
      }
    }
  },

  /* ------------------------------------------------------------- actions */
  playerAtk() { return Game.atk(); },
  playerDef() { return Game.def(); },

  doFightHit() {
    // called when the player confirms on the timing bar
    const e = this.enemy;
    const center = BOX.x + BOX.w / 2;
    const acc = clamp(1 - Math.abs(this.cursorX - center) / (BOX.w / 2), 0, 1);
    this.hitAccuracy = acc;
    let dmg = Math.max(1, Math.round((this.playerAtk() + 1 + Math.random() * 2 - e.defv) * (0.55 + acc)));
    e.hp -= dmg;
    e.hurtT = 0.5;
    this.dmgPops.push({ x: 192 + (Math.random() * 14 - 7), y: 52, txt: String(dmg), t: 0, col: acc > 0.9 ? '#ffe9a8' : '#f4efe4' });
    AudioSys.hit();
    this.shake = 0.25;
    this.state = 'resolve';
    this.boxMsg = acc > 0.9 ? 'Dead center! The ' + e.name + ' reels!' : 'You swing your lantern-hard fist.';
    if (e.hp <= 0) {
      setTimeout(() => {}, 0);
    }
  },

  applyAct(act) {
    const e = this.enemy;
    let msg;
    try { msg = act.apply(e); } catch (err) { msg = 'Nothing happens.'; }
    this.state = 'resolve';
    this.boxMsg = msg;
    AudioSys.examine();
  },

  useItemBattle(id) {
    const d = ITEMS[id];
    if (!d || d.cat !== 'consumable') return;
    const res = Inventory.use(id, Game.hp, Game.maxhp);
    if (res) {
      Game.hp = res.hpAfter;
      this.dmgPops.push({ x: 192, y: 150, txt: '+' + res.healed, t: 0, col: '#9fd8a8' });
      AudioSys.heal();
    }
    this.state = 'resolve';
    this.boxMsg = 'You use the ' + d.name + '.' + (res && res.healed === 0 ? ' You are already whole.' : '');
  },

  trySpare() {
    const e = this.enemy;
    if (e.spareable || e.hp <= e.maxhp * 0.18) {
      this.finish('spared');
      this.boxMsg = 'The ' + e.name + ' settles back into the island, grateful.';
    } else {
      this.state = 'resolve';
      this.boxMsg = 'You offer peace. The ' + e.name + ' is not ready to settle down yet.';
    }
  },

  tryFlee() {
    if (Math.random() < 0.75) {
      this.finish('flee');
      this.boxMsg = 'You walk away with dignity. Mostly.';
    } else {
      this.state = 'resolve';
      this.boxMsg = 'You try to leave. The ' + this.enemy.name + ' sidesteps into your path!';
    }
  },

  /* --------------------------------------------------------- enemy phase */
  beginEnemyPhase() {
    const e = this.enemy;
    if (e.hp <= 0) { this.finish('win'); return; }
    const pid = e.def.patterns[e.patternIdx % e.def.patterns.length];
    e.patternIdx++;
    this.pattern = pid;
    this.patT = 0;
    this.spawnT = 0;
    this.projectiles = [];
    this.soul.x = BOX.x + BOX.w / 2;
    this.soul.y = BOX.y + BOX.h / 2;
    this.state = 'enemyline';
    this.boxMsg = (e.def.intents && e.def.intents[pid]) || e.def.flavor[0];
    AudioSys.talk();
  },

  spawnPattern(pid, dt) {
    const e = this.enemy;
    const spd = e.slow ? 0.65 : 1;
    const S = this;
    const addDot = (x, y, vx, vy, r, col) => S.projectiles.push({ x, y, vx: vx * spd, vy: vy * spd, r: r || 3, col: col || '#e23a2e', life: 6 });
    this.spawnT -= dt;
    const rate = e.slow ? 0.42 : 0.3;
    if (pid === 'sweep') {
      if (this.spawnT <= 0) {
        this.spawnT = rate + 0.1;
        const fromLeft = Math.floor(this.patT * 2.2) % 2 === 0;
        const y = BOX.y + 8 + Math.random() * (BOX.h - 16);
        addDot(fromLeft ? BOX.x - 6 : BOX.x + BOX.w + 6, y, (fromLeft ? 1 : -1) * (52 + Math.random() * 26), 0, 3);
      }
      if (Math.random() < dt * 1.4) {
        addDot(BOX.x + 6 + Math.random() * (BOX.w - 12), BOX.y - 6, 0, 34, 2, '#e08a4c');
      }
    } else if (pid === 'pinch') {
      if (this.spawnT <= 0) {
        this.spawnT = 0.55;
        // two horizontal pinch lines with a gap that shifts
        const gapY = BOX.y + 10 + Math.random() * (BOX.h - 24);
        for (let y = BOX.y + 4; y < BOX.y + BOX.h - 2; y += 5) {
          if (Math.abs(y - gapY) < 9) continue;
          addDot(BOX.x - 6, y, 44, 0, 2, '#e23a2e');
          addDot(BOX.x + BOX.w + 6, y, -44, 0, 2, '#e23a2e');
        }
      }
    } else if (pid === 'thorns') {
      if (this.spawnT <= 0) {
        this.spawnT = 0.34;
        const tx = BOX.x + 6 + Math.random() * (BOX.w - 12);
        this.projectiles.push({ x: tx, y: BOX.y - 8, vx: 0, vy: (46 + Math.random() * 20) * spd, r: 2, col: '#c9a6e0', life: 6, thorn: true });
      }
    } else if (pid === 'berries') {
      if (this.spawnT <= 0) {
        this.spawnT = 0.7;
        const dx = this.soul.x - (BOX.x - 8), dy = this.soul.y - (BOX.y - 8);
        const len = Math.hypot(dx, dy) || 1;
        for (let i = 0; i < 3; i++) {
          const sp = 58 + i * 16;
          addDot(BOX.x - 8, BOX.y - 8, dx / len * sp, dy / len * sp, 2.4, '#a81f2c');
        }
      }
    } else if (pid === 'darts') {
      if (this.spawnT <= 0) {
        this.spawnT = 0.42;
        const y = BOX.y + 6 + Math.random() * (BOX.h - 12);
        const dir = Math.random() < 0.5 ? 1 : -1;
        this.projectiles.push({ x: dir > 0 ? BOX.x - 8 : BOX.x + BOX.w + 8, y, vx: dir * 120 * spd, vy: 0, r: 2, col: '#e8ecef', dart: true, life: 6 });
      }
    } else if (pid === 'feathers') {
      if (this.spawnT <= 0) {
        this.spawnT = 0.16;
        const fx = BOX.x + 4 + Math.random() * (BOX.w - 8);
        this.projectiles.push({ x: fx, y: BOX.y - 6, vx: (Math.random() - 0.5) * 16, vy: (60 + Math.random() * 26) * spd, r: 1.8, col: '#c3ccd2', feather: true, life: 6 });
      }
    }
  },

  /* ------------------------------------------------------------- update */
  update(dt, input) {
    this.t += dt;
    if (this.shake > 0) this.shake -= dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.playerHurtFlash > 0) this.playerHurtFlash -= dt;
    for (const p of this.dmgPops) p.t += dt;
    this.dmgPops = this.dmgPops.filter(p => p.t < 1.1);
    if (this.enemy) {
      if (this.enemy.hurtT > 0) this.enemy.hurtT -= dt;
      this.enemy.swayT += dt;
    }

    switch (this.state) {
      case 'intro':
        if (this.t > 0.9) { this.state = 'menu'; this.t = 0; }
        break;
      case 'menu':
        break;
      case 'target': {
        this.cursorX += this.cursorDir * 235 * dt;
        if (this.cursorX > BOX.x + BOX.w - 6) { this.cursorX = BOX.x + BOX.w - 6; this.cursorDir = -1; }
        if (this.cursorX < BOX.x + 6) { this.cursorX = BOX.x + 6; this.cursorDir = 1; }
        break;
      }
      case 'resolve':
        if (this.t > 1.15) {
          this.t = 0;
          if (this.enemy.hp <= 0) this.finish('win');
          else this.beginEnemyPhase();
        }
        break;
      case 'enemyline':
        if (this.t > 1.25) { this.t = 0; this.state = 'dodge'; }
        break;
      case 'dodge': {
        this.patT += dt;
        // move the soul
        const spd = 92;
        if (input.left) this.soul.x -= spd * dt;
        if (input.right) this.soul.x += spd * dt;
        if (input.up) this.soul.y -= spd * dt;
        if (input.down) this.soul.y += spd * dt;
        this.soul.x = clamp(this.soul.x, BOX.x + 5, BOX.x + BOX.w - 5);
        this.soul.y = clamp(this.soul.y, BOX.y + 5, BOX.y + BOX.h - 5);
        this.spawnPattern(this.pattern, dt);
        if (this.invuln > 0) this.invuln -= dt;
        // projectile update + collision
        for (const p of this.projectiles) {
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.life -= dt;
          if (p.thorn) p.vx = Math.sin(p.y * 0.12) * 14;
          if (p.feather) p.vx += Math.sin(p.y * 0.2) * 8 * dt;
          if (this.invuln <= 0 && Math.hypot(p.x - this.soul.x, p.y - this.soul.y) < p.r + 3.2) {
            this.invuln = 0.9;
            const dmg = Math.max(1, this.enemy.atk + 2 - this.playerDef());
            Game.hp -= dmg;
            this.playerHurtFlash = 0.4;
            AudioSys.hurt();
            this.dmgPops.push({ x: this.soul.x, y: this.soul.y - 10, txt: '-' + dmg, t: 0, col: '#e23a2e' });
            if (Game.hp <= 0) {
              Game.hp = 0;
              this.finish('lose');
              return;
            }
          }
        }
        this.projectiles = this.projectiles.filter(p => p.life > 0 &&
          p.x > BOX.x - 20 && p.x < BOX.x + BOX.w + 20 &&
          p.y > BOX.y - 20 && p.y < BOX.y + BOX.h + 24);
        if (this.patT > this.patDur) {
          this.projectiles = [];
          this.state = 'menu';
          this.t = 0;
          this.flavorIdx = (this.flavorIdx + 1) % this.enemy.def.flavor.length;
          this.boxMsg = this.enemy.def.flavor[this.flavorIdx];
        }
        break;
      }
      case 'win': case 'spared': case 'flee':
        if (this.t > 1.6) Game.exitBattle(this.result, this.dropItem);
        break;
      case 'lose':
        if (this.t > 2.2) Game.exitBattle(this.result, null);
        break;
    }
  },

  /* -------------------------------------------------------------- input */
  onAction(action) {
    if (this.state === 'intro') return;
    if (action === 'mute') return; // handled globally
    const st = this.state;
    if (st === 'menu') {
      if (action === 'left') { this.menuIndex = (this.menuIndex + 3) % 4; AudioSys.select(); }
      else if (action === 'right') { this.menuIndex = (this.menuIndex + 1) % 4; AudioSys.select(); }
      else if (action === 'confirm') {
        AudioSys.select();
        const id = MENU_BTN[this.menuIndex].id;
        if (id === 'fight') {
          this.state = 'target';
          this.cursorX = BOX.x + 8; this.cursorDir = 1;
          this.t = 0;
        } else if (id === 'act') {
          this.state = 'act'; this.subIndex = 0;
        } else if (id === 'item') {
          if (Inventory.byCat('consumable').length === 0) { this.boxMsg = 'Your pockets hold nothing useful.'; return; }
          this.state = 'item'; this.subIndex = 0;
        } else if (id === 'mercy') {
          this.state = 'mercy'; this.subIndex = 0;
        }
      }
      return;
    }
    if (st === 'target') {
      if (action === 'confirm') { AudioSys.swing(); this.doFightHit(); }
      else if (action === 'pause') { this.state = 'menu'; AudioSys.back(); }
      return;
    }
    if (st === 'act') {
      const acts = [{ id: 'check', text: 'Check' }].concat(this.enemy.def.acts);
      if (action === 'up') { this.subIndex = (this.subIndex + acts.length - 1) % acts.length; AudioSys.select(); }
      else if (action === 'down') { this.subIndex = (this.subIndex + 1) % acts.length; AudioSys.select(); }
      else if (action === 'confirm') {
        const a = acts[this.subIndex];
        if (a.id === 'check') { this.state = 'resolve'; this.boxMsg = this.enemy.def.check; AudioSys.examine(); }
        else this.applyAct(a);
        this.t = 0;
      } else if (action === 'pause') { this.state = 'menu'; AudioSys.back(); }
      return;
    }
    if (st === 'item') {
      const list = Inventory.byCat('consumable');
      if (action === 'up') { this.subIndex = (this.subIndex + list.length - 1) % list.length; AudioSys.select(); }
      else if (action === 'down') { this.subIndex = (this.subIndex + 1) % list.length; AudioSys.select(); }
      else if (action === 'confirm') {
        const it = list[this.subIndex];
        if (it) this.useItemBattle(it.id);
        this.t = 0;
      } else if (action === 'pause') { this.state = 'menu'; AudioSys.back(); }
      return;
    }
    if (st === 'mercy') {
      const opts = ['Spare', 'Flee'];
      if (action === 'up') { this.subIndex = (this.subIndex + 1) % 2; AudioSys.select(); }
      else if (action === 'down') { this.subIndex = (this.subIndex + 1) % 2; AudioSys.select(); }
      else if (action === 'confirm') {
        if (this.subIndex === 0) this.trySpare();
        else this.tryFlee();
        this.t = 0;
      } else if (action === 'pause') { this.state = 'menu'; AudioSys.back(); }
      return;
    }
    if (st === 'enemyline' || st === 'resolve') {
      if (action === 'confirm') { /* let timing run so the intent is readable */ }
    }
  },

  /* --------------------------------------------------------------- draw */
  draw(ctx, gt) {
    const e = this.enemy;
    if (!e) return;
    // background: dark arena with silhouetted leaves
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, '#101722');
    g.addColorStop(0.7, '#0a0e16');
    g.addColorStop(1, '#070a10');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);
    // drifting dark leaves at the edges
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 10; i++) {
      const lx = i < 5 ? 4 + i * 9 : VW - 44 + (i - 5) * 9;
      const sway = Math.sin(gt * 0.8 + i * 1.7) * 3;
      ctx.fillStyle = '#16241c';
      ctx.beginPath();
      ctx.ellipse(lx + sway, 30 + (i % 5) * 34, 16, 7, (i % 2 ? 0.5 : -0.5), 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // vignette
    const vg = ctx.createRadialGradient(VW / 2, VH / 2, 60, VW / 2, VH / 2, 200);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, VW, VH);

    let ox = 0, oy = 0;
    if (this.shake > 0) { ox = Math.round(Math.sin(gt * 60) * 2 * this.shake); oy = Math.round(Math.cos(gt * 55) * 1.4 * this.shake); }

    // enemy sprite
    const spr = SPR[e.spr];
    if (spr) {
      const bob = Math.sin(gt * 2.1 + e.swayT) * 1.6;
      const ex = Math.round(VW / 2 - spr.width / 2 + ox);
      const ey = Math.round(58 - spr.height + bob + oy);
      // shadow
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(VW / 2 - 18, 62, 36, 3);
      if (e.hurtT > 0 && Math.floor(gt * 30) % 2 === 0) {
        ctx.globalAlpha = 0.35;   // hit flicker
        ctx.drawImage(spr, ex, ey);
        ctx.globalAlpha = 1;
      } else {
        ctx.drawImage(spr, ex, ey);
      }
    }
    // enemy hp bar (above box) + name; yellow when spareable
    const nx = Math.round(VW / 2 - 60);
    ctx.fillStyle = '#0b141c'; ctx.fillRect(nx - 2, 74, 124, 10);
    ctx.fillStyle = '#17252f'; ctx.fillRect(nx - 1, 75, 122, 8);
    const nameCol = e.spareable ? '#e8cf6a' : '#eae3d2';
    drawText(ctx, e.name, nx + 2, 77, nameCol);
    const hpw = 44;
    ctx.fillStyle = '#3a2226';
    ctx.fillRect(nx + 74, 78, hpw, 4);
    ctx.fillStyle = e.spareable ? '#e8cf6a' : '#c4543f';
    ctx.fillRect(nx + 74, 78, Math.max(0, Math.round(hpw * e.hp / e.maxhp)), 4);

    // battle box
    const bx = BOX.x + ox, by = BOX.y + oy;
    ctx.fillStyle = '#000';
    ctx.fillRect(bx - 2, by - 2, BOX.w + 4, BOX.h + 4);
    ctx.fillStyle = '#e8ecef';
    ctx.fillRect(bx - 2, by - 2, BOX.w + 4, 2);
    ctx.fillRect(bx - 2, by + BOX.h, BOX.w + 4, 2);
    ctx.fillRect(bx - 2, by, 2, BOX.h);
    ctx.fillRect(bx + BOX.w, by, 2, BOX.h);

    // box content by state
    if (this.state === 'menu' || this.state === 'resolve' || this.state === 'enemyline' || this.state === 'intro' ||
        this.state === 'win' || this.state === 'spared' || this.state === 'flee' || this.state === 'lose') {
      const lines = wrapText(this.boxMsg, 30);
      lines.forEach((l, i) => drawText(ctx, l, bx + 10, by + 10 + i * 11, '#e8ecef'));
      if (this.state === 'intro' && this.t < 0.9) {
        ctx.fillStyle = `rgba(255,255,255,${(0.9 - this.t).toFixed(2)})`;
        ctx.fillRect(0, 0, VW, VH);
      }
      if ((this.state === 'win' || this.state === 'spared' || this.state === 'flee' || this.state === 'lose') && Math.floor(gt * 2.5) % 2 === 0) {
        drawText(ctx, '[E]', bx + BOX.w - 22, by + BOX.h - 11, '#e4c97c');
      }
    } else if (this.state === 'target') {
      // timing bar
      ctx.fillStyle = '#233042';
      ctx.fillRect(bx + 8, by + 14, BOX.w - 16, BOX.h - 30);
      ctx.fillStyle = '#e4c97c';
      ctx.fillRect(bx + 8 + Math.round((BOX.w - 16) * 0.44), by + 12, 3, BOX.h - 26);
      ctx.fillRect(bx + 8 + Math.round((BOX.w - 16) * 0.56) - 3, by + 12, 3, BOX.h - 26);
      ctx.fillStyle = '#f4efe4';
      ctx.fillRect(Math.round(this.cursorX) - 1, by + 10, 3, BOX.h - 22);
      drawText(ctx, 'Press E at the center', bx + 8, by + BOX.h - 12, '#8fa3a0');
    } else if (this.state === 'act') {
      const acts = [{ id: 'check', text: 'Check' }].concat(e.def.acts);
      acts.forEach((a, i) => {
        const sel = i === this.subIndex;
        const yy = by + 8 + i * 12;
        if (sel) {
          ctx.drawImage(SPR[Math.floor(gt * 8) % 2 === 0 ? 'soul0' : 'soul1'], bx + 8, yy);
          drawText(ctx, '* ' + a.text, bx + 20, yy + 1, '#ffe9b0');
        } else drawText(ctx, '* ' + a.text, bx + 20, yy + 1, '#c9d4d0');
      });
      drawText(ctx, '[E] choose   [ESC] back', bx + 8, by + BOX.h - 11, '#6f8585');
    } else if (this.state === 'item') {
      const list = Inventory.byCat('consumable');
      list.forEach((it, i) => {
        const sel = i === this.subIndex;
        const d = ITEMS[it.id];
        const yy = by + 8 + i * 12;
        if (i === this.subIndex) {
          ctx.drawImage(SPR[Math.floor(gt * 8) % 2 === 0 ? 'soul0' : 'soul1'], bx + 8, yy);
          drawText(ctx, d.name + ' x' + it.n, bx + 20, yy + 1, '#ffe9b0');
        } else drawText(ctx, d.name + ' x' + it.n, bx + 20, yy + 1, '#c9d4d0');
      });
      drawText(ctx, '[E] use      [ESC] back', bx + 8, by + BOX.h - 11, '#6f8585');
    } else if (this.state === 'mercy') {
      ['Spare', 'Flee'].forEach((m, i) => {
        const sel = i === this.subIndex;
        const yy = by + 10 + i * 13;
        if (sel) {
          ctx.drawImage(SPR[Math.floor(gt * 8) % 2 === 0 ? 'soul0' : 'soul1'], bx + 8, yy);
          drawText(ctx, '* ' + m, bx + 20, yy + 1, '#ffe9b0');
        } else drawText(ctx, '* ' + m, bx + 20, yy + 1, '#c9d4d0');
      });
      drawText(ctx, '[E] choose   [ESC] back', bx + 8, by + BOX.h - 11, '#6f8585');
    } else if (this.state === 'dodge') {
      for (const p of this.projectiles) {
        ctx.fillStyle = p.col;
        if (p.dart) ctx.fillRect(Math.round(p.x) - 3, Math.round(p.y) - 1, 7, 2);
        else if (p.thorn) { ctx.fillRect(Math.round(p.x), Math.round(p.y) - 3, 2, 7); ctx.fillRect(Math.round(p.x) - 2, Math.round(p.y), 6, 1); }
        else if (p.feather) { ctx.fillRect(Math.round(p.x), Math.round(p.y) - 2, 2, 5); ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y), 4, 1); }
        else { ctx.fillRect(Math.round(p.x) - p.r, Math.round(p.y) - p.r, p.r * 2, p.r * 2); ctx.fillStyle = '#f4a6a0'; ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 2, 2); }
      }
      // the soul (lantern flame) — blinks while invulnerable
      if (!(this.invuln > 0 && Math.floor(gt * 16) % 2 === 0)) {
        ctx.drawImage(SPR[Math.floor(gt * 10) % 2 === 0 ? 'soul0' : 'soul1'], Math.round(this.soul.x) - 4, Math.round(this.soul.y) - 4);
      }
    }

    // player status row under the box
    const py = 178;
    drawText(ctx, 'SAILOR', bx + 4, py + 2, '#eae3d2');
    drawText(ctx, 'HP', bx + 52, py + 2, '#8fa3a0');
    const hpMax = 50, hpX = bx + 66;
    ctx.fillStyle = '#4a1d20'; ctx.fillRect(hpX, py + 2, hpMax, 8);
    ctx.fillStyle = '#e8cf6a'; ctx.fillRect(hpX, py + 2, Math.round(hpMax * clamp(Game.hp / Game.maxhp, 0, 1)), 8);
    drawText(ctx, String(Math.max(0, Game.hp)) + ' / ' + Game.maxhp, hpX + hpMax + 8, py + 2, '#eae3d2');

    // menu buttons row
    if (this.state !== 'dodge') {
      MENU_BTN.forEach((b, i) => {
        const sel = i === this.menuIndex;
        const bw = 76, gap = 6;
        const bxx = Math.round((VW - (bw * 4 + gap * 3)) / 2) + i * (bw + gap);
        const byy = 196;
        drawPanel(ctx, bxx, byy, bw, 16, sel ? 1 : 0.72);
        const col = sel ? (b.id === 'mercy' && this.enemy.spareable ? '#e8cf6a' : '#ffe9b0') : '#93a9a8';
        drawText(ctx, b.label, bxx + Math.round((bw - textWidth(b.label)) / 2), byy + 5, col);
        if (sel) {
          ctx.drawImage(SPR[Math.floor(gt * 8) % 2 === 0 ? 'soul0' : 'soul1'], bxx + 4, byy + 4);
        }
      });
    } else {
      drawText(ctx, 'MOVE WITH ARROWS / WASD', 30 + Math.round((VW - 60 - textWidth('MOVE WITH ARROWS / WASD')) / 2), 200, '#6f8585');
    }

    // damage pops
    for (const p of this.dmgPops) {
      const a = clamp(1.1 - p.t, 0, 1);
      ctx.globalAlpha = a;
      drawText(ctx, p.txt, Math.round(p.x - textWidth(p.txt) / 2), Math.round(p.y - p.t * 14), p.col, 1, '#0b141c');
      ctx.globalAlpha = 1;
    }

    if (this.playerHurtFlash > 0) {
      ctx.fillStyle = `rgba(200,40,40,${(this.playerHurtFlash * 0.35).toFixed(2)})`;
      ctx.fillRect(0, 0, VW, VH);
    }
  }
};

</script>
<script>
/* ============================================================================
   js/ui.js — every screen and overlay except battle (combat.js draws itself)
     drawHUD          objective + HP + area name + toast + prompt
     drawDialogueBox  portraits, typewriter, choices
     drawInventory    full inventory screen (tabs / details / use / equip)
     drawPause        pause menu (resume/inv/controls/save/restart/sound/title)
     drawControls     shared controls panel — REBUILT so nothing clips
     drawTitle        title screen (menu + controls sub-screen)
     Intro            the Undertale-style opening panel sequence
     drawChapterCard  END OF CHAPTER ONE overlay
   ========================================================================== */
'use strict';

/* ------------------------------------------------------------------- HUD */
function drawObjectivePanel(ctx, t) {
  const text = Game.objective.text;
  const w = Math.min(VW - 16, textWidth(text, 1) + 22);
  const x = 8, y = 8;
  const flash = Math.max(0, Math.min(1, Game.objFlash || 0));
  ctx.globalAlpha = 0.92;
  drawPanel(ctx, x, y, w, 17);
  ctx.globalAlpha = 1;
  if (flash > 0) {
    const pulse = 0.45 + 0.55 * Math.abs(Math.sin(t * 3.2));
    ctx.strokeStyle = `rgba(228,201,124,${(flash * pulse).toFixed(2)})`;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 16);
  }
  ctx.fillStyle = flash > 0 ? '#ffe9a8' : '#e4c97c';
  ctx.fillRect(x + 7, y + 8, 3, 1);
  ctx.fillRect(x + 8, y + 7, 1, 3);
  drawText(ctx, text, x + 14, y + 6, flash > 0 ? '#fff4d2' : '#eae3d2');
}

// layout is a pure function so the harness can verify the text never leaves
// the panel (it used to overhang the right edge by several pixels)
function hpBarLayout() {
  const x = 8, y = 29, w = 96;                 // w = red bar width
  const label = 'HP ' + Math.max(0, Game.hp) + '/' + Game.maxhp;
  const icon = 15;                              // flame icon + gap
  const gap = 5;                                // bar -> text gap
  const pad = 7;                                // right padding inside panel
  const tw = textWidth(label);
  return {
    x, y, barW: w, label,
    textX: x + icon + w + gap,
    panelW: icon + w + gap + tw + pad
  };
}
function drawHpBar(ctx) {
  const L = hpBarLayout();
  drawPanel(ctx, L.x, L.y, L.panelW, 15, 0.92);
  // little lantern flame icon
  ctx.drawImage(SPR[Math.floor(Game.time * 6) % 2 === 0 ? 'soul0' : 'soul1'], L.x + 4, L.y + 4);
  ctx.fillStyle = '#4a1d20';
  ctx.fillRect(L.x + 15, L.y + 5, L.barW, 6);
  const frac = clamp(Game.hp / Game.maxhp, 0, 1);
  ctx.fillStyle = frac > 0.5 ? '#e8cf6a' : frac > 0.25 ? '#e0a23b' : '#d8452e';
  ctx.fillRect(L.x + 15, L.y + 5, Math.round(L.barW * frac), 6);
  drawText(ctx, L.label, L.textX, L.y + 4, '#eae3d2');
}

function drawAreaName(ctx) {
  if (!Game.areaNameT || Game.areaNameT <= 0 || !World.area) return;
  const a = Math.min(1, Math.min(Game.areaNameT, 3.2 - Game.areaNameT) * 2);
  const name = Areas[World.areaId] ? Areas[World.areaId].name : '';
  if (!name) return;
  ctx.globalAlpha = clamp(a, 0, 1) * 0.9;
  const w = textWidth(name) + 18;
  drawPanel(ctx, Math.round((VW - w) / 2), 10, w, 15);
  drawText(ctx, name, Math.round((VW - textWidth(name)) / 2), 14, '#dfe8e2');
  ctx.globalAlpha = 1;
}

function drawToast(ctx) {
  if (!Game.toast || Game.toastT <= 0) return;
  const a = clamp(Math.min(Game.toastT, 3.4 - Game.toastT) * 3, 0, 1);
  const w = textWidth(Game.toast) + 20;
  const x = Math.round((VW - w) / 2), y = 52;
  ctx.globalAlpha = a;
  drawPanel(ctx, x, y, w, 17);
  drawText(ctx, Game.toast, x + 10, y + 6, '#d8f0e6');
  ctx.globalAlpha = 1;
}

function drawPrompt(ctx, t) {
  const target = Game.nearest;
  if (!target || Game.mode !== 'play') return;
  let label;
  if (target.kind === 'npc') label = 'Talk to ' + target.ref.name;
  else if (target.kind === 'lantern') label = 'Rest at the lantern';
  else label = target.ref.interact.label === 'take' ? 'Take' : (target.ref.interact.label === 'read' ? 'Read' : 'Examine');
  label = 'E: ' + label;
  const w = textWidth(label) + 14;
  const bx = clamp(Math.round(target.sx - w / 2), 4, VW - w - 4);
  const by = clamp(Math.round(target.sy - 24), 16, VH - 24);
  ctx.globalAlpha = 0.82 + Math.sin(t * 3) * 0.08;
  drawPanel(ctx, bx, by, w, 14);
  ctx.globalAlpha = 1;
  drawText(ctx, label, bx + 7, by + 4, '#ffe9b0');
}

function drawHUD(ctx, t) {
  drawObjectivePanel(ctx, t);
  drawHpBar(ctx);
  drawAreaName(ctx);
  drawToast(ctx);
  drawPrompt(ctx, t);
}

/* -------------------------------------------------------- dialogue box */
const DBOX = { x: 8, y: VH - 8 - 78, w: VW - 16, h: 78 };

function drawDialogueBox(ctx, t) {
  if (!Dialogue.active) return;
  const a = Dialogue.boxAlpha;
  const b = DBOX;
  drawPanel(ctx, b.x, b.y, b.w, b.h, a);
  const node = Dialogue.node;
  if (node) {
    const sp = SPEAKERS[node.who] || SPEAKERS['???'];
    if (sp.portrait && SPR[sp.portrait]) {
      const spr = SPR[sp.portrait];
      ctx.globalAlpha = a;
      ctx.fillStyle = '#0d1820';
      ctx.fillRect(b.x + 8, b.y + 10, 32, 32);
      ctx.fillStyle = '#1a2833';
      ctx.fillRect(b.x + 9, b.y + 11, 30, 30);
      ctx.drawImage(spr, b.x + 10, b.y + 12, 28, 28);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(228,201,124,0.35)';
      ctx.fillRect(b.x + 8, b.y + 9, 32, 1);
      ctx.fillRect(b.x + 8, b.y + 42, 32, 1);
    }
    const nameW = textWidth(node.who) + 12;
    ctx.fillStyle = '#0b141c';
    ctx.fillRect(b.x + 6, b.y - 7, nameW, 12);
    ctx.fillStyle = '#1d3040';
    ctx.fillRect(b.x + 7, b.y - 6, nameW - 2, 10);
    drawText(ctx, node.who, b.x + 12, b.y - 4, sp.color);

    const lines = Dialogue.visibleLines();
    const tx = b.x + (sp.portrait ? 46 : 12), ty = b.y + 12;
    for (let i = 0; i < lines.length && i < 4; i++) {
      drawText(ctx, lines[i], tx, ty + i * 12, node.think ? '#9fb3ae' : '#f2ecdf');
    }
    if (!Dialogue.typing && !Dialogue.choiceOpen) {
      if (Math.floor(t * 2.5) % 2 === 0) {
        const ax = b.x + b.w - 14, ay = b.y + b.h - 12;
        ctx.fillStyle = '#e4c97c';
        ctx.fillRect(ax, ay, 5, 1);
        ctx.fillRect(ax + 1, ay + 1, 3, 1);
        ctx.fillRect(ax + 2, ay + 2, 1, 1);
      }
    }
  }
  if (Dialogue.choiceOpen && Dialogue.choiceNode) {
    const opts = Dialogue.choiceNode.options;
    const chH = 14, boxH = opts.length * chH + 8;
    let maxW = 0;
    opts.forEach(o => maxW = Math.max(maxW, textWidth(o.text)));
    const boxW = Math.min(VW - 24, maxW + 26);
    const bx = VW - 12 - boxW, by = b.y - boxH - 6;
    drawPanel(ctx, bx, by, boxW, boxH, 1);
    for (let i = 0; i < opts.length; i++) {
      const oy = by + 5 + i * chH;
      const sel = i === Dialogue.choiceIndex;
      if (sel) {
        ctx.fillStyle = '#2c4356';
        ctx.fillRect(bx + 3, oy - 2, boxW - 6, 11);
        ctx.drawImage(SPR[Math.floor(t * 8) % 2 === 0 ? 'soul0' : 'soul1'], bx + 5, oy + 1);
      }
      drawText(ctx, opts[i].text, bx + 15, oy, sel ? '#fff6dc' : '#b9c9c6');
    }
  }
}

/* ---------------------------------------------------- inventory screen */
const INV_TABS = [
  { id: 'all', label: 'ALL' },
  { id: 'consumable', label: 'FOOD' },
  { id: 'key', label: 'KEY' },
  { id: 'equip', label: 'GEAR' }
];

function drawInventory(ctx, t) {
  ctx.fillStyle = 'rgba(8,14,20,0.78)';
  ctx.fillRect(0, 0, VW, VH);
  const px0 = 10, py0 = 8, pw = VW - 20, ph = VH - 16;
  drawPanel(ctx, px0, py0, pw, ph);
  drawText(ctx, 'POCKETS', px0 + 10, py0 + 7, '#e4c97c');
  drawText(ctx, Game.hp + '/' + Game.maxhp + ' HP', px0 + pw - 10 - textWidth(Game.hp + '/' + Game.maxhp + ' HP'), py0 + 7, '#9fb3ae');
  drawDivider(ctx, px0 + 8, py0 + 17, pw - 16);

  // tabs
  const tabY = py0 + 22;
  let tx0 = px0 + 10;
  for (const tab of INV_TABS) {
    const sel = Game.invTab === tab.id;
    const tw = textWidth(tab.label) + 12;
    if (sel) {
      drawPanel(ctx, tx0, tabY, tw, 13);
      drawText(ctx, tab.label, tx0 + 6, tabY + 3, '#ffe9b0');
    } else {
      ctx.fillStyle = '#20323e';
      ctx.fillRect(tx0, tabY, tw, 13);
      drawText(ctx, tab.label, tx0 + 6, tabY + 3, '#93a9a8');
    }
    tx0 += tw + 4;
  }

  // item list (left)
  const list = Game.invTab === 'all' ? Inventory.slots : Inventory.byCat(Game.invTab);
  const listX = px0 + 10, listY = tabY + 20;
  const rowH = 13, maxRows = 9;
  Game.invScroll = clamp(Game.invScroll, 0, Math.max(0, list.length - maxRows));
  if (Game.invIndex >= list.length) Game.invIndex = list.length - 1;
  if (Game.invIndex < 0) Game.invIndex = 0;
  if (Game.invIndex < Game.invScroll) Game.invScroll = Game.invIndex;
  if (Game.invIndex >= Game.invScroll + maxRows) Game.invScroll = Game.invIndex - maxRows + 1;
  for (let i = 0; i < Math.min(maxRows, list.length); i++) {
    const idx = Game.invScroll + i;
    const entry = list[idx];
    const d = ITEMS[entry.id];
    const sel = idx === Game.invIndex;
    const ry = listY + i * rowH;
    if (sel) {
      ctx.fillStyle = '#2c4356';
      ctx.fillRect(listX, ry - 2, 178, 12);
    }
    if (d && SPR[d.icon]) ctx.drawImage(SPR[d.icon], listX + 2, ry - 1);
    let label = d ? d.name : entry.id;
    if (d && d.cat === 'consumable' && entry.n > 1) label += ' x' + entry.n;
    drawText(ctx, label, listX + 17, ry, sel ? '#fff6dc' : '#c9d4d0');
    if (d && Inventory.isEquipped(d.id)) drawText(ctx, 'E', listX + 166, ry, '#e8cf6a');
  }
  if (list.length === 0) {
    drawText(ctx, '(empty)', listX + 2, listY, '#5f7370');
  }
  if (list.length > maxRows) {
    drawText(ctx, Game.invScroll > 0 ? '^' : ' ', listX + 184, listY - 1, '#6f8585');
    drawText(ctx, Game.invScroll + maxRows < list.length ? 'v' : ' ', listX + 184, listY + (maxRows - 1) * rowH, '#6f8585');
  }

  // detail panel (right)
  const dX = px0 + 208, dW = pw - 218;
  const sel = list[Game.invIndex];
  const d = sel ? ITEMS[sel.id] : null;
  ctx.fillStyle = '#101c24';
  ctx.fillRect(dX, listY - 3, dW, ph - (listY - py0) - 22);
  if (d) {
    if (SPR[d.icon]) {
      ctx.drawImage(SPR[d.icon], dX + 6, listY + 4, 36, 36);
      const catLabel = d.cat === 'consumable' ? 'FOOD' : d.cat === 'key' ? 'KEY ITEM' : 'GEAR';
      drawText(ctx, catLabel, dX + 48, listY + 6, '#93a9a8');
      drawText(ctx, d.name, dX + 6, listY + 46, '#ffe9b0');
      let stats = '';
      if (d.cat === 'consumable') stats = 'Heals ' + d.heal + ' HP';
      if (d.slot === 'weapon') stats = 'ATK +' + d.atk + (Inventory.isEquipped(d.id) ? '  [equipped]' : '');
      if (d.slot === 'charm') stats = 'DEF +' + d.def + (Inventory.isEquipped(d.id) ? '  [equipped]' : '');
      if (stats) drawText(ctx, stats, dX + 6, listY + 58, '#9fd8a8');
      const lines = wrapText(d.desc, (dW - 12) / 6 | 0);
      for (let i = 0; i < lines.length && i < 6; i++) {
        drawText(ctx, lines[i], dX + 6, listY + 72 + i * 11, '#c9d4d0');
      }
    }
  }

  // hints
  const hint = d
    ? (d.cat === 'consumable' ? 'E: use   TAB: tabs   ESC: close'
      : d.cat === 'equip' ? 'E: equip   TAB: tabs   ESC: close'
      : 'TAB: tabs   ESC: close')
    : 'TAB: tabs   ESC: close';
  drawText(ctx, hint, px0 + 10, py0 + ph - 14, '#6f8585');
}
